<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title id="page-title">V2 Simulator — NHIT VisualLab</title>
  <meta id="page-desc" name="description" content="Interactive engineering simulator powered by the Python FastAPI physics engine and Three.js WebGL." />

  <link rel="stylesheet" href="/css/simulator.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}, {left: '$', right: '$', display: false}]});"></script>
</head>
<body>
<script>window.TOOL_ID = "__TOOL_ID__";</script>
<div id="app">
  <div class="top-nav">
    <div class="breadcrumb">
      <a href="/nhitvisuallab/index.html">← All Simulators</a>
      <span>/</span>
      <span id="crumb-cat">Strength of Materials</span>
      <span>/</span>
      <span style="color:var(--text);font-weight:600;" id="crumb-tool">V2</span>
    </div>
    <div id="ws-badge" class="ws-status-badge">
      <span class="ws-dot"></span>
      <span id="ws-text">Connecting to Python Engine...</span>
    </div>
  </div>

  <header>
    <h1 id="tool-title">Simulator</h1>
    <p class="subtitle" id="tool-subtitle">Python Mechanics Engine &bull; Real-Time WebGL 3D Visualization</p>
  </header>

  <div class="controls-bar">
    <div class="ctrl-group">
      <span class="ctrl-label">Mode</span>
      <div class="pill-tabs" id="mode-tabs">
        <button class="pill active" data-mode="simulate">Simulate</button>
        <button class="pill" data-mode="3d-model">3D Model</button>
        <button class="pill" data-mode="explore">Explore</button>
        <button class="pill" data-mode="practice">Practice</button>
        <button class="pill" data-mode="quiz">Quiz</button>
      </div>
    </div>
    <div class="ctrl-group" id="preset-group" style="display:none;">
      <span class="ctrl-label">Preset</span>
      <select id="preset-select" class="btn-secondary" style="background:var(--bg-input);padding:6px 12px;outline:none;cursor:pointer;">
        <option value="">-- Load Preset --</option>
      </select>
    </div>
    <div class="head-actions" id="related-links"></div>
  </div>

  <section id="section-simulate" class="mode-section active">
    <div class="sim-grid">
      <div class="canvas-card">
        <div class="canvas-mode-toggle">
          <button id="btn-toggle-explode" title="Explode assembly outward">💥 Exploded View</button>
          <button id="btn-reset-cam" title="Reset 3D Camera view">🎥 Reset View</button>
        </div>
        <div class="viewport-container">
          <canvas id="webgl-canvas"></canvas>
          <div class="canvas-overlay-hint">Left Drag: Orbit &bull; Right Drag: Pan &bull; Scroll: Zoom</div>
        </div>
        <div style="margin-top:14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:10px;">
          <div style="font-size:0.8rem;font-weight:700;color:var(--accent);margin-bottom:6px;" id="schematic-label">Working 2D Schematic</div>
          <canvas id="2d-schematic-canvas" style="width:100%;height:200px;display:block;border-radius:6px;"></canvas>
        </div>
      </div>

      <div class="controls-panel">
        <div class="panel-header">
          <span class="panel-title" id="panel-title">&#9881; Parameters</span>
        </div>
        <div id="control-blocks"></div>
        <div id="telemetry-box" class="telemetry-box"></div>
      </div>
    </div>
  </section>

  <section id="section-explore" class="mode-section">
    <div class="cards-grid" id="explore-cards"></div>
  </section>

  <section id="section-practice" class="mode-section">
    <div id="practice-content"></div>
  </section>

  <section id="section-quiz" class="mode-section">
    <div id="quiz-content"></div>
  </section>

  <footer class="site-footer">
    <div class="footer-nav">
      <a href="/nhitvisuallab/index.html">Home</a>
    </div>
    <p>&copy; 2026 NHIT VisualLab &bull; Simulators Platform V2</p>
  </footer>
</div>

<script src="/js/v2_shared.js"></script>
<script src="/js/v2_configs_auto.js"></script>
<script src="/js/v2_configs.js"></script>
<script src="/js/v2_2d.js"></script>
<script>if(!/embed/.test(location.search)){var s=document.createElement('script');s.src='/nhitvisuallab/shared/sidebar/sidebar.js';document.head.appendChild(s);}</script>
</body>
</html>
