version: "3.8"

services:
  vlab-simulators:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: vlab-simulators:production
    container_name: vlab-simulators-prod
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=4
      - LOG_LEVEL=info
    volumes:
      - static_models:/workspace/frontend/models
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  static_models:
    name: vlab_static_models
