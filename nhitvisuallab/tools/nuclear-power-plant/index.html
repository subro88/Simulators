<script>
window.PG_CONFIG = {
  slug: 'nuclear-power-plant',
  title: 'Nuclear Power Plant (PWR)',
  mode: 'nuclear',
  capacityMW: 1000,
  intro: 'You run a pressurised-water reactor. Withdraw control rods to raise core power, keep coolant flowing, and match turbine output to the grid — without a SCRAM.',
  howto: [
    'Withdraw <b>control rods</b> to raise reactor core temperature and secondary steam pressure.',
    'Set the <b>coolant pump</b> high enough to remove heat — low coolant risks a SCRAM.',
    'Open the <b>turbine valve</b> to convert steam into MW that tracks grid demand.',
    'If core temperature, steam pressure or condenser temperature exceed limits the reactor <b>SCRAMs</b> — let it cool, then restart slowly.',
    'Keep the green <b>MATCH</b> lit across 3 days for a top score.'
  ],
  controls: [
    { id: 'rods', label: 'Control rods (withdraw)', min: 0, max: 100, step: 1, val: 65, unit: '%' },
    { id: 'turbine', label: 'Turbine valve', min: 0, max: 100, step: 1, val: 70, unit: '%' },
    { id: 'coolant', label: 'Coolant pump', min: 0, max: 100, step: 1, val: 80, unit: '%' }
  ],
  gauges: [
    { id: 'out', label: 'Output', unit: 'MW', max: 1150, value: st => st.out },
    { id: 'core', label: 'Core T', unit: '°C', max: 750, warnAt: 600, badAt: 700, value: st => st.Tcore },
    { id: 'spres', label: 'Steam P', unit: 'bar', max: 42, warnAt: 34, badAt: 40, value: st => st.Ps },
    { id: 'cool', label: 'Coolant', unit: '%', max: 100, value: st => st.coolant }
  ],
  facts: [
    'A 1000 MW nuclear plant needs only about <b>118 kg of uranium fuel per day</b> — a coal plant of the same size burns roughly <b>14,000,000 kg</b> of coal.',
    'In a PWR the water in the <b>primary loop</b> stays under high pressure so it never boils, transferring heat to a separate steam loop.',
    'Control rods contain boron or hafnium that <b>absorb neutrons</b>; inserting them slows the fission chain reaction.',
    'Nuclear plants run best at <b>steady base-load</b> — they are slow to ramp, unlike gas turbines.'
  ],
  quiz: [
    { q: 'Withdrawing control rods causes the core to:', opts: ['Cool down', 'Produce more fission power', 'SCRAM', 'Stop'], a: 1, why: 'Fewer neutrons are absorbed, so the fission chain reaction rates up and core power rises.' },
    { q: 'The purpose of the coolant pump is to:', opts: ['Make electricity', 'Remove heat from the core', 'Spin the turbine', 'Filter steam'], a: 1, why: 'Coolant carries fission heat away; insufficient flow lets the core overheat and triggers a SCRAM.' },
    { q: 'A SCRAM is:', opts: ['A routine shutdown', 'An emergency reactor trip', 'A fuel refill', 'A turbine test'], a: 1, why: 'SCRAM is the rapid emergency insertion of control rods to halt the chain reaction.' },
    { q: 'In a PWR, the primary coolant:', opts: ['Boils in the core', 'Stays liquid under pressure and heats a separate steam loop', 'Goes straight to the turbine', 'Is radioactive waste'], a: 1, why: 'High pressure keeps primary water liquid; it transfers heat to a secondary loop that makes the turbine steam.' },
    { q: 'Nuclear fuel use per day for 1000 MW is about:', opts: ['14,000 tonnes coal-equiv', '118 kg uranium', '1 tonne oil', '500 kg gas'], a: 1, why: 'Uranium’s energy density is enormous — ~118 kg/day versus millions of kg of coal.' }
  ],
  outro: 'Well controlled! Compare this to the coal & gas plant to see how fuel, safety limits and ramp speed differ.'
};
