<text x="30" y="72" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#dde3f0" text-anchor="start">Lap joint</text>
<text x="730" y="72" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#8b95b3" text-anchor="end">Single shear — 1 shear plane</text>
