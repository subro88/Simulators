<title id="t">Types of riveted joints — lap, single-strap butt and double-strap butt</title>
<desc id="d">Three riveted joint types in section: a lap joint and a single-strap butt joint with rivets in single shear, and a double-strap butt joint with rivets in double shear.</desc>
