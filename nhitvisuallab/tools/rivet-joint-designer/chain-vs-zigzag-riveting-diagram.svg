<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Chain versus zigzag riveting — pitch, back pitch, diagonal pitch and margin</title>
<desc id="d">Plan view comparing chain riveting, where rivets in successive rows align and the plate tears along one straight transverse line, with zigzag or staggered riveting, where rows are offset by half a pitch and the tearing path runs diagonally.</desc>
