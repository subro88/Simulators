<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">The three failure modes of a riveted joint — tearing, shearing and crushing</title>
<desc id="d">Three panels showing plate tearing between rivet holes, shearing of the rivet shank across the shear plane, and crushing or bearing failure where the rivet bears on the plate.</desc>
<rect width="760" height="300" fill="#161b27" rx="10"/>
<text x="380.0" y="30" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:600" fill="#dde3f0" text-anchor="middle">The Three Failure Modes of a Riveted Joint</text>
<rect x="30" y="56" width="223" height="180" fill="#1f2535" stroke="#2a3050" rx="6"/>
<rect x="54" y="100" width="174" height="60" fill="#39415e" stroke="#2a3050"/>
<circle cx="141" cy="130" r="17" fill="#161b27" stroke="#2a3050"/>
<path d="M141 113 L137 100" stroke="#e0685f" stroke-width="2.6"/>
<path d="M141 147 L145 160" stroke="#e0685f" stroke-width="2.6"/>
<path d="M44 130 L32 130" stroke="#4d8fb0" stroke-width="2"/>
<path d="M239 130 L251 130" stroke="#4d8fb0" stroke-width="2"/>
<text x="141" y="182" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">plate tears through the</text>
<text x="141" y="195" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">weakened section (p &#8722; d)</text>
<text x="141" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#dde3f0" text-anchor="middle">Tearing of the plate</text>
<text x="141" y="224" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">P<tspan baseline-shift='sub' font-size='9'>t</tspan> = (p &#8722; d)&#183;t&#183;&#963;<tspan baseline-shift='sub' font-size='9'>t</tspan></text>
<rect x="273" y="56" width="223" height="180" fill="#1f2535" stroke="#2a3050" rx="6"/>
<rect x="297" y="96" width="174" height="30" fill="#39415e" stroke="#2a3050"/>
<rect x="297" y="134" width="174" height="30" fill="#2e3550" stroke="#2a3050"/>
<rect x="373" y="96" width="22" height="30" fill="#5fa8cc"/>
<rect x="386" y="134" width="22" height="30" fill="#5fa8cc"/>
<path d="M313 130 L455 130" stroke="#e0685f" stroke-width="2.6" stroke-dasharray="6 4"/>
<text x="384" y="182" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">shank cut across the</text>
<text x="384" y="195" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">shear plane</text>
<text x="384" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#dde3f0" text-anchor="middle">Shearing of the rivet</text>
<text x="384" y="224" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">P<tspan baseline-shift='sub' font-size='9'>s</tspan> = n&#183;(&#960;/4)&#183;d&#178;&#183;&#964;</text>
<rect x="516" y="56" width="223" height="180" fill="#1f2535" stroke="#2a3050" rx="6"/>
<rect x="540" y="100" width="174" height="60" fill="#39415e" stroke="#2a3050"/>
<path d="M611 113 L637 113 A17 17 0 0 1 637 147 L611 147 Z" fill="#5fa8cc"/>
<path d="M610 113 L610 147" stroke="#e0685f" stroke-width="3"/>
<path d="M597 121 L608 121" stroke="#e0685f" stroke-width="1.6"/>
<path d="M597 130 L608 130" stroke="#e0685f" stroke-width="1.6"/>
<path d="M597 139 L608 139" stroke="#e0685f" stroke-width="1.6"/>
<text x="627" y="182" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">rivet or hole crushed</text>
<text x="627" y="195" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">at the bearing face</text>
<text x="627" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#dde3f0" text-anchor="middle">Crushing (bearing)</text>
<text x="627" y="224" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">P<tspan baseline-shift='sub' font-size='9'>c</tspan> = n&#183;d&#183;t&#183;&#963;<tspan baseline-shift='sub' font-size='9'>c</tspan></text>
<text x="380.0" y="284" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">The joint fails in whichever mode gives the least strength — that mode governs the design</text>
</svg>
