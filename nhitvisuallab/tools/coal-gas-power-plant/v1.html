<script>
window.PG_CONFIG = {
  slug: 'coal-gas-power-plant',
  title: 'Coal & Gas Power Plant',
  mode: 'thermal',
  capacityMW: 800,
  fuelRate: 0.5,
  intro: 'You are the control-room operator. Fire the boiler and open the turbine valves to exactly meet the grid demand curve — without over-pressuring the boiler or wasting fuel.',
  howto: [
    'Use <b>Boiler firing</b> to build steam pressure and temperature.',
    'Use the <b>Turbine valve</b> to send that steam to the generator and make MW.',
    'Keep the green <b>MATCH</b> indicator lit — output must sit within ±6% of demand.',
    'If pressure or steam temperature runs too high the boiler <b>trips</b> — back off firing and let it cool before restarting.',
    'Survive 3 days. Your score rewards time spent matched to demand.'
  ],
  controls: [
    { id: 'boiler', label: 'Boiler firing', min: 0, max: 100, step: 1, val: 70, unit: '%' },
    { id: 'turbine', label: 'Turbine valve', min: 0, max: 100, step: 1, val: 70, unit: '%' }
  ],
  gauges: [
    { id: 'out', label: 'Output', unit: 'MW', max: 920, value: st => st.out },
    { id: 'pres', label: 'Boiler P', unit: 'bar', max: 42, warnAt: 32, badAt: 38, value: st => st.P },
    { id: 'stemp', label: 'Steam T', unit: '°C', max: 100, warnAt: 80, badAt: 92, value: st => st.Tc },
    { id: 'fuel', label: 'Fuel', unit: 't/h', max: 60, value: st => st.fuel }
  ],
  facts: [
    'A 800 MW coal unit burns roughly <b>3–4 tonnes of coal every minute</b> at full load.',
    'About <b>40%</b> of the heat released ends up as electricity; the rest leaves via the cooling tower.',
    'The steam turbine spins at a fixed <b>3000 RPM</b> (50 Hz grids) so generator frequency stays locked to the grid.',
    'Cooling towers do not emit smoke — the white plume is just <b>water vapour</b> condensing.'
  ],
  quiz: [
    { q: 'What does raising boiler firing primarily increase?', opts: ['Turbine speed', 'Steam pressure & temperature', 'Grid frequency', 'Cooling water flow'], a: 1, why: 'More firing raises furnace heat, which increases both steam pressure and temperature feeding the turbine.' },
    { q: 'Why must output stay within ±6% of demand?', opts: ['To save coal', 'Grid frequency is stabilised by matching generation to load', 'To avoid noise', 'Turbines dislike steady load'], a: 1, why: 'On a real grid, generation must closely match demand or frequency (and thus stability) drifts.' },
    { q: 'A boiler trip is caused by:', opts: ['Low demand', 'Excess pressure or steam temperature', 'High score', 'Opening turbine valve'], a: 1, why: 'Over-pressure or over-temperature protection shuts the boiler down to avoid vessel damage.' },
    { q: 'The white plume from a cooling tower is:', opts: ['Smoke', 'Water vapour', 'CO₂', 'Ash'], a: 1, why: 'Cooling towers reject waste heat; the visible plume is condensed water vapour, not combustion products.' },
    { q: 'Where is electrical power actually generated?', opts: ['Boiler', 'Cooling tower', 'Generator (turbine-coupled)', 'Feed pump'], a: 2, why: 'The steam turbine drives a generator that converts mechanical rotation into electrical power.' }
  ],
  outro: 'Great shift! Try the nuclear PWR simulator next to see how a different heat source changes the control problem.'
};
</script>
