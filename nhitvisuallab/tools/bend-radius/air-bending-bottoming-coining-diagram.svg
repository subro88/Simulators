<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Air bending, bottoming and coining compared</title>
<desc id="d">Three press brake bending methods shown in section: air bending where the sheet touches only the punch tip and the two die shoulders, bottoming where the sheet is formed onto the die walls, and coining where the punch penetrates the material.</desc>
<rect width="760" height="330" fill="#161b27" rx="10"/>
<text x="380.0" y="30" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:600" fill="#dde3f0" text-anchor="middle">Air Bending vs Bottoming vs Coining</text>
<rect x="30" y="52" width="223" height="212" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="141" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Air bending</text>
<path d="M60.0 196 L82.0 196 L141 240 L200.0 196 L222.0 196 L222.0 226 L60.0 226 Z" fill="#2e3550" stroke="#2a3050"/>
<path d="M132 96 L150 96 L150 186 L141 199 L132 186 Z" fill="#5fa8cc" stroke="#2a3050"/>
<path d="M68.0 188 L141 198 L214.0 188" stroke="#5fa8cc" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="141" y="288" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Sheet touches 3 points only</text>
<text x="141" y="303" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#5fa8cc" text-anchor="middle">Most common &#183; springback highest</text>
<path d="M82.0 166 L200.0 166" stroke="#4d8fb0" stroke-width="1.2"/>
<path d="M82.0 162 L82.0 170 M200.0 162 L200.0 170" stroke="#4d8fb0" stroke-width="1.2"/>
<text x="141.0" y="159" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">V</text>
<text x="216.0" y="163" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10px;font-weight:500" fill="#4d8fb0" text-anchor="start">die opening</text>
<rect x="273" y="52" width="223" height="212" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="384" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Bottoming</text>
<path d="M303.0 196 L325.0 196 L384 240 L443.0 196 L465.0 196 L465.0 226 L303.0 226 Z" fill="#2e3550" stroke="#2a3050"/>
<path d="M375 96 L393 96 L393 200 L384 213 L375 200 Z" fill="#5fa8cc" stroke="#2a3050"/>
<path d="M311.0 188 L384 210 L457.0 188" stroke="#7fbfa8" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="384" y="288" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Formed onto the die walls</text>
<text x="384" y="303" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#7fbfa8" text-anchor="middle">Less springback &#183; more tonnage</text>
<rect x="516" y="52" width="223" height="212" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="627" y="76" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Coining</text>
<path d="M546.0 196 L568.0 196 L627 240 L686.0 196 L708.0 196 L708.0 226 L546.0 226 Z" fill="#2e3550" stroke="#2a3050"/>
<path d="M618 96 L636 96 L636 210 L627 223 L618 210 Z" fill="#5fa8cc" stroke="#2a3050"/>
<path d="M554.0 188 L627 220 L700.0 188" stroke="#e8b23a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="627" y="288" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Punch penetrates the sheet</text>
<text x="627" y="303" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">Least springback &#183; ~5&#215; tonnage</text>
<text x="380.0" y="322" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Air bending sets the angle by punch depth &#8212; the other two set it by the tooling</text>
</svg>
