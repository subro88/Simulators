<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
<title id="t">Bend allowance versus bend deduction in sheet metal flat pattern</title>
<desc id="d">Comparison of bend allowance, the arc length added along the neutral axis, with bend deduction, the amount subtracted from the sum of the two outside flange dimensions to obtain the flat pattern length.</desc>
<rect width="760" height="430" fill="#161b27" rx="10"/>
<text x="380.0" y="30" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:600" fill="#dde3f0" text-anchor="middle">Bend Allowance vs Bend Deduction</text>
<text x="180" y="62" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#dde3f0" text-anchor="middle">Formed part</text>
<path d="M114 224 L210 224 A34 34 0 0 1 244 190 L244 94 L270 94 L270 190 A60 60 0 0 0 210 250 L114 250 Z" fill="#39415e" stroke="#2a3050" stroke-width="1"/>
<path d="M114 284 L270 284" stroke="#43c66a" stroke-width="1.2"/>
<path d="M114 280 L114 288 M270 280 L270 288" stroke="#43c66a" stroke-width="1.2"/>
<text x="192.0" y="299" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#43c66a" text-anchor="middle">A</text>
<text x="180" y="316" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#43c66a" text-anchor="middle">outside flange A</text>
<path d="M310 94 L310 250" stroke="#43c66a" stroke-width="1.2"/>
<path d="M306 94 L314 94 M306 250 L314 250" stroke="#43c66a" stroke-width="1.2"/>
<text x="318" y="176.0" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#43c66a" text-anchor="start">B</text>
<text x="322" y="86" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:500" fill="#43c66a" text-anchor="start">outside</text>
<text x="322" y="99" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:500" fill="#43c66a" text-anchor="start">flange B</text>
<path d="M210.0 235.4 A45.44 45.44 0 0 1 164.6 190.0" stroke="#e8b23a" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
<text x="164" y="251.44" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">BA = arc of</text>
<text x="164" y="264.44" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">neutral axis</text>
<text x="600" y="62" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#dde3f0" text-anchor="middle">Flat blank (what you cut)</text>
<rect x="430" y="250" width="290" height="26" fill="#2e3550" stroke="#2a3050"/>
<path d="M580 242 L580 284" stroke="#e8b23a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="580" y="302" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">bend line</text>
<path d="M430 228 L720 228" stroke="#4d8fb0" stroke-width="1.2"/>
<path d="M430 224 L430 232 M720 224 L720 232" stroke="#4d8fb0" stroke-width="1.2"/>
<text x="575.0" y="221" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">Flat length L</text>
<rect x="556" y="250" width="48" height="26" fill="#e8b23a" opacity="0.28"/>
<text x="580" y="267" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600" fill="#e8b23a" text-anchor="middle">BA</text>
<rect x="30" y="322" width="335" height="84" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="197" y="346" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">Route 1 &#8212; add the allowance</text>
<text x="197" y="370" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#dde3f0" text-anchor="middle">L = a + b + BA</text>
<text x="197" y="391" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">a, b measured to the bend tangent lines</text>
<rect x="395" y="322" width="335" height="84" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="562" y="346" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#43c66a" text-anchor="middle">Route 2 &#8212; subtract the deduction</text>
<text x="562" y="370" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#dde3f0" text-anchor="middle">L = A + B &#8722; BD</text>
<text x="562" y="391" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">A, B are the outside flange dimensions</text>
<text x="380.0" y="422" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Same answer, different inputs &#8212; BD = 2&#183;OSSB &#8722; BA</text>
</svg>
