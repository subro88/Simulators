<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
<title id="t">K-factor and the neutral axis in a sheet metal bend</title>
<desc id="d">Section through a 90 degree sheet metal bend showing material thickness T, inside bend radius R, bend angle A and the neutral axis offset t, with K-factor defined as K equals t divided by T.</desc>
<rect width="760" height="430" fill="#161b27" rx="10"/>
<text x="380.0" y="30" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:600" fill="#dde3f0" text-anchor="middle">K-Factor &#8212; Where the Neutral Axis Sits</text>
<path d="M180 256 L300 256 A46 46 0 0 1 346 210 L346 90 L388 90 L388 210 A88 88 0 0 0 300 298 L180 298 Z" fill="#39415e" stroke="#2a3050" stroke-width="1"/>
<path d="M300.0 274.5 A64.48 64.48 0 0 1 235.5 210.0" stroke="#e8b23a" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/>
<path d="M180 274.48 L300 274.48" stroke="#e8b23a" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/>
<path d="M364.48 210 L364.48 90" stroke="#e8b23a" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/>
<path d="M250 274.48 L250 344" stroke="#e8b23a" stroke-width="1.1" fill="none"/>
<text x="250" y="360" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#e8b23a" text-anchor="middle">neutral axis</text>
<text x="250" y="374" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">K&#215;T in from the inside face</text>
<path d="M156 256 L156 298" stroke="#4d8fb0" stroke-width="1.2"/>
<path d="M152 256 L160 256 M152 298 L160 298" stroke="#4d8fb0" stroke-width="1.2"/>
<text x="148" y="281.0" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="end">T</text>
<text x="152" y="250" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:500" fill="#4d8fb0" text-anchor="end">thickness</text>
<path d="M300 210 L300 256" stroke="#8b95b3" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<text x="294" y="237.0" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="end">R</text>
<circle cx="300" cy="210" r="3" fill="#8b95b3"/>
<text x="308" y="204" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:500" fill="#8b95b3" text-anchor="start">bend centre</text>
<path d="M300.0 236.0 A26 26 0 0 1 274.0 210.0" stroke="#4d8fb0" stroke-width="1.4" fill="none"/>
<text x="274" y="244" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600" fill="#4d8fb0" text-anchor="middle">A</text>
<rect x="470" y="120" width="250" height="150" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="595" y="150" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:600" fill="#e8b23a" text-anchor="middle">K = t / T</text>
<text x="595" y="178" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">the neutral axis lies K&#215;T</text>
<text x="595" y="194" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">in from the inside face</text>
<path d="M500 212 L690 212" stroke="#2a3050" stroke-width="1.1" fill="none"/>
<text x="595" y="236" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Typical K &#8776; 0.33 &#8211; 0.50</text>
<text x="595" y="256" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600" fill="#8b95b3" text-anchor="middle">soft alloys low &#183; hard tempers high</text>
<text x="380.0" y="414" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">The neutral axis neither stretches nor compresses &#8212; bend allowance is its arc length</text>
</svg>
