<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Bending with and across the sheet metal grain direction</title>
<desc id="d">Two panels comparing a bend made across the rolling grain, which tolerates a tighter inside radius, with a bend made along the grain, which needs a larger radius because the material is more likely to crack on the outer surface.</desc>
<rect width="760" height="330" fill="#161b27" rx="10"/>
<text x="380.0" y="30" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:600" fill="#dde3f0" text-anchor="middle">Grain Direction &#8212; Why the Same Material Needs Two Radii</text>
<rect x="40" y="56" width="330" height="196" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="205" y="80" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Bend ACROSS the grain</text>
<rect x="80" y="104" width="250" height="84" fill="#39415e" stroke="#2a3050"/>
<path d="M88 114 L322 114" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 125 L322 125" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 136 L322 136" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 147 L322 147" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 158 L322 158" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 169 L322 169" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M88 180 L322 180" stroke="#4a5270" stroke-width="1" fill="none"/>
<text x="336" y="112" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:9.5px;font-weight:500" fill="#8b95b3" text-anchor="start">rolling</text>
<text x="336" y="123" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:9.5px;font-weight:500" fill="#8b95b3" text-anchor="start">direction</text>
<path d="M205 96 L205 196" stroke="#43c66a" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
<text x="205" y="212" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#43c66a" text-anchor="middle">bend line &#8869; grain</text>
<text x="205" y="240" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#43c66a" text-anchor="middle">Tighter radius tolerated</text>
<rect x="410" y="56" width="330" height="196" rx="8" fill="#1f2535" stroke="#2a3050"/>
<text x="575" y="80" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#dde3f0" text-anchor="middle">Bend ALONG the grain</text>
<rect x="450" y="104" width="250" height="84" fill="#39415e" stroke="#2a3050"/>
<path d="M458 114 L692 114" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 125 L692 125" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 136 L692 136" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 147 L692 147" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 158 L692 158" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 169 L692 169" stroke="#4a5270" stroke-width="1" fill="none"/>
<path d="M458 180 L692 180" stroke="#4a5270" stroke-width="1" fill="none"/>
<text x="706" y="112" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:9.5px;font-weight:500" fill="#8b95b3" text-anchor="start">rolling</text>
<text x="706" y="123" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:9.5px;font-weight:500" fill="#8b95b3" text-anchor="start">direction</text>
<path d="M460 146 L690 146" stroke="#e0685f" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
<text x="575" y="212" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10.5px;font-weight:600" fill="#e0685f" text-anchor="middle">bend line &#8741; grain</text>
<text x="575" y="240" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#e0685f" text-anchor="middle">Needs a larger radius</text>
<text x="380.0" y="296" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">Fibres run along the rolling direction. A bend across them stretches many short fibres;</text>
<text x="380.0" y="312" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600" fill="#8b95b3" text-anchor="middle">a bend along them stretches a few long ones &#8212; which is what cracks.</text>
</svg>
