<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- lower medium (the denser block) -->
  <path d="M22 104 H178 V172 a6 6 0 0 1-6 6 H28 a6 6 0 0 1-6-6 Z" fill="#22d3ee" fill-opacity="0.13"/>
  <path d="M22 104 H178 V172 a6 6 0 0 1-6 6 H28 a6 6 0 0 1-6-6 Z" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- boundary -->
  <line x1="22" y1="104" x2="178" y2="104" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round"/>

  <!-- normal -->
  <line x1="100" y1="30" x2="100" y2="178" stroke="#6b7a99" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- angle arcs -->
  <path d="M100 62 A42 42 0 0 1 68.3 76.6" fill="none" stroke="#4f8ef7" stroke-width="2"/>
  <path d="M100 134 A30 30 0 0 1 116.6 128.4" fill="none" stroke="#ff8c42" stroke-width="2"/>

  <!-- incident ray -->
  <line x1="34" y1="42" x2="100" y2="104" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 80 l14 4 l-4 -14 Z" fill="#ff8080"/>

  <!-- refracted ray, bent towards the normal -->
  <line x1="100" y1="104" x2="128" y2="174" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <path d="M117 148 l12 -6 l1 14 Z" fill="#ff8080"/>

  <!-- weak partially reflected ray -->
  <line x1="100" y1="104" x2="160" y2="46" stroke="#ff5555" stroke-width="2" stroke-opacity="0.42" stroke-linecap="round"/>

  <!-- labels -->
  <text x="72" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#4f8ef7" text-anchor="middle">i</text>
  <text x="122" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ff8c42" text-anchor="middle">r</text>
  <text x="30" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">n</text>
</svg>
