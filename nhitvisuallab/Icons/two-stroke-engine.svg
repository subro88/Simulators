<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Cylinder -->
  <rect x="70" y="30" width="60" height="100" rx="2" fill="none" stroke="#1976d2" stroke-width="2.5"/>
  <!-- Cylinder head -->
  <rect x="65" y="26" width="70" height="8" rx="2" fill="#37474f" stroke="#1976d2" stroke-width="1.5"/>
  <!-- Piston -->
  <rect x="74" y="75" width="52" height="14" rx="2" fill="#546e7a" stroke="#90a4ae" stroke-width="1"/>
  <!-- Piston rings -->
  <line x1="76" y1="78" x2="124" y2="78" stroke="#90a4ae" stroke-width="1"/>
  <line x1="76" y1="81" x2="124" y2="81" stroke="#90a4ae" stroke-width="1"/>
  <!-- Piston skirt -->
  <rect x="76" y="89" width="48" height="20" rx="1" fill="rgba(55,71,79,0.5)" stroke="#546e7a" stroke-width="0.5"/>
  <!-- Exhaust port (right, higher) -->
  <rect x="130" y="60" width="12" height="16" rx="2" fill="#ef5350" opacity="0.7"/>
  <text x="148" y="72" fill="#ef5350" font-family="sans-serif" font-size="7" font-weight="bold">EX</text>
  <!-- Transfer port (left, lower) -->
  <rect x="58" y="80" width="12" height="16" rx="2" fill="#42a5f5" opacity="0.7"/>
  <text x="48" y="92" fill="#42a5f5" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="end">TR</text>
  <!-- Connecting rod -->
  <line x1="100" y1="99" x2="112" y2="142" stroke="#78909c" stroke-width="3" stroke-linecap="round"/>
  <!-- Crankcase outline -->
  <path d="M70,130 L55,130 L55,165 L145,165 L145,130 L130,130" fill="none" stroke="#3a4556" stroke-width="2"/>
  <!-- Crankshaft circle -->
  <circle cx="100" cy="148" r="18" fill="none" stroke="#4a5568" stroke-width="1.5"/>
  <!-- Crank arm -->
  <line x1="100" y1="148" x2="112" y2="142" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>
  <!-- Crank center -->
  <circle cx="100" cy="148" r="4" fill="#37474f" stroke="#78909c" stroke-width="1.5"/>
  <!-- Intake port (on crankcase) -->
  <rect x="145" y="143" width="10" height="12" rx="2" fill="#66bb6a" opacity="0.7"/>
  <text x="160" y="152" fill="#66bb6a" font-family="sans-serif" font-size="7" font-weight="bold">IN</text>
  <!-- Spark plug -->
  <rect x="97" y="18" width="6" height="8" rx="1" fill="#fdd835"/>
  <!-- Gas fill hint -->
  <rect x="72" y="34" width="56" height="40" rx="1" fill="rgba(255,152,0,0.12)"/>
  <!-- "2" label -->
  <text x="100" y="188" text-anchor="middle" fill="#1976d2" font-family="sans-serif" font-weight="bold" font-size="16">2-STROKE</text>
</svg>
