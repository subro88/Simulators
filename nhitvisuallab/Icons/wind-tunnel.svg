  <path d="M25 70 L55 85 L55 115 L25 130 Z" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <rect x="55" y="75" width="90" height="50" rx="3" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <path d="M145 75 L175 62 L175 138 L145 125 Z" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <!-- Test object (airfoil) -->
  <ellipse cx="100" cy="100" rx="18" ry="6" fill="#00bcd4" opacity="0.3" stroke="#00bcd4" stroke-width="1.5"/>
  <!-- Streamlines -->
  <path d="M30 82 Q65 82 80 88 Q95 94 120 94 Q140 94 170 82" fill="none" stroke="#4dd0e1" stroke-width="1" opacity="0.6"/>
  <path d="M30 100 Q65 100 80 100 Q95 100 120 100 Q140 100 170 100" fill="none" stroke="#4dd0e1" stroke-width="1" opacity="0.6"/>
  <path d="M30 118 Q65 118 80 112 Q95 106 120 106 Q140 106 170 118" fill="none" stroke="#4dd0e1" stroke-width="1" opacity="0.6"/>
  <!-- Fan blades -->
  <circle cx="168" cy="100" r="8" fill="none" stroke="#00bcd4" stroke-width="1.5"/>
  <line x1="168" y1="92" x2="168" y2="108" stroke="#00bcd4" stroke-width="1.5"/>
  <line x1="160" y1="100" x2="176" y2="100" stroke="#00bcd4" stroke-width="1.5"/>
  <!-- Force arrows -->
  <line x1="100" y1="75" x2="100" y2="60" stroke="#3ddc84" stroke-width="2"/>
  <polygon points="96,63 100,55 104,63" fill="#3ddc84"/>
  <text x="100" y="52" text-anchor="middle" fill="#3ddc84" font-size="10" font-family="sans-serif">L</text>
  <line x1="118" y1="100" x2="133" y2="100" stroke="#ff5555" stroke-width="2"/>
  <polygon points="130,96 138,100 130,104" fill="#ff5555"/>
  <text x="143" y="104" fill="#ff5555" font-size="10" font-family="sans-serif">D</text>
  <!-- Label -->
  <text x="100" y="160" text-anchor="middle" fill="#6b7a99" font-size="11" font-family="sans-serif">Wind Tunnel</text>
  <text x="100" y="175" text-anchor="middle" fill="#4dd0e1" font-size="9" font-family="sans-serif">Drag &#8226; Lift &#8226; Re</text>
</svg>
