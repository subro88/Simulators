<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#1a1f30" stroke="#5c6bc0" stroke-width="2"/>
  <!-- Zero line -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <!-- Hole zone (blue) -->
  <rect x="28" y="32" width="26" height="28" rx="3" fill="#4fc3f7" fill-opacity="0.25" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="41" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#4fc3f7" font-family="sans-serif">H7</text>
  <!-- Shaft zone (green) -->
  <rect x="66" y="55" width="26" height="28" rx="3" fill="#81c784" fill-opacity="0.25" stroke="#81c784" stroke-width="1.5"/>
  <text x="79" y="73" text-anchor="middle" font-size="10" font-weight="bold" fill="#81c784" font-family="sans-serif">g6</text>
  <!-- Clearance arrow -->
  <line x1="60" y1="55" x2="60" y2="60" stroke="#3ddc84" stroke-width="1.2"/>
  <polygon points="60,54 57,58 63,58" fill="#3ddc84"/>
  <!-- Plus/minus symbols -->
  <text x="18" y="38" font-size="8" fill="#6b7a99" font-family="sans-serif">+</text>
  <text x="18" y="80" font-size="8" fill="#6b7a99" font-family="sans-serif">−</text>
  <!-- Label -->
  <text x="60" y="104" text-anchor="middle" font-size="8" font-weight="bold" fill="#5c6bc0" font-family="sans-serif">ISO 286</text>
</svg>
