<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>
  <!-- Fulcrum triangle -->
  <polygon points="100,145 85,170 115,170" fill="#ab47bc" stroke="#ab47bc" stroke-width="2" stroke-linejoin="round"/>
  <!-- Lever beam (tilted slightly) -->
  <line x1="35" y1="150" x2="165" y2="130" stroke="#ab47bc" stroke-width="6" stroke-linecap="round"/>
  <!-- Effort arrow (green, left side, pointing down) -->
  <line x1="50" y1="110" x2="50" y2="148" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="50,150 44,138 56,138" fill="#3ddc84"/>
  <!-- Load arrow (red, right side, pointing down) -->
  <line x1="150" y1="97" x2="150" y2="130" stroke="#ff5555" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="150,132 144,120 156,120" fill="#ff5555"/>
  <!-- Effort label -->
  <text x="50" y="102" fill="#3ddc84" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">E</text>
  <!-- Load label -->
  <text x="150" y="90" fill="#ff5555" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">L</text>
  <!-- MA text label -->
  <text x="100" y="58" fill="#ab47bc" font-family="Courier New, monospace" font-size="28" font-weight="700" text-anchor="middle">MA</text>
  <!-- Fulcrum label -->
  <text x="100" y="186" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">F</text>
</svg>
