<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Left atom (covalent / donor) -->
  <circle cx="22" cy="40" r="9" fill="#1de9b6" opacity="0.95"/>
  <circle cx="22" cy="40" r="18" stroke="#1de9b6" stroke-width="1.4" opacity="0.45"/>
  <circle cx="22" cy="40" r="26" stroke="#1de9b6" stroke-width="0.9" opacity="0.22"/>
  <!-- Left electrons -->
  <circle cx="22" cy="22" r="2.6" fill="#ffffff"/>
  <circle cx="7"  cy="46" r="2.6" fill="#ffffff"/>
  <circle cx="38" cy="34" r="2.6" fill="#ffffff" opacity="0.7"/>

  <!-- Right atom (nonmetal / acceptor) -->
  <circle cx="58" cy="40" r="9" fill="#ff6e40" opacity="0.95"/>
  <circle cx="58" cy="40" r="18" stroke="#ff6e40" stroke-width="1.4" opacity="0.45"/>
  <circle cx="58" cy="40" r="26" stroke="#ff6e40" stroke-width="0.9" opacity="0.22"/>
  <!-- Right electrons -->
  <circle cx="58" cy="58" r="2.6" fill="#ffffff"/>
  <circle cx="73" cy="34" r="2.6" fill="#ffffff"/>

  <!-- Shared / transferred electron in centre (bond) -->
  <circle cx="40" cy="40" r="7"   fill="#ffd740" opacity="0.25"/>
  <circle cx="40" cy="40" r="3.6" fill="#ffd740"/>
</svg>
