<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Diamond bridge wires -->
  <!-- A (left) to B (top) -->
  <line x1="40" y1="100" x2="100" y2="45" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- B (top) to C (right) -->
  <line x1="100" y1="45" x2="160" y2="100" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- A (left) to D (bottom) -->
  <line x1="40" y1="100" x2="100" y2="155" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- D (bottom) to C (right) -->
  <line x1="100" y1="155" x2="160" y2="100" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Galvanometer wire B to D (dashed) -->
  <line x1="100" y1="45" x2="100" y2="155" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- R1 resistor zigzag (A to B) -->
  <polyline points="55,85 59,77 65,93 71,77 77,93 83,77 87,85"
    fill="none" stroke="#4dd0e1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R1 label -->
  <text x="60" y="68" fill="#4dd0e1" font-size="10" font-weight="bold" font-family="sans-serif">R1</text>

  <!-- R3 resistor zigzag (B to C) -->
  <polyline points="115,77 119,69 125,85 131,69 137,85 143,69 147,77"
    fill="none" stroke="#80cbc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R3 label -->
  <text x="135" y="62" fill="#80cbc4" font-size="10" font-weight="bold" font-family="sans-serif">R3</text>

  <!-- R2 resistor zigzag (A to D) -->
  <polyline points="55,115 59,107 65,123 71,107 77,123 83,107 87,115"
    fill="none" stroke="#4dd0e1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R2 label -->
  <text x="60" y="138" fill="#4dd0e1" font-size="10" font-weight="bold" font-family="sans-serif">R2</text>

  <!-- Rx resistor zigzag (D to C) -->
  <polyline points="115,123 119,115 125,131 131,115 137,131 143,115 147,123"
    fill="none" stroke="#ffab40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rx label -->
  <text x="133" y="145" fill="#ffab40" font-size="10" font-weight="bold" font-family="sans-serif">Rx</text>

  <!-- Node dots -->
  <circle cx="40" cy="100" r="4" fill="#26a69a"/>
  <circle cx="100" cy="45" r="4" fill="#26a69a"/>
  <circle cx="160" cy="100" r="4" fill="#26a69a"/>
  <circle cx="100" cy="155" r="4" fill="#26a69a"/>

  <!-- Galvanometer circle at center -->
  <circle cx="100" cy="100" r="14" fill="#1f2535" stroke="#3ddc84" stroke-width="2"/>
  <text x="100" y="104" fill="#3ddc84" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">G</text>

  <!-- Node labels -->
  <text x="28" y="104" fill="#26a69a" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">A</text>
  <text x="100" y="36" fill="#26a69a" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">B</text>
  <text x="172" y="104" fill="#26a69a" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">C</text>
  <text x="100" y="174" fill="#26a69a" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">D</text>

  <!-- Formula -->
  <text x="100" y="192" fill="#26a69a" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">R1/R2 = R3/Rx</text>
</svg>
