<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Chart axes -->
  <line x1="35" y1="160" x2="170" y2="160" stroke="#6b7a99" stroke-width="2"/>
  <line x1="35" y1="40" x2="35" y2="160" stroke="#6b7a99" stroke-width="2"/>
  <!-- Saturation curve -->
  <path d="M 35 155 Q 70 130 100 95 T 165 45" stroke="#14b8a6" stroke-width="2.5" fill="none"/>
  <!-- RH 50% curve -->
  <path d="M 35 158 Q 75 145 110 125 T 165 95" stroke="#14b8a6" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- RH 20% curve -->
  <path d="M 35 159 Q 90 156 130 148 T 165 135" stroke="#14b8a6" stroke-width="1.2" fill="none" opacity="0.4"/>
  <!-- Wet-bulb diagonal -->
  <line x1="60" y1="155" x2="135" y2="60" stroke="#9bebff" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 2"/>
  <!-- Enthalpy diagonal -->
  <line x1="90" y1="160" x2="160" y2="80" stroke="#ffc878" stroke-width="0.8" opacity="0.5" stroke-dasharray="4 3"/>
  <!-- State point -->
  <circle cx="115" cy="115" r="9" fill="#14b8a6" stroke="#fff" stroke-width="2"/>
  <text x="115" y="119" font-family="Courier New, monospace" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">A</text>
  <!-- Crosshair lines -->
  <line x1="35" y1="115" x2="115" y2="115" stroke="#14b8a6" stroke-width="0.6" opacity="0.5" stroke-dasharray="2 2"/>
  <line x1="115" y1="115" x2="115" y2="160" stroke="#14b8a6" stroke-width="0.6" opacity="0.5" stroke-dasharray="2 2"/>
  <!-- Axis labels -->
  <text x="100" y="178" font-family="Segoe UI, sans-serif" font-size="9" fill="#aab3c5" text-anchor="middle">T (°C)</text>
  <text x="22" y="100" font-family="Segoe UI, sans-serif" font-size="9" fill="#aab3c5" text-anchor="middle" transform="rotate(-90 22 100)">W</text>
</svg>
