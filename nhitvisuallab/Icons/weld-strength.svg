<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Bottom plate -->
  <rect x="30" y="110" width="140" height="30" rx="3" fill="#2a3050" stroke="#3a4565" stroke-width="1.5"/>
  <!-- Vertical plate -->
  <rect x="90" y="50" width="30" height="60" rx="3" fill="#2a3050" stroke="#3a4565" stroke-width="1.5"/>
  <!-- Fillet weld triangle (left) -->
  <polygon points="90,110 90,80 60,110" fill="#ff1744" opacity="0.85"/>
  <polygon points="90,110 90,80 60,110" fill="none" stroke="#ff1744" stroke-width="2"/>
  <!-- Fillet weld triangle (right) -->
  <polygon points="120,110 120,80 150,110" fill="#ff1744" opacity="0.85"/>
  <polygon points="120,110 120,80 150,110" fill="none" stroke="#ff1744" stroke-width="2"/>
  <!-- Throat dimension line (left) -->
  <line x1="75" y1="95" x2="90" y2="95" stroke="#dde3f0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="72" y="93" fill="#dde3f0" font-size="9" font-family="sans-serif" text-anchor="end">t</text>
  <!-- Force arrow down -->
  <line x1="105" y1="30" x2="105" y2="48" stroke="#ff1744" stroke-width="2.5"/>
  <polygon points="105,50 100,40 110,40" fill="#ff1744"/>
  <text x="105" y="25" fill="#ff1744" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">P</text>
  <!-- Force arrows horizontal -->
  <line x1="20" y1="125" x2="32" y2="125" stroke="#ff1744" stroke-width="2"/>
  <polygon points="18,125 26,121 26,129" fill="#ff1744"/>
  <line x1="168" y1="125" x2="180" y2="125" stroke="#ff1744" stroke-width="2"/>
  <polygon points="182,125 174,121 174,129" fill="#ff1744"/>
  <!-- Stress label -->
  <text x="100" y="165" fill="#ff1744" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">&#963; = P / A</text>
  <text x="100" y="180" fill="#6b7a99" font-size="9" font-family="sans-serif" text-anchor="middle">Weld Strength</text>
</svg>