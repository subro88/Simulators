<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Support bar -->
  <rect x="30" y="14" width="60" height="6" rx="2" fill="#2a3050" stroke="#26a69a" stroke-width="1.5"/>
  <!-- Hatching -->
  <line x1="38" y1="14" x2="34" y2="20" stroke="#3a4568" stroke-width="1"/>
  <line x1="48" y1="14" x2="44" y2="20" stroke="#3a4568" stroke-width="1"/>
  <line x1="58" y1="14" x2="54" y2="20" stroke="#3a4568" stroke-width="1"/>
  <line x1="68" y1="14" x2="64" y2="20" stroke="#3a4568" stroke-width="1"/>
  <line x1="78" y1="14" x2="74" y2="20" stroke="#3a4568" stroke-width="1"/>
  <line x1="88" y1="14" x2="84" y2="20" stroke="#3a4568" stroke-width="1"/>
  <!-- Hook -->
  <line x1="60" y1="20" x2="60" y2="26" stroke="#26a69a" stroke-width="2"/>
  <!-- Spring coils -->
  <polyline points="60,26 72,31 48,37 72,43 48,49 72,55 48,61 72,67 60,72" fill="none" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom hook -->
  <line x1="60" y1="72" x2="60" y2="76" stroke="#26a69a" stroke-width="2"/>
  <!-- Weight block -->
  <rect x="46" y="76" width="28" height="20" rx="3" fill="rgba(38,166,154,0.25)" stroke="#26a69a" stroke-width="1.5"/>
  <text x="60" y="90" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#26a69a">m</text>
  <!-- Extension arrow -->
  <line x1="82" y1="26" x2="82" y2="72" stroke="#6b7a99" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="89" y="52" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#6b7a99">x</text>
  <!-- Force arrow (down) -->
  <line x1="36" y1="80" x2="36" y2="98" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="36,100 33,95 39,95" fill="#3ddc84"/>
  <text x="36" y="109" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#3ddc84">F</text>
</svg>
