<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cylinder body -->
  <rect x="55" y="30" width="90" height="130" rx="6" fill="#1a2332" stroke="#ff7043" stroke-width="3"/>
  <!-- Piston (higher = expanded) -->
  <rect x="60" y="55" width="80" height="12" rx="3" fill="#ff8a65" opacity="0.9"/>
  <rect x="90" y="30" width="20" height="27" rx="2" fill="#ff8a65" opacity="0.7"/>
  <!-- Gas particles (warm colors) -->
  <circle cx="80" cy="90" r="4" fill="#ff7043" opacity="0.8"/>
  <circle cx="110" cy="85" r="5" fill="#ff5722" opacity="0.7"/>
  <circle cx="95" cy="110" r="4" fill="#ff7043" opacity="0.8"/>
  <circle cx="75" cy="130" r="5" fill="#ff8a65" opacity="0.7"/>
  <circle cx="120" cy="120" r="4" fill="#ff5722" opacity="0.6"/>
  <circle cx="100" cy="145" r="4" fill="#ff7043" opacity="0.7"/>
  <!-- Flame/heat source -->
  <ellipse cx="100" cy="168" rx="20" ry="8" fill="#ff5722" opacity="0.6"/>
  <ellipse cx="100" cy="165" rx="12" ry="12" fill="#ff9800" opacity="0.7"/>
  <ellipse cx="100" cy="162" rx="6" ry="8" fill="#ffeb3b" opacity="0.8"/>
  <!-- Thermometer -->
  <rect x="155" y="50" width="8" height="100" rx="4" fill="#2d3748" stroke="#ff7043" stroke-width="1.5"/>
  <rect x="156" y="90" width="6" height="60" rx="3" fill="#ff5722"/>
  <circle cx="159" cy="155" r="8" fill="#ff5722"/>
  <!-- Label -->
  <text x="100" y="193" text-anchor="middle" fill="#ff8a65" font-family="sans-serif" font-weight="bold" font-size="15">V/T = const</text>
</svg>