<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Column (vertical) -->
  <rect x="48" y="30" width="18" height="140" rx="3" fill="#2a3050" stroke="#00bfa5" stroke-width="1.5"/>

  <!-- Base -->
  <rect x="30" y="160" width="140" height="14" rx="4" fill="#2a3050" stroke="#00bfa5" stroke-width="1.5"/>

  <!-- Worktable -->
  <rect x="62" y="118" width="100" height="12" rx="3" fill="rgba(0,191,165,0.18)" stroke="#00bfa5" stroke-width="2"/>
  <!-- Table T-slots -->
  <line x1="80" y1="121" x2="80" y2="127" stroke="#00bfa5" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="121" x2="100" y2="127" stroke="#00bfa5" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="121" x2="120" y2="127" stroke="#00bfa5" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="121" x2="140" y2="127" stroke="#00bfa5" stroke-width="1" opacity="0.5"/>

  <!-- Knee (below table) -->
  <rect x="62" y="132" width="42" height="26" rx="3" fill="#2a3050" stroke="#00bfa5" stroke-width="1.5"/>

  <!-- Overarm / horizontal beam -->
  <rect x="48" y="36" width="110" height="14" rx="3" fill="#2a3050" stroke="#00bfa5" stroke-width="1.5"/>

  <!-- Spindle housing -->
  <rect x="100" y="50" width="28" height="28" rx="6" fill="rgba(0,191,165,0.15)" stroke="#00bfa5" stroke-width="2"/>

  <!-- Spindle shaft -->
  <rect x="110" y="78" width="8" height="18" rx="2" fill="#00bfa5" stroke="none"/>

  <!-- Cutter (end mill) -->
  <rect x="106" y="96" width="16" height="16" rx="2" fill="rgba(0,191,165,0.35)" stroke="#00bfa5" stroke-width="2"/>
  <!-- Cutter teeth lines -->
  <line x1="108" y1="98" x2="108" y2="110" stroke="#00bfa5" stroke-width="1" opacity="0.7"/>
  <line x1="112" y1="98" x2="112" y2="110" stroke="#00bfa5" stroke-width="1" opacity="0.7"/>
  <line x1="116" y1="98" x2="116" y2="110" stroke="#00bfa5" stroke-width="1" opacity="0.7"/>
  <line x1="120" y1="98" x2="120" y2="110" stroke="#00bfa5" stroke-width="1" opacity="0.7"/>

  <!-- Workpiece on table -->
  <rect x="80" y="106" width="50" height="12" rx="2" fill="rgba(0,191,165,0.12)" stroke="#6b7a99" stroke-width="1.5"/>

  <!-- Handwheel (table X-axis) -->
  <circle cx="168" cy="124" r="8" fill="none" stroke="#00bfa5" stroke-width="2"/>
  <circle cx="168" cy="124" r="2" fill="#00bfa5"/>

  <!-- Handwheel (knee Y-axis) -->
  <circle cx="48" cy="148" r="7" fill="none" stroke="#00bfa5" stroke-width="1.5"/>
  <circle cx="48" cy="148" r="2" fill="#00bfa5"/>

  <!-- Feed direction arrow -->
  <line x1="72" y1="140" x2="95" y2="140" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
  <polygon points="95,140 89,136 89,144" fill="#3ddc84"/>

  <!-- Rotation arrow on spindle -->
  <path d="M 122 62 A 8 8 0 0 1 106 62" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="106,62 109,57 109,67" fill="#f5c842"/>
</svg>
