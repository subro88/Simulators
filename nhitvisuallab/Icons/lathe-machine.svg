<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Bed/Ways -->
  <rect x="8" y="72" width="104" height="10" rx="3" fill="#1565c0"/>
  <rect x="10" y="74" width="100" height="6" rx="2" fill="#1976d2"/>
  <!-- Bed rails -->
  <line x1="10" y1="75" x2="110" y2="75" stroke="#1e88e5" stroke-width="0.5"/>
  <line x1="10" y1="79" x2="110" y2="79" stroke="#1e88e5" stroke-width="0.5"/>
  <!-- Legs -->
  <rect x="15" y="82" width="12" height="25" rx="2" fill="#0d47a1"/>
  <rect x="93" y="82" width="12" height="25" rx="2" fill="#0d47a1"/>
  <rect x="8" y="105" width="104" height="5" rx="2" fill="#0d47a1"/>
  <!-- Headstock -->
  <rect x="8" y="40" width="25" height="32" rx="4" fill="#1565c0"/>
  <rect x="10" y="42" width="21" height="28" rx="3" fill="#0d47a1"/>
  <!-- Chuck (3-jaw) -->
  <circle cx="33" cy="56" r="12" fill="#546e7a" stroke="#78909c" stroke-width="1"/>
  <circle cx="33" cy="56" r="8" fill="#455a64"/>
  <circle cx="33" cy="56" r="3" fill="#37474f"/>
  <!-- Jaws -->
  <rect x="30" y="44" width="6" height="5" rx="1" fill="#607d8b"/>
  <rect x="23" y="58" width="5" height="6" rx="1" fill="#607d8b" transform="rotate(-60 25.5 61)"/>
  <rect x="38" y="58" width="5" height="6" rx="1" fill="#607d8b" transform="rotate(60 40.5 61)"/>
  <!-- Workpiece -->
  <rect x="45" y="53" width="30" height="6" rx="1" fill="#ffb74d"/>
  <!-- Carriage -->
  <rect x="55" y="62" width="22" height="10" rx="2" fill="#1976d2"/>
  <!-- Cross slide -->
  <rect x="58" y="57" width="16" height="6" rx="1" fill="#1e88e5"/>
  <!-- Tool post -->
  <rect x="63" y="50" width="8" height="8" rx="1" fill="#42a5f5"/>
  <!-- Cutting tool -->
  <polygon points="63,52 58,55 63,58" fill="#b0bec5"/>
  <!-- Tailstock -->
  <rect x="88" y="45" width="20" height="27" rx="3" fill="#1565c0"/>
  <rect x="90" y="47" width="16" height="23" rx="2" fill="#0d47a1"/>
  <!-- Tailstock center -->
  <line x1="88" y1="56" x2="82" y2="56" stroke="#78909c" stroke-width="2" stroke-linecap="round"/>
  <!-- Lead screw -->
  <line x1="15" y1="70" x2="105" y2="70" stroke="#42a5f5" stroke-width="1.5" stroke-dasharray="2 1"/>
  <!-- Handwheel -->
  <circle cx="108" cy="58" r="5" fill="none" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="108" y1="53" x2="108" y2="63" stroke="#42a5f5" stroke-width="1"/>
  <!-- Rotation arrow -->
  <path d="M33 40 A16 16 0 0 1 45 48" fill="none" stroke="#64b5f6" stroke-width="1.2"/>
  <polygon points="45,48 42,44 47,45" fill="#64b5f6"/>
  <!-- Chip spray -->
  <circle cx="60" cy="48" r="0.8" fill="#fff59d" opacity="0.6"/>
  <circle cx="57" cy="46" r="0.6" fill="#fff59d" opacity="0.5"/>
  <circle cx="63" cy="47" r="0.7" fill="#fff59d" opacity="0.5"/>
  <!-- Speed/Feed labels -->
  <text x="12" y="38" font-size="6" fill="#64b5f6" font-family="monospace">N</text>
  <text x="62" y="80" font-size="6" fill="#64b5f6" font-family="monospace">f</text>
</svg>
