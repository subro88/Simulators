<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <rect width="80" height="80" rx="12" fill="#161b27"/>
  <!-- Grid -->
  <line x1="15" y1="20" x2="15" y2="65" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="30" y1="20" x2="30" y2="65" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="45" y1="20" x2="45" y2="65" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="60" y1="20" x2="60" y2="65" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="10" y1="28" x2="70" y2="28" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="10" y1="42" x2="70" y2="42" stroke="#2a3050" stroke-width="0.5"/>
  <line x1="10" y1="56" x2="70" y2="56" stroke="#2a3050" stroke-width="0.5"/>
  <!-- Axes -->
  <line x1="10" y1="42" x2="72" y2="42" stroke="#6b7a99" stroke-width="1.2"/>
  <line x1="40" y1="18" x2="40" y2="67" stroke="#6b7a99" stroke-width="1.2"/>
  <!-- Sine curve -->
  <path d="M10,42 C15,42 18,26 25,26 C32,26 35,42 40,42 C45,42 48,58 55,58 C62,58 65,42 70,42" stroke="#18b4f5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Parabola (dashed) -->
  <path d="M18,60 Q40,15 62,60" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <!-- f(x) label -->
  <text x="6" y="14" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#18b4f5">f(x)</text>
  <!-- Axis labels -->
  <text x="71" y="40" font-family="sans-serif" font-size="7" fill="#6b7a99">x</text>
  <text x="42" y="17" font-family="sans-serif" font-size="7" fill="#6b7a99">y</text>
</svg>
