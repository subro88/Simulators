<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- AND gate body: flat left, curved right -->
  <path d="M38 35 L38 85 L60 85 A25 25 0 0 0 60 35 Z" fill="none" stroke="#64b5f6" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Input line A (top) -->
  <line x1="18" y1="48" x2="38" y2="48" stroke="#64b5f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Input line B (bottom) -->
  <line x1="18" y1="72" x2="38" y2="72" stroke="#64b5f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Output line -->
  <line x1="85" y1="60" x2="102" y2="60" stroke="#64b5f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Input dots -->
  <circle cx="18" cy="48" r="2.5" fill="#64b5f6"/>
  <circle cx="18" cy="72" r="2.5" fill="#64b5f6"/>
  <!-- Output dot -->
  <circle cx="102" cy="60" r="2.5" fill="#64b5f6"/>
  <!-- Label -->
  <text x="60" y="105" text-anchor="middle" fill="rgba(221,227,240,0.7)" font-size="10" font-weight="600" font-family="sans-serif">AND</text>
</svg>
