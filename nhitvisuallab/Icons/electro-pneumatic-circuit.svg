<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#161b27"/>

  <!-- 24V Power rail -->
  <line x1="25" y1="35" x2="175" y2="35" stroke="#ff9800" stroke-width="2.5"/>
  <text x="18" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ff9800">+24V</text>

  <!-- 0V Power rail -->
  <line x1="25" y1="95" x2="175" y2="95" stroke="#ff9800" stroke-width="2.5"/>
  <text x="22" y="108" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ff9800">0V</text>

  <!-- Push button NO contact -->
  <line x1="60" y1="35" x2="60" y2="50" stroke="#ff9800" stroke-width="2"/>
  <circle cx="60" cy="55" r="2.5" fill="#ff9800"/>
  <circle cx="80" cy="55" r="2.5" fill="#ff9800"/>
  <line x1="60" y1="55" x2="60" y2="50" stroke="#ff9800" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="78" y2="47" stroke="#ff9800" stroke-width="2"/>
  <line x1="70" y1="40" x2="70" y2="47" stroke="#ff9800" stroke-width="1.5"/>
  <polygon points="70,47 67,43 73,43" fill="#ff9800"/>
  <line x1="80" y1="55" x2="80" y2="65" stroke="#ff9800" stroke-width="2"/>
  <text x="58" y="67" font-family="sans-serif" font-size="7" fill="#ffcc80">S1</text>

  <!-- Solenoid coil symbol -->
  <rect x="65" y="68" width="30" height="16" rx="2" fill="none" stroke="#ff9800" stroke-width="2"/>
  <text x="80" y="79" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ff9800" text-anchor="middle">Y1</text>
  <line x1="80" y1="84" x2="80" y2="95" stroke="#ff9800" stroke-width="2"/>

  <!-- Dashed link solenoid to valve -->
  <line x1="80" y1="84" x2="80" y2="120" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 5/2 Valve body -->
  <rect x="55" y="120" width="25" height="35" rx="2" fill="rgba(66,165,245,0.12)" stroke="#42a5f5" stroke-width="1.5"/>
  <rect x="80" y="120" width="25" height="35" rx="2" fill="none" stroke="#42a5f5" stroke-width="1.5"/>

  <!-- Valve arrows Position A -->
  <line x1="67" y1="150" x2="63" y2="125" stroke="#42a5f5" stroke-width="1.2"/>
  <polygon points="63,125 60,130 66,130" fill="#42a5f5"/>

  <!-- Port stubs -->
  <line x1="67" y1="155" x2="67" y2="165" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="80" y1="155" x2="80" y2="165" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="63" y1="120" x2="63" y2="110" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="97" y1="120" x2="97" y2="110" stroke="#42a5f5" stroke-width="1.5"/>

  <!-- Port labels -->
  <text x="67" y="173" font-family="sans-serif" font-size="7" fill="#5a8ab5" text-anchor="middle">1</text>
  <text x="63" y="108" font-family="sans-serif" font-size="7" fill="#5a8ab5" text-anchor="middle">4</text>
  <text x="97" y="108" font-family="sans-serif" font-size="7" fill="#5a8ab5" text-anchor="middle">2</text>

  <!-- Spring symbol on right -->
  <path d="M107,130 L110,133 L104,137 L110,141 L104,145 L107,148" fill="none" stroke="#5a8ab5" stroke-width="1"/>

  <!-- Air supply -->
  <circle cx="30" cy="165" r="10" fill="none" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="30,158 25,170 35,170" fill="#42a5f5"/>
  <line x1="40" y1="165" x2="67" y2="165" stroke="#42a5f5" stroke-width="2"/>

  <!-- Cylinder -->
  <rect x="120" y="100" width="55" height="24" rx="2" fill="none" stroke="#42a5f5" stroke-width="1.5"/>
  <rect x="140" y="103" width="3" height="18" fill="#42a5f5"/>
  <line x1="143" y1="112" x2="175" y2="112" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pneumatic connections to cylinder -->
  <line x1="97" y1="110" x2="97" y2="106" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="97" y1="106" x2="120" y2="106" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="63" y1="110" x2="63" y2="100" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="63" y1="100" x2="130" y2="100" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="130" y1="100" x2="130" y2="100" stroke="#42a5f5" stroke-width="1.5"/>

  <!-- Indicator lamp -->
  <circle cx="140" cy="65" r="8" fill="none" stroke="#ff9800" stroke-width="1.5"/>
  <line x1="134" y1="59" x2="146" y2="71" stroke="#ff9800" stroke-width="1"/>
  <line x1="146" y1="59" x2="134" y2="71" stroke="#ff9800" stroke-width="1"/>
  <line x1="140" y1="35" x2="140" y2="57" stroke="#ff9800" stroke-width="1.5"/>
  <line x1="140" y1="73" x2="140" y2="95" stroke="#ff9800" stroke-width="1.5"/>
  <text x="140" y="83" font-family="sans-serif" font-size="6" fill="#ffcc80" text-anchor="middle">H1</text>

  <!-- Lightning bolt -->
  <polygon points="170,15 164,28 169,28 163,40 174,25 169,25 175,15" fill="#ff9800"/>

  <!-- Title -->
  <text x="100" y="192" font-family="sans-serif" font-size="9" font-weight="700" fill="#ff9800" text-anchor="middle" letter-spacing="0.5">ELECTRO-PNEUMATIC</text>
</svg>
