<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <text x="100" y="30" text-anchor="middle" fill="#00a896" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">CONTINUITY</text>

  <!-- Pipe with constriction -->
  <path d="M 22 70 L 90 70 L 130 100 L 178 100 L 178 130 L 130 130 L 90 160 L 22 160 Z" fill="#00a896" fill-opacity="0.15" stroke="#7ec8e3" stroke-width="2.5"/>

  <!-- Wide-section particles (slow, spaced) -->
  <circle cx="38" cy="115" r="3" fill="#4fc3f7"/>
  <circle cx="58" cy="100" r="3" fill="#4fc3f7"/>
  <circle cx="78" cy="125" r="3" fill="#4fc3f7"/>
  <!-- Narrow-section particles (fast, clustered) -->
  <circle cx="142" cy="115" r="3" fill="#26a69a"/>
  <circle cx="152" cy="115" r="3" fill="#26a69a"/>
  <circle cx="162" cy="115" r="3" fill="#26a69a"/>
  <circle cx="170" cy="115" r="3" fill="#26a69a"/>

  <!-- Velocity arrows -->
  <line x1="40" y1="115" x2="60" y2="115" stroke="#7fdbff" stroke-width="2"/>
  <polygon points="60,115 56,112 56,118" fill="#7fdbff"/>

  <line x1="142" y1="115" x2="172" y2="115" stroke="#ffb74d" stroke-width="2.5"/>
  <polygon points="172,115 167,112 167,118" fill="#ffb74d"/>

  <!-- Labels -->
  <text x="55" y="60" text-anchor="middle" fill="#80deea" font-family="Courier New, monospace" font-size="9" font-weight="700">A₁ V₁</text>
  <text x="155" y="170" text-anchor="middle" fill="#80deea" font-family="Courier New, monospace" font-size="9" font-weight="700">A₂ V₂</text>

  <text x="100" y="190" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="9">A₁V₁ = A₂V₂</text>
</svg>
