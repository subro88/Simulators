<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>

  <!-- Venturi tube outline -->
  <path d="M20 70 L65 70 Q100 70 100 55 Q100 70 135 70 L180 70
           L180 130 L135 130 Q100 130 100 145 Q100 130 65 130 L20 130 Z"
        fill="#2a3050" stroke="#8bc34a" stroke-width="2.5"/>

  <!-- Fluid flow fill -->
  <path d="M22 72 L65 72 Q100 72 100 57 Q100 72 135 72 L178 72
           L178 128 L135 128 Q100 128 100 143 Q100 128 65 128 L22 128 Z"
        fill="rgba(139,195,74,0.25)"/>

  <!-- Streamlines (flow arrows) -->
  <!-- Wide section left -->
  <line x1="28" y1="85" x2="55" y2="85" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="28" y1="100" x2="55" y2="100" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="28" y1="115" x2="55" y2="115" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Narrow section (faster - longer dashes, tighter spacing) -->
  <line x1="80" y1="90" x2="120" y2="90" stroke="#3ddc84" stroke-width="2" stroke-dasharray="8 3"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#3ddc84" stroke-width="2" stroke-dasharray="8 3"/>
  <line x1="80" y1="110" x2="120" y2="110" stroke="#3ddc84" stroke-width="2" stroke-dasharray="8 3"/>

  <!-- Wide section right -->
  <line x1="145" y1="85" x2="172" y2="85" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="145" y1="100" x2="172" y2="100" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="145" y1="115" x2="172" y2="115" stroke="#8bc34a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Velocity arrows at narrow section -->
  <polygon points="122,95 128,100 122,105" fill="#3ddc84"/>

  <!-- Pressure gauge posts -->
  <line x1="45" y1="45" x2="45" y2="70" stroke="#6b7a99" stroke-width="1.5"/>
  <line x1="100" y1="30" x2="100" y2="55" stroke="#6b7a99" stroke-width="1.5"/>
  <line x1="155" y1="45" x2="155" y2="70" stroke="#6b7a99" stroke-width="1.5"/>

  <!-- Pressure indicators (height = pressure) -->
  <!-- High pressure (wide sections) -->
  <rect x="40" y="35" width="10" height="35" rx="2" fill="rgba(255,85,85,0.5)" stroke="#ff5555" stroke-width="1"/>
  <rect x="150" y="35" width="10" height="35" rx="2" fill="rgba(255,85,85,0.5)" stroke="#ff5555" stroke-width="1"/>

  <!-- Low pressure (narrow section) -->
  <rect x="95" y="40" width="10" height="15" rx="2" fill="rgba(139,195,74,0.5)" stroke="#8bc34a" stroke-width="1"/>

  <!-- Labels -->
  <text x="45" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#ff5555">P+</text>
  <text x="100" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#8bc34a">P-</text>
  <text x="155" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#ff5555">P+</text>

  <!-- v1 / v2 labels -->
  <text x="42" y="162" text-anchor="middle" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#8bc34a">v</text>
  <text x="49" y="165" font-family="Courier New,monospace" font-size="7" fill="#8bc34a">1</text>
  <text x="100" y="170" text-anchor="middle" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#3ddc84">v</text>
  <text x="107" y="173" font-family="Courier New,monospace" font-size="7" fill="#3ddc84">2</text>

  <!-- Bernoulli equation at bottom -->
  <text x="100" y="190" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="700" fill="#f5c842">P + 1/2 pv2 = const</text>

  <!-- Flow direction arrow -->
  <polygon points="175,100 185,95 185,105" fill="#8bc34a" opacity="0.7"/>
</svg>
