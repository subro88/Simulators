<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Axes -->
  <!-- Horizontal axis (σ) -->
  <line x1="20" y1="105" x2="185" y2="105" stroke="#6b7a99" stroke-width="1.2"/>
  <polygon points="185,105 178,102 178,108" fill="#6b7a99"/>
  <text x="190" y="109" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#b39ddb">σ</text>

  <!-- Vertical axis (τ) -->
  <line x1="70" y1="170" x2="70" y2="20" stroke="#6b7a99" stroke-width="1.2"/>
  <polygon points="70,20 67,27 73,27" fill="#6b7a99"/>
  <text x="60" y="17" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#b39ddb">τ</text>

  <!-- Mohr's Circle -->
  <circle cx="115" cy="105" r="48" fill="none" stroke="#7e57c2" stroke-width="2.5"/>
  <!-- Circle fill with low opacity -->
  <circle cx="115" cy="105" r="48" fill="rgba(126,87,194,0.12)" stroke="none"/>

  <!-- Center point -->
  <circle cx="115" cy="105" r="3" fill="#b39ddb"/>
  <text x="115" y="120" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#6b7a99">σavg</text>

  <!-- Diameter line (X to Y) -->
  <line x1="82" y1="72" x2="148" y2="138" stroke="#b39ddb" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Point X (σx, τxy) -->
  <circle cx="82" cy="72" r="4.5" fill="#7e57c2" stroke="#fff" stroke-width="1"/>
  <text x="72" y="65" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#7e57c2">X</text>

  <!-- Point Y (σy, -τxy) -->
  <circle cx="148" cy="138" r="4.5" fill="#7e57c2" stroke="#fff" stroke-width="1"/>
  <text x="153" y="147" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#7e57c2">Y</text>

  <!-- Principal stress σ1 (right intersection with σ-axis) -->
  <circle cx="163" cy="105" r="4" fill="#3ddc84" stroke="#fff" stroke-width="1"/>
  <text x="163" y="98" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#3ddc84">σ1</text>

  <!-- Principal stress σ2 (left intersection with σ-axis) -->
  <circle cx="67" cy="105" r="4" fill="#ff5555" stroke="#fff" stroke-width="1"/>
  <text x="67" y="98" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#ff5555">σ2</text>

  <!-- τmax at top of circle -->
  <circle cx="115" cy="57" r="3" fill="#f5c842"/>
  <text x="115" y="49" text-anchor="middle" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#f5c842">τmax</text>

  <!-- Principal angle arc -->
  <path d="M130,105 A15,15 0 0,0 126,92" fill="none" stroke="#b39ddb" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="136" y="95" font-family="Courier New,monospace" font-size="7" fill="#b39ddb">2θp</text>

  <!-- Label -->
  <text x="100" y="190" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#7e57c2">Mohr's Circle</text>
</svg>
