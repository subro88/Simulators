<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="16" fill="#161b27"/>
  <!-- Crank circle (path) -->
  <circle cx="45" cy="60" r="22" stroke="#0091ea" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Crank arm -->
  <line x1="45" y1="60" x2="63" y2="45" stroke="#0091ea" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Yoke body -->
  <rect x="57" y="30" width="12" height="60" rx="3" fill="none" stroke="#f5c842" stroke-width="2.5"/>
  <!-- Yoke slot -->
  <rect x="60" y="34" width="6" height="52" rx="2" fill="#0d1117" stroke="#8899aa" stroke-width="1"/>
  <!-- Guide rails -->
  <line x1="35" y1="28" x2="80" y2="28" stroke="#556677" stroke-width="1.5"/>
  <line x1="35" y1="92" x2="80" y2="92" stroke="#556677" stroke-width="1.5"/>
  <!-- Yoke arms to rails -->
  <rect x="58" y="22" width="10" height="10" rx="1" fill="none" stroke="#f5c842" stroke-width="1.5"/>
  <rect x="58" y="88" width="10" height="10" rx="1" fill="none" stroke="#f5c842" stroke-width="1.5"/>
  <!-- Crank pin -->
  <circle cx="63" cy="45" r="4" fill="#ff8a65" stroke="#fff" stroke-width="1.5"/>
  <!-- Ground pivot -->
  <circle cx="45" cy="60" r="4.5" fill="#0091ea" stroke="#fff" stroke-width="1.5"/>
  <!-- SHM arrow -->
  <line x1="30" y1="105" x2="90" y2="105" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="90,105 86,102 86,108" fill="#3ddc84"/>
  <polygon points="30,105 34,102 34,108" fill="#3ddc84"/>
  <!-- Label -->
  <text x="60" y="115" text-anchor="middle" font-family="monospace" font-size="7" fill="#6b7a99">SHM</text>
</svg>
