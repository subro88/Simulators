<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Outer gimbal ring -->
  <ellipse cx="100" cy="95" rx="60" ry="55" fill="none" stroke="#ff6f00" stroke-width="2" opacity="0.5"/>
  <!-- Inner gimbal ring -->
  <ellipse cx="100" cy="95" rx="45" ry="42" fill="none" stroke="#ff6f00" stroke-width="2.5"/>
  <!-- Spinning disc -->
  <ellipse cx="100" cy="95" rx="30" ry="12" fill="#ff6f00" opacity="0.2" stroke="#ff6f00" stroke-width="2"/>
  <!-- Axle -->
  <line x1="65" y1="95" x2="135" y2="95" stroke="#ffab40" stroke-width="2.5"/>
  <!-- Spin arrows -->
  <path d="M80 78 A20 10 0 0 1 120 78" fill="none" stroke="#ffab40" stroke-width="1.5"/>
  <polygon points="118,75 124,78 118,81" fill="#ffab40"/>
  <path d="M120 112 A20 10 0 0 1 80 112" fill="none" stroke="#ffab40" stroke-width="1.5"/>
  <polygon points="82,109 76,112 82,115" fill="#ffab40"/>
  <!-- Precession arrow (curved) -->
  <path d="M45 55 A60 45 0 0 1 100 40" fill="none" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="96,37 104,38 98,44" fill="#3ddc84"/>
  <text x="60" y="42" fill="#3ddc84" font-size="9" font-family="sans-serif">Precession</text>
  <!-- Stand base -->
  <line x1="100" y1="150" x2="100" y2="135" stroke="#6b7a99" stroke-width="2"/>
  <line x1="80" y1="150" x2="120" y2="150" stroke="#6b7a99" stroke-width="2.5"/>
  <!-- Angular momentum arrow -->
  <line x1="100" y1="95" x2="100" y2="62" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="96,65 100,57 104,65" fill="#f5c842"/>
  <text x="110" y="62" fill="#f5c842" font-size="8" font-family="sans-serif">L</text>
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" fill="#6b7a99" font-size="11" font-family="sans-serif">Gyroscope</text>
  <text x="100" y="185" text-anchor="middle" fill="#ffab40" font-size="9" font-family="sans-serif">Spin &#8226; Precession &#8226; &#969;</text>
</svg>
