<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="16" fill="#161b27"/>
  <!-- Geneva wheel (4 slots) -->
  <circle cx="60" cy="42" r="28" stroke="#f5c842" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Slots -->
  <rect x="57" y="14" width="6" height="22" rx="2" fill="#0d1117" stroke="#8899aa" stroke-width="1"/>
  <rect x="57" y="48" width="6" height="22" rx="2" fill="#0d1117" stroke="#8899aa" stroke-width="1"/>
  <rect x="32" y="39" width="22" height="6" rx="2" fill="#0d1117" stroke="#8899aa" stroke-width="1"/>
  <rect x="66" y="39" width="22" height="6" rx="2" fill="#0d1117" stroke="#8899aa" stroke-width="1"/>
  <!-- Geneva wheel centre -->
  <circle cx="60" cy="42" r="3.5" fill="#f5c842" stroke="#fff" stroke-width="1.2"/>
  <!-- Driver disc -->
  <circle cx="60" cy="82" r="18" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.25"/>
  <!-- Driver arm -->
  <line x1="60" y1="82" x2="60" y2="64" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <!-- Pin -->
  <circle cx="60" cy="64" r="3.5" fill="#ff8a65" stroke="#fff" stroke-width="1.2"/>
  <!-- Driver centre -->
  <circle cx="60" cy="82" r="3.5" fill="#7c3aed" stroke="#fff" stroke-width="1.2"/>
  <!-- Label -->
  <text x="60" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b7a99">GENEVA</text>
</svg>
