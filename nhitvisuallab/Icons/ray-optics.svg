<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Principal axis -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#6b7a99" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Concave mirror -->
  <path d="M140,40 Q160,100 140,160" fill="none" stroke="#80d8ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Object arrow (red) -->
  <line x1="60" y1="100" x2="60" y2="55" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="60,48 54,58 66,58" fill="#ff5555"/>
  <!-- Ray 1: parallel then through F -->
  <line x1="60" y1="55" x2="140" y2="55" stroke="#ff6b6b" stroke-width="1.2"/>
  <line x1="140" y1="55" x2="140" y2="145" stroke="#ff6b6b" stroke-width="1.2"/>
  <!-- Ray 2: through centre -->
  <line x1="60" y1="55" x2="140" y2="105" stroke="#ffd93d" stroke-width="1.2"/>
  <!-- Ray 3: through F then parallel -->
  <line x1="60" y1="55" x2="140" y2="80" stroke="#69dbff" stroke-width="1.2"/>
  <!-- Focal point -->
  <circle cx="120" cy="100" r="3" fill="#f5c842"/>
  <text x="120" y="118" fill="#f5c842" font-size="11" font-family="sans-serif" text-anchor="middle">F</text>
  <!-- Image arrow (green) -->
  <line x1="140" y1="100" x2="140" y2="145" stroke="#3ddc84" stroke-width="2.5"/>
  <polygon points="140,152 134,142 146,142" fill="#3ddc84"/>
</svg>
