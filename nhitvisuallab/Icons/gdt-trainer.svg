<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Feature Control Frame box -->
  <rect x="28" y="70" width="144" height="60" rx="4" fill="none" stroke="#2a3050" stroke-width="3"/>
  <!-- Dividers -->
  <line x1="76" y1="70" x2="76" y2="130" stroke="#2a3050" stroke-width="3"/>
  <line x1="124" y1="70" x2="124" y2="130" stroke="#2a3050" stroke-width="3"/>
  <!-- Perpendicularity symbol (⊥) in first compartment -->
  <line x1="52" y1="108" x2="52" y2="84" stroke="#00bfa5" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="38" y1="84" x2="66" y2="84" stroke="#00bfa5" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tolerance value in second compartment -->
  <text x="100" y="105" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#dde3f0">0.05</text>
  <!-- Datum letter in third compartment -->
  <text x="148" y="106" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#dde3f0">A</text>
  <!-- GD&T label -->
  <text x="100" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#00bfa5">GD&amp;T</text>
  <!-- ASME label -->
  <text x="100" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#6b7a99">ASME Y14.5</text>
</svg>
