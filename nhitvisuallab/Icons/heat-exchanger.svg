<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Shell -->
  <rect x="35" y="60" width="130" height="80" rx="10" fill="none" stroke="#ef5350" stroke-width="3"/>
  <!-- Tubes inside shell -->
  <line x1="55" y1="80" x2="145" y2="80" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="145" y2="100" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="120" x2="145" y2="120" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hot inlet arrow (left top) -->
  <line x1="15" y1="75" x2="35" y2="75" stroke="#ef5350" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="30,70 38,75 30,80" fill="#ef5350"/>
  <!-- Hot outlet arrow (right bottom) -->
  <line x1="165" y1="125" x2="185" y2="125" stroke="#ff8a65" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="180,120 188,125 180,130" fill="#ff8a65"/>
  <!-- Cold inlet arrow (right top) -->
  <line x1="165" y1="80" x2="185" y2="80" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="170,75 162,80 170,85" fill="#42a5f5"/>
  <!-- Cold outlet arrow (left bottom) -->
  <line x1="15" y1="120" x2="35" y2="120" stroke="#81d4fa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="20,115 12,120 20,125" fill="#81d4fa"/>
  <!-- Labels -->
  <text x="100" y="48" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="700" font-family="Segoe UI,system-ui,sans-serif">HX</text>
  <text x="100" y="170" text-anchor="middle" fill="#6b7a99" font-size="10" font-family="Segoe UI,system-ui,sans-serif">LMTD &amp; NTU</text>
</svg>
