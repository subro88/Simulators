  <line x1="85" y1="55" x2="115" y2="55" stroke="#ff9100" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="70" x2="118" y2="70" stroke="#ff9100" stroke-width="1.5"/>
  <line x1="85" y1="85" x2="115" y2="85" stroke="#ff9100" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="100" x2="118" y2="100" stroke="#ff9100" stroke-width="1.5"/>
  <line x1="85" y1="115" x2="115" y2="115" stroke="#ff9100" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="130" x2="118" y2="130" stroke="#ff9100" stroke-width="1.5"/>
  <line x1="85" y1="145" x2="115" y2="145" stroke="#ff9100" stroke-width="1.5" opacity="0.7"/>
