<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Axes -->
  <line x1="35" y1="170" x2="185" y2="170" stroke="#6b7a99" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="170" x2="35" y2="25" stroke="#6b7a99" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrowheads -->
  <polygon points="185,170 175,165 175,175" fill="#6b7a99"/>
  <polygon points="35,25 30,35 40,35" fill="#6b7a99"/>
  <!-- Ductile curve -->
  <path d="M 35,170 L 70,95 Q 75,82 80,82 Q 85,90 88,85 Q 100,72 130,55 Q 145,48 150,50 Q 158,54 165,70" fill="none" stroke="#7c4dff" stroke-width="3" stroke-linecap="round"/>
  <!-- Fracture X -->
  <line x1="161" y1="66" x2="169" y2="74" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <line x1="169" y1="66" x2="161" y2="74" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <!-- UTS dot -->
  <circle cx="150" cy="50" r="4" fill="#b388ff"/>
  <!-- Yield dot -->
  <circle cx="80" cy="82" r="4" fill="#3ddc84"/>
  <!-- Hooke's Law slope indicator -->
  <line x1="38" y1="167" x2="68" y2="97" stroke="#7c4dff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Labels -->
  <text x="100" y="190" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="13" font-weight="bold">Strain (&#949;)</text>
  <text x="18" y="100" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="13" font-weight="bold" transform="rotate(-90 18 100)">Stress (&#963;)</text>
  <!-- E label on slope -->
  <text x="44" y="138" fill="#7c4dff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">E</text>
</svg>