<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Shaft (horizontal cylinder) -->
  <defs>
    <linearGradient id="shaftGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6480"/>
      <stop offset="40%" stop-color="#3a4260"/>
      <stop offset="100%" stop-color="#252d42"/>
    </linearGradient>
    <radialGradient id="stressGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2535"/>
      <stop offset="40%" stop-color="#6b3020"/>
      <stop offset="100%" stop-color="#ff6e40"/>
    </radialGradient>
  </defs>

  <!-- Fixed wall (hatched) -->
  <rect x="24" y="68" width="8" height="48" fill="#6b7a99" opacity="0.6"/>
  <line x1="24" y1="70" x2="18" y2="76" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="78" x2="18" y2="84" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="86" x2="18" y2="92" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="94" x2="18" y2="100" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="102" x2="18" y2="108" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="110" x2="18" y2="116" stroke="#6b7a99" stroke-width="1.5" opacity="0.5"/>

  <!-- Shaft body -->
  <rect x="32" y="72" width="90" height="40" rx="3" fill="url(#shaftGrad)" stroke="#4a5270" stroke-width="1.5"/>

  <!-- Twist lines on shaft -->
  <line x1="55" y1="72" x2="50" y2="112" stroke="#6b7a99" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="72" x2="67" y2="112" stroke="#6b7a99" stroke-width="1" opacity="0.4"/>
  <line x1="95" y1="72" x2="84" y2="112" stroke="#6b7a99" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="72" x2="99" y2="112" stroke="#6b7a99" stroke-width="1" opacity="0.4"/>

  <!-- Torque arrow (curved) at free end -->
  <path d="M 128 72 A 22 22 0 0 1 128 112" fill="none" stroke="#ff6e40" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="128,68 124,76 132,76" fill="#ff6e40"/>
  <text x="138" y="95" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ff6e40">T</text>

  <!-- Cross-section circle (right side) -->
  <circle cx="156" cy="148" r="30" fill="url(#stressGrad)" stroke="#ff6e40" stroke-width="2" opacity="0.9"/>
  <!-- Inner circle (hollow indicator / zero stress center) -->
  <circle cx="156" cy="148" r="6" fill="#1f2535" stroke="#4a5270" stroke-width="1"/>

  <!-- Stress distribution radial line -->
  <line x1="156" y1="148" x2="156" y2="118" stroke="#ff6e40" stroke-width="1.5" opacity="0.6"/>
  <line x1="156" y1="148" x2="180" y2="130" stroke="#ff6e40" stroke-width="1.5" opacity="0.6"/>

  <!-- Stress triangle overlay (radial stress distribution) -->
  <polygon points="156,142 156,118 159,118" fill="#ff6e40" opacity="0.3"/>

  <!-- Label -->
  <text x="60" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13" fill="#ffab91" letter-spacing="1">TORSION</text>

  <!-- tau symbol -->
  <text x="60" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#ff6e40">&#x03C4; = Tr/J</text>
</svg>