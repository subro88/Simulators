<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Motor housing (stator circle) -->
  <circle cx="90" cy="95" r="52" fill="none" stroke="#42a5f5" stroke-width="3"/>
  <circle cx="90" cy="95" r="44" fill="none" stroke="rgba(66,165,245,0.25)" stroke-width="1"/>

  <!-- Field coils (left and right) -->
  <rect x="42" y="74" width="12" height="42" rx="2" fill="rgba(66,165,245,0.25)" stroke="#42a5f5" stroke-width="1.5"/>
  <rect x="126" y="74" width="12" height="42" rx="2" fill="rgba(66,165,245,0.25)" stroke="#42a5f5" stroke-width="1.5"/>

  <!-- Rotor cross (accent color) -->
  <line x1="90" y1="60" x2="90" y2="130" stroke="#e91e63" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="95" x2="125" y2="95" stroke="#e91e63" stroke-width="4" stroke-linecap="round"/>

  <!-- Rotor winding indicators -->
  <rect x="83" y="58" width="14" height="10" rx="2" fill="rgba(233,30,99,0.4)"/>
  <rect x="83" y="122" width="14" height="10" rx="2" fill="rgba(233,30,99,0.4)"/>
  <rect x="53" y="88" width="10" height="14" rx="2" fill="rgba(233,30,99,0.4)"/>
  <rect x="117" y="88" width="10" height="14" rx="2" fill="rgba(233,30,99,0.4)"/>

  <!-- Rotor center -->
  <circle cx="90" cy="95" r="5" fill="#e91e63"/>

  <!-- Shaft (extending right) -->
  <line x1="142" y1="95" x2="174" y2="95" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="142" y1="95" x2="174" y2="95" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>

  <!-- Commutator -->
  <circle cx="90" cy="152" r="8" fill="#ffa000" stroke="#b37300" stroke-width="1.5"/>
  <line x1="90" y1="144" x2="90" y2="160" stroke="#1f2535" stroke-width="1.5"/>

  <!-- Brushes -->
  <rect x="75" y="149" width="5" height="6" rx="1" fill="#888"/>
  <rect x="100" y="149" width="5" height="6" rx="1" fill="#888"/>

  <!-- Supply wires -->
  <line x1="77" y1="152" x2="65" y2="152" stroke="#ff5555" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="152" x2="65" y2="168" stroke="#ff5555" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="152" x2="115" y2="152" stroke="#42a5f5" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="152" x2="115" y2="168" stroke="#42a5f5" stroke-width="2" stroke-linecap="round"/>

  <!-- +/- labels -->
  <text x="65" y="180" fill="#ff5555" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">+</text>
  <text x="115" y="180" fill="#42a5f5" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">-</text>

  <!-- N/S pole labels -->
  <text x="48" y="68" fill="#42a5f5" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">N</text>
  <text x="132" y="68" fill="#42a5f5" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">S</text>

  <!-- Rotation arrow (curved) -->
  <path d="M 110 70 A 30 30 0 0 1 115 95" fill="none" stroke="#e91e63" stroke-width="2" stroke-linecap="round"/>
  <polygon points="115,95 110,87 120,89" fill="#e91e63"/>
</svg>
