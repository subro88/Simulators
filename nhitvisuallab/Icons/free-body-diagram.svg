<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- axes -->
  <line x1="30" y1="120" x2="170" y2="120" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="100" y1="40" x2="100" y2="170" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- force arrows -->
  <line x1="100" y1="120" x2="158" y2="120" stroke="#3f8cff" stroke-width="6" marker-end="url(#a)"/>
  <line x1="100" y1="120" x2="100" y2="58" stroke="#ff5555" stroke-width="6" marker-end="url(#a)"/>
  <line x1="100" y1="120" x2="56" y2="150" stroke="#3ddc84" stroke-width="6" marker-end="url(#a)"/>
  <!-- resultant -->
  <line x1="100" y1="120" x2="150" y2="74" stroke="#ffffff" stroke-width="5" stroke-dasharray="2 2" marker-end="url(#ar)"/>
  <!-- body point -->
  <circle cx="100" cy="120" r="7" fill="#ffffff" stroke="#0a0e14" stroke-width="2"/>
  <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#3f8cff">FBD</text>
</svg>
