<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Burette barrel -->
  <rect x="85" y="26" width="24" height="76" rx="2" fill="none" stroke="rgba(180,210,240,0.38)" stroke-width="2.5"/>
  <!-- Titrant in the burette -->
  <rect x="87" y="46" width="20" height="54" rx="1" fill="#8ecbf0" opacity="0.5"/>
  <!-- Graduations -->
  <line x1="85" y1="40" x2="93" y2="40" stroke="rgba(180,210,240,0.45)" stroke-width="1.6"/>
  <line x1="85" y1="52" x2="91" y2="52" stroke="rgba(180,210,240,0.28)" stroke-width="1.2"/>
  <line x1="85" y1="64" x2="93" y2="64" stroke="rgba(180,210,240,0.45)" stroke-width="1.6"/>
  <line x1="85" y1="76" x2="91" y2="76" stroke="rgba(180,210,240,0.28)" stroke-width="1.2"/>
  <line x1="85" y1="88" x2="93" y2="88" stroke="rgba(180,210,240,0.45)" stroke-width="1.6"/>

  <!-- Stopcock -->
  <circle cx="97" cy="108" r="7" fill="#f06292"/>
  <rect x="88" y="106" width="18" height="4" rx="1" fill="#1f2535"/>
  <!-- Jet -->
  <path d="M94 116 L95.5 126 L98.5 126 L100 116 Z" fill="none" stroke="rgba(180,210,240,0.38)" stroke-width="2"/>

  <!-- Falling drop -->
  <ellipse cx="97" cy="134" rx="3.4" ry="5" fill="#8ecbf0" opacity="0.9"/>

  <!-- Conical flask -->
  <path d="M89 144 L89 148 L64 172 Q62 176 67 176 L127 176 Q132 176 130 172 L105 148 L105 144 Z"
        fill="none" stroke="rgba(180,210,240,0.42)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Solution at the pink end point -->
  <path d="M78 161 L67 172 Q65.5 175 68.5 175 L125.5 175 Q128.5 175 127 172 L116 161 Z" fill="#f06292" opacity="0.55"/>

  <!-- Curve motif: the steep titration curve -->
  <path d="M24 154 L36 150 Q48 146 52 128 Q55 108 58 92 Q61 78 72 74"
        fill="none" stroke="#f06292" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Equivalence point -->
  <circle cx="54" cy="114" r="4.2" fill="#3ddc84"/>
  <line x1="24" y1="114" x2="54" y2="114" stroke="rgba(61,220,132,0.4)" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- pH axis tick -->
  <text x="18" y="90" font-family="Segoe UI, sans-serif" font-size="10" fill="#6b7a99" text-anchor="middle">pH</text>

  <!-- Title -->
  <text x="100" y="192" font-family="Segoe UI, sans-serif" font-size="13" fill="#dde3f0" text-anchor="middle" font-weight="600">Titration</text>
</svg>
