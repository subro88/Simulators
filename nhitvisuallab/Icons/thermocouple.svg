<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- heat glow at the hot junction -->
  <circle cx="46" cy="100" r="30" fill="#ff5722" opacity="0.14"/>
  <circle cx="46" cy="100" r="19" fill="#ff5722" opacity="0.22"/>

  <!-- two dissimilar conductors meeting at the measuring junction -->
  <path d="M46 100 L92 74 L140 74" fill="none" stroke="#ff5722" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 100 L92 126 L140 126" fill="none" stroke="#e8eef7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- welded hot junction bead -->
  <circle cx="46" cy="100" r="10" fill="#ffd9a8"/>
  <circle cx="43" cy="97" r="3.5" fill="#ffffff"/>

  <!-- millivolt indicator -->
  <rect x="138" y="60" width="42" height="80" rx="7" fill="#161b27" stroke="#3ddc84" stroke-width="2.5"/>
  <rect x="145" y="70" width="28" height="20" rx="3" fill="#0a1c14"/>
  <path d="M150 84 L150 76 M156 84 L156 76 M162 84 L162 76 M168 84 L168 80" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/>
  <text x="159" y="112" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#3ddc84" text-anchor="middle">mV</text>

  <!-- terminals (cold junction) -->
  <circle cx="140" cy="74" r="5" fill="#ff5722" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="140" cy="126" r="5" fill="#8b95b3" stroke="#0d1117" stroke-width="1.5"/>

  <!-- rising heat -->
  <path d="M30 66 q6 -9 0 -18 M46 60 q6 -9 0 -18 M62 66 q6 -9 0 -18"
        fill="none" stroke="#ff8a65" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
</svg>
