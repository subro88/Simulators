<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Workpiece outline -->
  <rect x="40" y="40" width="120" height="120" rx="4" fill="none" stroke="#2a3050" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#2a3050" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#2a3050" stroke-width="0.8" stroke-dasharray="4,4"/>
  <!-- X axis -->
  <line x1="30" y1="160" x2="170" y2="160" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="170,160 164,157 164,163" fill="#42a5f5"/>
  <text x="174" y="164" fill="#42a5f5" font-size="12" font-family="sans-serif" font-weight="700">X</text>
  <!-- Y axis -->
  <line x1="40" y1="170" x2="40" y2="30" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="40,30 37,36 43,36" fill="#42a5f5"/>
  <text x="33" y="26" fill="#42a5f5" font-size="12" font-family="sans-serif" font-weight="700">Y</text>
  <!-- Origin marker -->
  <circle cx="40" cy="160" r="3" fill="#42a5f5" opacity="0.6"/>
  <!-- Rapid move (dashed) -->
  <line x1="40" y1="160" x2="60" y2="140" stroke="#6b7a99" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Tool path - square profile -->
  <polyline points="60,140 120,140 120,80 60,80 60,140" fill="none" stroke="#43a047" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Arc path -->
  <path d="M120,110 A30,30 0 0,1 120,80" fill="none" stroke="#43a047" stroke-width="2" stroke-linecap="round"/>
  <!-- Tool position marker -->
  <circle cx="120" cy="80" r="6" fill="#43a047" opacity="0.3"/>
  <circle cx="120" cy="80" r="3" fill="#43a047"/>
  <!-- Crosshair on tool -->
  <line x1="114" y1="80" x2="126" y2="80" stroke="#43a047" stroke-width="1"/>
  <line x1="120" y1="74" x2="120" y2="86" stroke="#43a047" stroke-width="1"/>
</svg>
