<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#161b27"/>
  <!-- Ground -->
  <rect x="0" y="75" width="100" height="25" rx="0" fill="#1a2535"/>
  <!-- Chimney stack left -->
  <rect x="8" y="30" width="10" height="50" rx="2" fill="#374151"/>
  <rect x="7" y="28" width="12" height="5" rx="2" fill="#4b5563"/>
  <!-- Chimney smoke -->
  <circle cx="13" cy="22" r="4" fill="#6b7a99" opacity="0.7"/>
  <circle cx="16" cy="15" r="3" fill="#6b7a99" opacity="0.5"/>
  <circle cx="12" cy="8" r="2.5" fill="#6b7a99" opacity="0.3"/>
  <!-- Boiler building -->
  <rect x="35" y="40" width="32" height="38" rx="3" fill="#1f2535"/>
  <rect x="35" y="40" width="32" height="8" rx="3" fill="#e53935" opacity="0.8"/>
  <!-- Flame inside boiler -->
  <path d="M44 60 Q47 50 51 58 Q54 50 57 60 Q54 70 51 68 Q47 70 44 60Z" fill="#f4511e" opacity="0.9"/>
  <path d="M46 62 Q49 55 51 60 Q53 55 55 62 Q53 68 51 67 Q49 68 46 62Z" fill="#f5c842" opacity="0.8"/>
  <!-- Turbine -->
  <circle cx="76" cy="55" r="11" fill="#1f2535" stroke="#2a3050" stroke-width="1.5"/>
  <circle cx="76" cy="55" r="7" fill="#2a3050"/>
  <circle cx="76" cy="55" r="3" fill="#e53935"/>
  <!-- Turbine blades -->
  <line x1="76" y1="44" x2="76" y2="48" stroke="#4f8ef7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="62" x2="76" y2="66" stroke="#4f8ef7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="55" x2="69" y2="55" stroke="#4f8ef7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="83" y1="55" x2="87" y2="55" stroke="#4f8ef7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam pipe boiler to turbine -->
  <path d="M67 48 Q72 42 76 44" stroke="#e53935" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cooling tower -->
  <path d="M22 75 L18 55 Q20 48 24 55 L22 75Z" fill="#374151"/>
  <ellipse cx="22" cy="75" rx="3" ry="1.5" fill="#4b5563"/>
  <!-- Coal conveyor -->
  <rect x="38" y="78" width="22" height="4" rx="2" fill="#374151"/>
  <rect x="36" y="77" width="26" height="2" rx="1" fill="#4b5563"/>
  <!-- Power line tower -->
  <line x1="88" y1="75" x2="88" y2="30" stroke="#6b7a99" stroke-width="1.5"/>
  <line x1="84" y1="35" x2="92" y2="35" stroke="#6b7a99" stroke-width="1.5"/>
  <line x1="84" y1="43" x2="92" y2="43" stroke="#6b7a99" stroke-width="1.5"/>
  <!-- Lightning bolt (power) -->
  <path d="M87 20 L83 28 L87 27 L83 36" stroke="#f5c842" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
