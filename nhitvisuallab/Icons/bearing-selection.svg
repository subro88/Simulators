<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="2" y="2" width="196" height="196" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Outer race -->
  <circle cx="100" cy="95" r="62" fill="none" stroke="#9e9e9e" stroke-width="8" opacity="0.7"/>
  <circle cx="100" cy="95" r="62" fill="none" stroke="#bdbdbd" stroke-width="3" opacity="0.3"/>

  <!-- Inner race -->
  <circle cx="100" cy="95" r="28" fill="none" stroke="#9e9e9e" stroke-width="7" opacity="0.7"/>
  <circle cx="100" cy="95" r="28" fill="none" stroke="#bdbdbd" stroke-width="2.5" opacity="0.3"/>

  <!-- Bore hole -->
  <circle cx="100" cy="95" r="18" fill="#1f2535" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Cage (thin dashed circle between races) -->
  <circle cx="100" cy="95" r="45" fill="none" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Rolling elements (8 ball bearings evenly spaced) -->
  <!-- Ball 1: 0 deg -->
  <circle cx="145" cy="95" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="145" cy="95" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 2: 45 deg -->
  <circle cx="131.82" cy="63.18" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="131.82" cy="63.18" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 3: 90 deg -->
  <circle cx="100" cy="50" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="100" cy="50" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 4: 135 deg -->
  <circle cx="68.18" cy="63.18" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="68.18" cy="63.18" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 5: 180 deg -->
  <circle cx="55" cy="95" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="55" cy="95" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 6: 225 deg -->
  <circle cx="68.18" cy="126.82" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="68.18" cy="126.82" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 7: 270 deg -->
  <circle cx="100" cy="140" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="100" cy="140" r="4" fill="#ce93d8" opacity="0.4"/>
  <!-- Ball 8: 315 deg -->
  <circle cx="131.82" cy="126.82" r="8" fill="#7b1fa2" opacity="0.85"/>
  <circle cx="131.82" cy="126.82" r="4" fill="#ce93d8" opacity="0.4"/>

  <!-- Cage connecting lines -->
  <line x1="145" y1="95" x2="131.82" y2="63.18" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="131.82" y1="63.18" x2="100" y2="50" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="100" y1="50" x2="68.18" y2="63.18" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="68.18" y1="63.18" x2="55" y2="95" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="55" y1="95" x2="68.18" y2="126.82" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="68.18" y1="126.82" x2="100" y2="140" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="100" y1="140" x2="131.82" y2="126.82" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>
  <line x1="131.82" y1="126.82" x2="145" y2="95" stroke="#7b1fa2" stroke-width="1" opacity="0.35"/>

  <!-- Label -->
  <text x="100" y="178" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#ce93d8" letter-spacing="1.5">L10</text>
</svg>