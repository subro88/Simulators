<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Tank glass -->
  <path d="M 40 50 L 40 165 L 160 165 L 160 50" fill="none" stroke="#7ec8e3" stroke-width="3" stroke-linecap="round"/>
  <!-- Water body -->
  <rect x="42" y="92" width="116" height="71" fill="#0288d1" fill-opacity="0.55"/>
  <rect x="42" y="92" width="116" height="71" fill="url(#wgrad)"/>
  <defs>
    <linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#01579b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Wavy waterline -->
  <path d="M 42 92 Q 56 86 70 92 T 98 92 T 126 92 T 158 92" fill="none" stroke="#7fdbff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Floating ice cube (90% submerged) -->
  <rect x="80" y="84" width="44" height="44" rx="3" fill="#bfe7f5" stroke="#0d1117" stroke-width="2"/>
  <rect x="84" y="88" width="14" height="3" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Force arrows -->
  <!-- Weight arrow (red, down) -->
  <line x1="92" y1="106" x2="92" y2="148" stroke="#ff5555" stroke-width="3" stroke-linecap="round"/>
  <polygon points="92,152 87,144 97,144" fill="#ff5555"/>
  <text x="78" y="162" fill="#ff5555" font-family="Courier New, monospace" font-size="11" font-weight="700">W</text>
  <!-- Buoyancy arrow (cyan, up) -->
  <line x1="112" y1="106" x2="112" y2="64" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="112,60 107,68 117,68" fill="#4fc3f7"/>
  <text x="118" y="72" fill="#4fc3f7" font-family="Courier New, monospace" font-size="11" font-weight="700">Fb</text>
  <!-- Title text -->
  <text x="100" y="38" text-anchor="middle" fill="#0288d1" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">BUOYANCY</text>
  <text x="100" y="186" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="9">Fb = ρVg</text>
</svg>
