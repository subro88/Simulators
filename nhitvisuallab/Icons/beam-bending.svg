<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Beam (thick horizontal line) -->
  <line x1="30" y1="72" x2="170" y2="72" stroke="#00acc1" stroke-width="4" stroke-linecap="round"/>

  <!-- Left support triangle (pin) -->
  <polygon points="30,72 20,92 40,92" fill="none" stroke="#ab47bc" stroke-width="2" stroke-linejoin="round"/>
  <line x1="16" y1="92" x2="44" y2="92" stroke="#ab47bc" stroke-width="1.5"/>

  <!-- Right support triangle (roller) -->
  <polygon points="170,72 160,92 180,92" fill="none" stroke="#ab47bc" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="170" cy="95" r="3" fill="none" stroke="#ab47bc" stroke-width="1.5"/>
  <line x1="156" y1="99" x2="184" y2="99" stroke="#ab47bc" stroke-width="1.5"/>

  <!-- Point load arrow (downward, at ~60% span) -->
  <line x1="110" y1="30" x2="110" y2="68" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="110,70 105,60 115,60" fill="#ff5555"/>
  <text x="110" y="25" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#ff5555">P</text>

  <!-- Reaction arrows (upward, blue) -->
  <line x1="30" y1="96" x2="30" y2="80" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="30,76 27,83 33,83" fill="#42a5f5"/>
  <text x="30" y="104" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#42a5f5">Ra</text>

  <line x1="170" y1="103" x2="170" y2="80" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="170,76 167,83 173,83" fill="#42a5f5"/>
  <text x="170" y="112" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#42a5f5">Rb</text>

  <!-- SFD (Shear Force Diagram) -->
  <text x="14" y="124" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#3ddc84">V</text>
  <!-- Zero axis -->
  <line x1="30" y1="135" x2="170" y2="135" stroke="#6b7a99" stroke-width="0.5" stroke-dasharray="3 2"/>
  <!-- SFD shape: positive step, drop at load, negative to end -->
  <polyline points="30,135 30,122 110,122 110,148 170,148 170,135" fill="none" stroke="#3ddc84" stroke-width="2"/>
  <!-- SFD positive shading -->
  <polygon points="30,135 30,122 110,122 110,135" fill="rgba(61,220,132,0.35)"/>
  <!-- SFD negative shading -->
  <polygon points="110,135 110,148 170,148 170,135" fill="rgba(255,85,85,0.35)"/>

  <!-- BMD (Bending Moment Diagram) -->
  <text x="14" y="164" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#f5c842">M</text>
  <!-- Zero axis -->
  <line x1="30" y1="175" x2="170" y2="175" stroke="#6b7a99" stroke-width="0.5" stroke-dasharray="3 2"/>
  <!-- BMD shape: parabolic-ish triangle peaking at load point -->
  <path d="M30,175 Q70,152 110,155 Q140,158 170,175" fill="rgba(245,200,66,0.35)" stroke="#f5c842" stroke-width="2" fill-rule="nonzero"/>

  <!-- Labels -->
  <text x="100" y="194" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#00acc1">SFD &amp; BMD</text>
</svg>
