<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Star (Y) symbol on the left -->
  <!-- Center at 65, 90 -->
  <!-- Three lines from center outward -->
  <line x1="65" y1="90" x2="65" y2="50" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="30" y2="115" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="100" y2="115" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <!-- Neutral dot -->
  <circle cx="65" cy="90" r="4" fill="#dde3f0"/>
  <!-- Terminal dots -->
  <circle cx="65" cy="50" r="5" fill="#ff5555"/>
  <circle cx="30" cy="115" r="5" fill="#f5c842"/>
  <circle cx="100" cy="115" r="5" fill="#42a5f5"/>
  <!-- Y label -->
  <text x="65" y="140" fill="#ab47bc" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">Y</text>

  <!-- Double arrow between them -->
  <line x1="108" y1="90" x2="130" y2="90" stroke="#6b7a99" stroke-width="2" stroke-linecap="round"/>
  <polygon points="108,90 114,86 114,94" fill="#6b7a99"/>
  <polygon points="130,90 124,86 124,94" fill="#6b7a99"/>

  <!-- Delta symbol on the right -->
  <!-- Triangle centered at 165, 88 -->
  <line x1="165" y1="52" x2="135" y2="118" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="118" x2="195" y2="118" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="118" x2="165" y2="52" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>
  <!-- Terminal dots -->
  <circle cx="165" cy="52" r="5" fill="#ff5555"/>
  <circle cx="135" cy="118" r="5" fill="#f5c842"/>
  <circle cx="195" cy="118" r="5" fill="#42a5f5"/>
  <!-- Delta label -->
  <text x="165" y="140" fill="#ab47bc" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">&#916;</text>

  <!-- Bottom label -->
  <text x="100" y="172" fill="#ab47bc" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">Star-Delta</text>
</svg>
