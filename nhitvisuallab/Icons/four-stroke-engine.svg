<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Cylinder -->
  <rect x="70" y="30" width="60" height="100" rx="2" fill="none" stroke="#e53935" stroke-width="2.5"/>
  <!-- Cylinder head -->
  <rect x="65" y="26" width="70" height="8" rx="2" fill="#37474f" stroke="#e53935" stroke-width="1.5"/>
  <!-- Piston -->
  <rect x="74" y="85" width="52" height="14" rx="2" fill="#546e7a" stroke="#90a4ae" stroke-width="1"/>
  <!-- Piston rings -->
  <line x1="76" y1="88" x2="124" y2="88" stroke="#90a4ae" stroke-width="1"/>
  <line x1="76" y1="91" x2="124" y2="91" stroke="#90a4ae" stroke-width="1"/>
  <!-- Connecting rod -->
  <line x1="100" y1="99" x2="115" y2="145" stroke="#78909c" stroke-width="3" stroke-linecap="round"/>
  <!-- Crankshaft circle -->
  <circle cx="100" cy="150" r="22" fill="none" stroke="#4a5568" stroke-width="2"/>
  <!-- Crank arm -->
  <line x1="100" y1="150" x2="115" y2="145" stroke="#546e7a" stroke-width="5" stroke-linecap="round"/>
  <!-- Crank center -->
  <circle cx="100" cy="150" r="5" fill="#37474f" stroke="#78909c" stroke-width="1.5"/>
  <!-- Crank pin -->
  <circle cx="115" cy="145" r="3" fill="#90a4ae"/>
  <!-- Intake valve (left) -->
  <rect x="80" y="28" width="10" height="5" rx="1" fill="#42a5f5"/>
  <rect x="83" y="20" width="4" height="10" fill="#42a5f5"/>
  <!-- Exhaust valve (right) -->
  <rect x="110" y="28" width="10" height="5" rx="1" fill="#ef5350"/>
  <rect x="113" y="20" width="4" height="10" fill="#ef5350"/>
  <!-- Spark plug -->
  <rect x="97" y="18" width="6" height="8" rx="1" fill="#fdd835"/>
  <!-- Gas fill hint -->
  <rect x="72" y="34" width="56" height="50" rx="1" fill="rgba(255,152,0,0.15)"/>
  <!-- "4" label -->
  <text x="100" y="188" text-anchor="middle" fill="#e53935" font-family="sans-serif" font-weight="bold" font-size="16">4-STROKE</text>
</svg>
