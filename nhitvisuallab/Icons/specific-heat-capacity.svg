<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Beaker/container -->
  <path d="M45,60 L45,150 Q45,165 60,165 L140,165 Q155,165 155,150 L155,60" fill="#1a2332" stroke="#e53935" stroke-width="3" fill-opacity="0.8"/>
  <!-- Liquid -->
  <path d="M48,85 Q70,80 100,85 Q130,90 152,85 L152,150 Q152,162 140,162 L60,162 Q48,162 48,150Z" fill="#e53935" opacity="0.3"/>
  <!-- Flame -->
  <ellipse cx="100" cy="182" rx="25" ry="8" fill="#ff5722" opacity="0.5"/>
  <ellipse cx="100" cy="178" rx="15" ry="14" fill="#ff9800" opacity="0.7"/>
  <ellipse cx="100" cy="174" rx="8" ry="10" fill="#ffeb3b" opacity="0.9"/>
  <!-- Thermometer -->
  <rect x="90" y="40" width="8" height="80" rx="4" fill="#2d3748" stroke="#e53935" stroke-width="1.5"/>
  <rect x="91" y="75" width="6" height="45" rx="3" fill="#e53935"/>
  <circle cx="94" cy="125" r="8" fill="#e53935"/>
  <!-- Heat particles/bubbles -->
  <circle cx="70" cy="130" r="3" fill="#ff8a65" opacity="0.6"/>
  <circle cx="120" cy="120" r="4" fill="#ff8a65" opacity="0.5"/>
  <circle cx="85" cy="110" r="3" fill="#ffab91" opacity="0.6"/>
  <circle cx="130" cy="140" r="3" fill="#ff8a65" opacity="0.5"/>
  <!-- Formula -->
  <text x="100" y="22" text-anchor="middle" fill="#ef5350" font-family="sans-serif" font-weight="bold" font-size="18">Q = mc∆T</text>
</svg>