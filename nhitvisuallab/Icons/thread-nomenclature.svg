<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Bolt head (hexagon) -->
  <polygon points="100,20 145,42 145,88 100,110 55,88 55,42"
           fill="#2a3050" stroke="#4f8ef7" stroke-width="2.5"/>
  <!-- Hex highlight -->
  <polygon points="100,28 138,47 138,83 100,102 62,83 62,47"
           fill="#1f2535" stroke="#3a4a70" stroke-width="1"/>
  <!-- Bolt shaft -->
  <rect x="82" y="108" width="36" height="78" rx="2"
        fill="#2a3050" stroke="#4f8ef7" stroke-width="2"/>
  <!-- Thread grooves -->
  <line x1="82" y1="124" x2="118" y2="124" stroke="#4f8ef7" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="136" x2="118" y2="136" stroke="#4f8ef7" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="148" x2="118" y2="148" stroke="#4f8ef7" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="160" x2="118" y2="160" stroke="#4f8ef7" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="172" x2="118" y2="172" stroke="#4f8ef7" stroke-width="1.5" opacity="0.7"/>
  <!-- Thread teeth (zigzag on left side) -->
  <polyline points="82,118 74,121 82,124 74,127 82,130 74,133 82,136 74,139 82,142 74,145 82,148 74,151 82,154 74,157 82,160 74,163 82,166 74,169 82,172 74,175 82,178"
            stroke="#ef6c00" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Thread teeth (zigzag on right side) -->
  <polyline points="118,118 126,121 118,124 126,127 118,130 126,133 118,136 126,139 118,142 126,145 118,148 126,151 118,154 126,157 118,160 126,163 118,166 126,169 118,172 126,175 118,178"
            stroke="#ef6c00" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Pitch dimension arrow -->
  <line x1="134" y1="124" x2="134" y2="136" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="134,122 131,126 137,126" fill="#3ddc84"/>
  <polygon points="134,138 131,134 137,134" fill="#3ddc84"/>
  <text x="142" y="132" font-size="10" fill="#3ddc84" font-family="sans-serif" font-weight="700">P</text>
</svg>
