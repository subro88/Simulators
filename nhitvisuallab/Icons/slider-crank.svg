<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Crank circle (dashed) -->
  <circle cx="60" cy="95" r="35" fill="none" stroke="#e65100" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Cylinder walls -->
  <rect x="120" y="72" width="55" height="8" rx="1" fill="#2a3050" stroke="#6b7a99" stroke-width="0.8"/>
  <rect x="120" y="110" width="55" height="8" rx="1" fill="#2a3050" stroke="#6b7a99" stroke-width="0.8"/>
  <!-- Cylinder end cap -->
  <rect x="170" y="72" width="8" height="46" rx="1" fill="#2a3050" stroke="#6b7a99" stroke-width="0.8"/>

  <!-- Crank arm -->
  <line x1="60" y1="95" x2="88" y2="72" stroke="#e65100" stroke-width="4" stroke-linecap="round"/>
  <!-- Counterweight -->
  <circle cx="42" cy="110" r="10" fill="#e65100" opacity="0.3" stroke="#e65100" stroke-width="1"/>

  <!-- Connecting rod -->
  <line x1="88" y1="72" x2="140" y2="91" stroke="#f5c842" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Piston -->
  <rect x="130" y="80" width="28" height="22" rx="3" fill="#ff8a65" stroke="#e65100" stroke-width="1.2"/>
  <!-- Piston rings -->
  <line x1="133" y1="86" x2="155" y2="86" stroke="#e65100" stroke-width="0.6" opacity="0.6"/>
  <line x1="133" y1="96" x2="155" y2="96" stroke="#e65100" stroke-width="0.6" opacity="0.6"/>

  <!-- Pivot joints -->
  <circle cx="60" cy="95" r="4" fill="#1f2535" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="88" cy="72" r="3" fill="#1f2535" stroke="#f5c842" stroke-width="1.2"/>
  <circle cx="140" cy="91" r="3" fill="#1f2535" stroke="#f5c842" stroke-width="1.2"/>

  <!-- Ground hatching under crank pivot -->
  <line x1="46" y1="130" x2="74" y2="130" stroke="#6b7a99" stroke-width="1"/>
  <line x1="48" y1="130" x2="44" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="52" y1="130" x2="48" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="56" y1="130" x2="52" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="60" y1="130" x2="56" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="64" y1="130" x2="60" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="68" y1="130" x2="64" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <line x1="72" y1="130" x2="68" y2="134" stroke="#6b7a99" stroke-width="0.7"/>
  <!-- Support post -->
  <line x1="60" y1="99" x2="60" y2="130" stroke="#6b7a99" stroke-width="1.2"/>

  <!-- Displacement arrow -->
  <line x1="130" y1="115" x2="162" y2="115" stroke="#3ddc84" stroke-width="1" stroke-dasharray="3 2"/>
  <polygon points="162,115 157,112 157,118" fill="#3ddc84"/>
  <text x="146" y="125" text-anchor="middle" fill="#3ddc84" font-family="sans-serif" font-size="8">x</text>

  <!-- Mini sine wave at bottom -->
  <path d="M 25,160 Q 42,145 58,160 Q 75,175 92,160 Q 108,145 125,160 Q 142,175 158,160 Q 167,152 175,160"
        fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Labels -->
  <text x="60" y="145" text-anchor="middle" fill="#6b7a99" font-family="sans-serif" font-size="7">O&#8322;</text>
  <text x="100" y="190" text-anchor="middle" fill="#e65100" font-family="'Courier New',monospace" font-size="8" font-weight="700">SLIDER-CRANK</text>
</svg>
