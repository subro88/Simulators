<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Matrix A -->
  <g stroke="#ff5252" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M30 50 L26 50 L26 130 L30 130"/>
    <path d="M70 50 L74 50 L74 130 L70 130"/>
  </g>
  <g fill="#ff5252" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle">
    <text x="38" y="74">1</text><text x="62" y="74">2</text>
    <text x="38" y="98">3</text><text x="62" y="98">4</text>
    <text x="38" y="122">5</text><text x="62" y="122">6</text>
  </g>
  <text x="50" y="42" fill="#ff5252" font-family="Segoe UI, sans-serif" font-weight="800" font-size="14" text-anchor="middle">A</text>

  <!-- × -->
  <text x="88" y="98" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-weight="700" font-size="22" text-anchor="middle">×</text>

  <!-- Matrix B -->
  <g stroke="#4fc3f7" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M104 50 L100 50 L100 130 L104 130"/>
    <path d="M144 50 L148 50 L148 130 L144 130"/>
  </g>
  <g fill="#4fc3f7" font-family="Courier New, monospace" font-weight="700" font-size="14" text-anchor="middle">
    <text x="112" y="74">7</text><text x="136" y="74">8</text>
    <text x="112" y="98">9</text><text x="136" y="98">0</text>
    <text x="112" y="122">1</text><text x="136" y="122">2</text>
  </g>
  <text x="124" y="42" fill="#4fc3f7" font-family="Segoe UI, sans-serif" font-weight="800" font-size="14" text-anchor="middle">B</text>

  <!-- = -->
  <text x="160" y="98" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-weight="700" font-size="20" text-anchor="middle">=</text>

  <!-- Result mini matrix -->
  <g stroke="#ffd54f" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M174 70 L170 70 L170 130 L174 130"/>
    <path d="M194 70 L198 70 L198 130 L194 130"/>
  </g>
  <circle cx="184" cy="86" r="3" fill="#ffd54f"/>
  <circle cx="184" cy="100" r="3" fill="#ffd54f"/>
  <circle cx="184" cy="114" r="3" fill="#ffd54f"/>

  <!-- Animated row/col highlight (Row 2 of A, Col 1 of B) -->
  <rect x="28" y="88" width="44" height="20" fill="rgba(255,82,82,0.25)" stroke="#ff5252" stroke-width="1.2"/>
  <rect x="102" y="56" width="20" height="68" fill="rgba(79,195,247,0.25)" stroke="#4fc3f7" stroke-width="1.2"/>

  <!-- Dot product label -->
  <text x="100" y="172" fill="#ffd54f" font-family="Segoe UI, sans-serif" font-weight="700" font-size="11" text-anchor="middle">C[i][j] = Σ A[i][k]·B[k][j]</text>
</svg>
