<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Height ruler -->
  <rect x="25" y="25" width="12" height="155" rx="2" fill="#2d3748" stroke="#7c4dff" stroke-width="1.5"/>
  <line x1="37" y1="35" x2="42" y2="35" stroke="#7c4dff" stroke-width="1"/>
  <line x1="37" y1="60" x2="42" y2="60" stroke="#7c4dff" stroke-width="1"/>
  <line x1="37" y1="85" x2="42" y2="85" stroke="#7c4dff" stroke-width="1"/>
  <line x1="37" y1="110" x2="42" y2="110" stroke="#7c4dff" stroke-width="1"/>
  <line x1="37" y1="135" x2="42" y2="135" stroke="#7c4dff" stroke-width="1"/>
  <line x1="37" y1="160" x2="42" y2="160" stroke="#7c4dff" stroke-width="1"/>
  <!-- Afterimage trail (getting further apart = acceleration) -->
  <circle cx="100" cy="40" r="10" fill="#7c4dff" opacity="0.15"/>
  <circle cx="100" cy="55" r="10" fill="#7c4dff" opacity="0.2"/>
  <circle cx="100" cy="75" r="10" fill="#7c4dff" opacity="0.3"/>
  <circle cx="100" cy="100" r="11" fill="#7c4dff" opacity="0.45"/>
  <circle cx="100" cy="130" r="12" fill="#7c4dff" opacity="0.6"/>
  <!-- Main ball -->
  <circle cx="100" cy="130" r="14" fill="#b388ff"/>
  <circle cx="100" cy="130" r="14" fill="url(#ballGrad)"/>
  <!-- Gravity arrow -->
  <line x1="140" y1="50" x2="140" y2="150" stroke="#ff7043" stroke-width="3"/>
  <polygon points="133,145 147,145 140,160" fill="#ff7043"/>
  <text x="155" y="105" fill="#ff7043" font-family="sans-serif" font-weight="bold" font-size="18">g</text>
  <!-- Ground -->
  <line x1="55" y1="180" x2="145" y2="180" stroke="#546e7a" stroke-width="3"/>
  <line x1="60" y1="180" x2="55" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="75" y1="180" x2="70" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="85" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="105" y1="180" x2="100" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="115" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="135" y1="180" x2="130" y2="188" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Gradient def -->
  <defs>
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8daff"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </radialGradient>
  </defs>
</svg>