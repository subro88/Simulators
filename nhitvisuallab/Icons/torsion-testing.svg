<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Base rail -->
  <rect x="20" y="142" width="160" height="12" fill="#2a3050"/>
  <!-- Fixed pedestal -->
  <rect x="32" y="92" width="32" height="50" fill="#2a3550" stroke="#5066a0"/>
  <circle cx="48" cy="100" r="12" fill="#3a4575" stroke="#5066a0"/>
  <line x1="48" y1="92" x2="48" y2="108" stroke="#dde3f0" stroke-width="1"/>
  <line x1="42" y1="104" x2="54" y2="96" stroke="#dde3f0" stroke-width="1"/>
  <line x1="42" y1="96" x2="54" y2="104" stroke="#dde3f0" stroke-width="1"/>
  <!-- Rotating pedestal -->
  <rect x="136" y="92" width="32" height="50" fill="#2a3550" stroke="#5066a0"/>
  <circle cx="152" cy="100" r="12" fill="#3a4575" stroke="#5066a0"/>
  <line x1="152" y1="92" x2="152" y2="108" stroke="#dde3f0" stroke-width="1"/>
  <line x1="146" y1="104" x2="158" y2="96" stroke="#dde3f0" stroke-width="1"/>
  <line x1="146" y1="96" x2="158" y2="104" stroke="#dde3f0" stroke-width="1"/>
  <!-- Specimen with twist helix -->
  <rect x="60" y="92" width="80" height="16" fill="#e0e6f0" stroke="#3a4575"/>
  <path d="M60 100 Q80 88 100 100 T140 100" stroke="#1f2535" stroke-width="1.2" fill="none"/>
  <path d="M60 100 Q80 112 100 100 T140 100" stroke="#1f2535" stroke-width="1.2" fill="none"/>
  <!-- Twist arrows -->
  <path d="M 152 65 A 18 18 0 0 1 168 80" stroke="#ff8c42" stroke-width="2.5" fill="none"/>
  <polygon points="167,72 172,80 162,82" fill="#ff8c42"/>
  <path d="M 48 65 A 18 18 0 0 0 32 80" stroke="#ff8c42" stroke-width="2.5" fill="none"/>
  <polygon points="33,72 28,80 38,82" fill="#ff8c42"/>
  <!-- Twist dial -->
  <circle cx="100" cy="48" r="22" fill="#0d1117" stroke="#3a4575" stroke-width="2"/>
  <circle cx="100" cy="48" r="2.5" fill="#ff8c42"/>
  <line x1="100" y1="48" x2="115" y2="38" stroke="#ff8c42" stroke-width="2"/>
  <text x="100" y="32" fill="#dde3f0" font-family="Segoe UI, sans-serif" font-size="6" text-anchor="middle">0</text>
  <text x="120" y="51" fill="#dde3f0" font-family="Segoe UI, sans-serif" font-size="6" text-anchor="middle">90</text>
  <text x="100" y="68" fill="#dde3f0" font-family="Segoe UI, sans-serif" font-size="6" text-anchor="middle">180</text>
  <text x="80" y="51" fill="#dde3f0" font-family="Segoe UI, sans-serif" font-size="6" text-anchor="middle">270</text>
  <!-- Label -->
  <text x="100" y="178" fill="#ff8c42" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TORSION</text>
</svg>
