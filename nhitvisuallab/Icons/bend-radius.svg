<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- bent sheet-metal L-profile (thickness shown) -->
  <path d="M44 150 L44 84 A28 28 0 0 1 72 56 L150 56 L150 80 L84 80 A8 8 0 0 0 76 88 L76 150 Z"
        fill="#7d8a9c" stroke="#cdd6e3" stroke-width="2" stroke-linejoin="round"/>
  <!-- 45-degree section hatch -->
  <g stroke="#2a3050" stroke-width="1.4" opacity="0.5">
    <line x1="50" y1="150" x2="76" y2="124"/>
    <line x1="50" y1="132" x2="76" y2="106"/>
    <line x1="98" y1="80" x2="122" y2="56"/>
    <line x1="120" y1="80" x2="144" y2="56"/>
  </g>
  <!-- inside-radius arc highlight + center -->
  <path d="M76 88 A8 8 0 0 1 84 80" fill="none" stroke="#d4922a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="88" r="2.6" fill="#d4922a"/>
  <line x1="84" y1="88" x2="76" y2="88" stroke="#d4922a" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- neutral axis (dashed) -->
  <path d="M60 150 L60 90 A12 12 0 0 1 72 78 L150 78" fill="none" stroke="#ffca28" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9"/>
  <!-- bend-angle marker -->
  <path d="M92 100 A18 18 0 0 0 100 116" fill="none" stroke="#7cc4ff" stroke-width="2"/>
  <text x="100" y="130" font-family="monospace" font-size="15" fill="#7cc4ff" text-anchor="middle">90°</text>
  <!-- R label -->
  <text x="64" y="74" font-family="monospace" font-size="14" fill="#e8b25a" text-anchor="middle">R</text>
</svg>
