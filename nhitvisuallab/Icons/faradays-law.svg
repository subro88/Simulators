<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- coil loops -->
  <g fill="none" stroke="#cdd4eb" stroke-width="4">
    <ellipse cx="120" cy="100" rx="11" ry="34"/>
    <ellipse cx="133" cy="100" rx="11" ry="34"/>
    <ellipse cx="146" cy="100" rx="11" ry="34"/>
    <ellipse cx="159" cy="100" rx="11" ry="34"/>
  </g>
  <!-- glow ring (induced) -->
  <ellipse cx="139" cy="100" rx="26" ry="40" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.6"/>
  <!-- bar magnet -->
  <g>
    <rect x="34" y="84" width="32" height="32" rx="5" fill="#e53935"/>
    <rect x="66" y="84" width="32" height="32" rx="5" fill="#1e88e5"/>
    <rect x="34" y="84" width="64" height="32" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <text x="50" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">N</text>
    <text x="82" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  </g>
  <!-- motion arrow -->
  <g stroke="#f5c842" stroke-width="4" fill="#f5c842" stroke-linecap="round">
    <line x1="92" y1="66" x2="112" y2="66"/>
    <path d="M112 60 L124 66 L112 72 Z" stroke="none"/>
  </g>
  <!-- field lines -->
  <g fill="none" stroke="#ff9678" stroke-width="2" opacity="0.7">
    <path d="M66 100 q22 -22 44 0"/>
    <path d="M66 100 q22 22 44 0"/>
  </g>
  <!-- EMF label -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6366f1" text-anchor="middle">e = &#8722;N d&#934;/dt</text>
</svg>
