<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Circuit wires (cyan accent) -->
  <!-- Top wire -->
  <line x1="40" y1="60" x2="160" y2="60" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom wire -->
  <line x1="40" y1="140" x2="160" y2="140" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left vertical (battery side) -->
  <line x1="40" y1="60" x2="40" y2="140" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right vertical (capacitor side) -->
  <line x1="160" y1="60" x2="160" y2="82" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="118" x2="160" y2="140" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Battery (left side, vertical) -->
  <!-- Long plate (positive) -->
  <line x1="33" y1="88" x2="47" y2="88" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <!-- Short plate (negative) -->
  <line x1="36" y1="96" x2="44" y2="96" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Long plate 2 -->
  <line x1="33" y1="104" x2="47" y2="104" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <!-- Short plate 2 -->
  <line x1="36" y1="112" x2="44" y2="112" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- + label -->
  <text x="22" y="92" fill="#ff5555" font-size="11" font-weight="bold" font-family="sans-serif">+</text>
  <!-- - label -->
  <text x="22" y="116" fill="#42a5f5" font-size="13" font-weight="bold" font-family="sans-serif">-</text>

  <!-- Resistor (zigzag on top wire) -->
  <polyline points="72,60 77,48 85,72 93,48 101,72 109,48 117,72 122,60"
    fill="none" stroke="#4dd0e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R label -->
  <text x="97" y="43" fill="#4dd0e1" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">R</text>

  <!-- Capacitor (two parallel plates on right side) -->
  <line x1="150" y1="82" x2="170" y2="82" stroke="#00bcd4" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="118" x2="170" y2="118" stroke="#00bcd4" stroke-width="3.5" stroke-linecap="round"/>
  <!-- C label -->
  <text x="175" y="104" fill="#00bcd4" font-size="11" font-weight="bold" font-family="sans-serif">C</text>

  <!-- Charging curve indicator (small exponential curve) -->
  <path d="M60,155 Q80,155 90,148 Q100,140 110,130 Q120,125 135,124" fill="none" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
  <!-- Dashed target line -->
  <line x1="58" y1="124" x2="138" y2="124" stroke="#3ddc84" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Formula label -->
  <text x="100" y="176" fill="#00bcd4" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">V = V&#8320;(1-e&#x207B;&#x1D57;&#x2F;&#x1D69C;)</text>
</svg>