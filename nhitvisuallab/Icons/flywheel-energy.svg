<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Flywheel outer ring -->
  <circle cx="100" cy="90" r="52" fill="none" stroke="#558b2f" stroke-width="5"/>
  <!-- Inner ring -->
  <circle cx="100" cy="90" r="36" fill="none" stroke="#558b2f" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Hub -->
  <circle cx="100" cy="90" r="10" fill="#558b2f" fill-opacity="0.3" stroke="#558b2f" stroke-width="2"/>
  <!-- Center dot (axle) -->
  <circle cx="100" cy="90" r="3" fill="#558b2f"/>

  <!-- Spokes -->
  <line x1="100" y1="80" x2="100" y2="54" stroke="#558b2f" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="100" y2="126" stroke="#558b2f" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="90" y1="90" x2="64" y2="90" stroke="#558b2f" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="110" y1="90" x2="136" y2="90" stroke="#558b2f" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Diagonal spokes -->
  <line x1="93" y1="83" x2="63" y2="53" stroke="#558b2f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="107" y1="97" x2="137" y2="127" stroke="#558b2f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="107" y1="83" x2="137" y2="53" stroke="#558b2f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="93" y1="97" x2="63" y2="127" stroke="#558b2f" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Rotation arrow (curved) -->
  <path d="M 145,65 A 55,55 0 0,1 145,115" fill="none" stroke="#7cb342" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="145,115 140,106 150,108" fill="#7cb342"/>

  <!-- Energy bar (bottom) -->
  <rect x="30" y="155" width="140" height="12" rx="6" fill="#2a3050"/>
  <rect x="30" y="155" width="95" height="12" rx="6" fill="#558b2f" fill-opacity="0.7"/>

  <!-- Labels -->
  <text x="100" y="180" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#558b2f">KE = 1/2 I&#x3C9;&#xB2;</text>
  <text x="100" y="193" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#7cb342">FLYWHEEL</text>
</svg>
