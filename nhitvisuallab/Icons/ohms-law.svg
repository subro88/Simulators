<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Circuit wires (amber) -->
  <!-- Top wire: battery positive to resistor -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="#ffa000" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom wire: resistor to battery negative -->
  <line x1="50" y1="130" x2="150" y2="130" stroke="#ffa000" stroke-width="3" stroke-linecap="round"/>
  <!-- Left wire (battery side) top to bottom -->
  <line x1="50" y1="60" x2="50" y2="130" stroke="#ffa000" stroke-width="3" stroke-linecap="round"/>

  <!-- Battery (right side) -->
  <!-- Long plate (positive) -->
  <line x1="150" y1="52" x2="150" y2="68" stroke="#ffa000" stroke-width="3" stroke-linecap="round"/>
  <!-- Short plate (negative) -->
  <line x1="150" y1="122" x2="150" y2="138" stroke="#ffa000" stroke-width="3" stroke-linecap="round"/>
  <!-- Battery body connection -->
  <line x1="150" y1="68" x2="150" y2="82" stroke="#ffa000" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="108" x2="150" y2="122" stroke="#ffa000" stroke-width="2" stroke-linecap="round"/>
  <!-- Battery long plate (positive) -->
  <line x1="140" y1="82" x2="160" y2="82" stroke="#ffa000" stroke-width="4" stroke-linecap="round"/>
  <!-- Battery short plate (negative) -->
  <line x1="143" y1="92" x2="157" y2="92" stroke="#ffa000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Battery long plate 2 -->
  <line x1="140" y1="100" x2="160" y2="100" stroke="#ffa000" stroke-width="4" stroke-linecap="round"/>
  <!-- Battery short plate 2 -->
  <line x1="143" y1="108" x2="157" y2="108" stroke="#ffa000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- + and - labels -->
  <text x="165" y="87" fill="#ffa000" font-size="14" font-weight="bold" font-family="sans-serif">+</text>
  <text x="166" y="113" fill="#ffa000" font-size="16" font-weight="bold" font-family="sans-serif">-</text>

  <!-- Resistor (zigzag on top wire) - red -->
  <polyline points="75,60 80,48 88,72 96,48 104,72 112,48 120,72 125,60"
    fill="none" stroke="#ff5555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Current arrow (green) on bottom wire -->
  <line x1="115" y1="130" x2="80" y2="130" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="80,130 90,124 90,136" fill="#3ddc84"/>
  <!-- Arrow label -->
  <text x="88" y="148" fill="#3ddc84" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">I</text>

  <!-- V=IR formula label -->
  <text x="100" y="175" fill="#ffa000" font-size="18" font-weight="bold" font-family="sans-serif" text-anchor="middle">V = IR</text>
</svg>