<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Bolt head (hexagon) -->
  <polygon points="100,60 126,75 126,105 100,120 74,105 74,75" fill="none" stroke="#6b7a99" stroke-width="3"/>
  <circle cx="100" cy="90" r="8" fill="#6b7a99"/>
  <!-- Wrench handle -->
  <line x1="126" y1="90" x2="175" y2="55" stroke="#e040fb" stroke-width="5" stroke-linecap="round"/>
  <!-- Force arrow -->
  <line x1="175" y1="55" x2="165" y2="35" stroke="#3ddc84" stroke-width="3" stroke-linecap="round"/>
  <polygon points="165,35 160,42 170,40" fill="#3ddc84"/>
  <!-- Rotation arc -->
  <path d="M 85 60 A 35 35 0 0 1 115 60" fill="none" stroke="#e040fb" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="115,60 110,53 118,55" fill="#e040fb"/>
  <!-- Tau symbol -->
  <text x="100" y="155" text-anchor="middle" fill="#e040fb" font-family="serif" font-size="28" font-weight="bold">&#964; = F&#215;r</text>
  <!-- Label -->
  <text x="100" y="182" text-anchor="middle" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">TORQUE</text>
</svg>
