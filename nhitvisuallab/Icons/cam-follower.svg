<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Base circle (dashed) -->
  <circle cx="100" cy="115" r="36" fill="none" stroke="#6b7a99" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Cam profile (pear/eccentric shape) -->
  <path d="M100,79 C120,79 140,90 142,115 C144,140 125,155 100,155 C75,155 56,140 58,115 C60,95 80,79 100,79 Z"
        fill="rgba(216,67,21,0.35)" stroke="#d84315" stroke-width="2.5"/>

  <!-- Cam centre dot -->
  <circle cx="100" cy="115" r="3" fill="#d84315"/>

  <!-- Shaft hole -->
  <circle cx="100" cy="115" r="6" fill="none" stroke="#ff8a65" stroke-width="1.5"/>

  <!-- Follower guide (vertical track) -->
  <rect x="93" y="30" width="14" height="48" rx="2" fill="none" stroke="#6b7a99" stroke-width="1.2"/>

  <!-- Follower stem -->
  <line x1="100" y1="79" x2="100" y2="42" stroke="#ff8a65" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Flat follower head -->
  <rect x="85" y="74" width="30" height="5" rx="2" fill="#ff8a65"/>

  <!-- Rotation arrow (clockwise) -->
  <path d="M130,90 A35,35 0 0,1 130,140" fill="none" stroke="#d84315" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="130,140 124,132 136,134" fill="#d84315"/>

  <!-- Lift arrow -->
  <line x1="78" y1="79" x2="78" y2="55" stroke="#3ddc84" stroke-width="1.2"/>
  <polygon points="78,53 75,59 81,59" fill="#3ddc84"/>
  <text x="72" y="50" text-anchor="middle" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#3ddc84">h</text>

  <!-- Label -->
  <text x="100" y="192" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#d84315">CAM + FOLLOWER</text>
</svg>
