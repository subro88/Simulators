<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Cylinder barrel -->
  <rect x="40" y="60" width="100" height="50" rx="6" fill="none" stroke="#26a69a" stroke-width="3"/>
  <!-- End cap left -->
  <rect x="34" y="55" width="12" height="60" rx="3" fill="#26a69a" opacity="0.7"/>
  <!-- Piston head -->
  <rect x="95" y="64" width="8" height="42" rx="2" fill="#26a69a"/>
  <!-- Rod -->
  <rect x="103" y="76" width="65" height="18" rx="4" fill="#26a69a" opacity="0.85"/>
  <!-- Rod end eye -->
  <circle cx="168" cy="85" r="10" fill="none" stroke="#26a69a" stroke-width="2.5"/>
  <circle cx="168" cy="85" r="4" fill="#1f2535" stroke="#26a69a" stroke-width="1.5"/>
  <!-- Port connections -->
  <rect x="55" y="48" width="8" height="14" rx="2" fill="#26a69a" opacity="0.6"/>
  <rect x="115" y="48" width="8" height="14" rx="2" fill="#26a69a" opacity="0.6"/>
  <!-- Fluid fill -->
  <rect x="46" y="66" width="49" height="38" rx="2" fill="#26a69a" opacity="0.18"/>
  <!-- Labels -->
  <text x="100" y="145" text-anchor="middle" fill="#dde3f0" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Hydraulic</text>
  <text x="100" y="164" text-anchor="middle" fill="#6b7a99" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Cylinder</text>
</svg>