<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Plate body -->
  <rect x="35" y="60" width="130" height="80" rx="3" fill="none" stroke="#6b7a99" stroke-width="2.5"/>
  <!-- Center hole -->
  <circle cx="100" cy="100" r="18" fill="#1f2535" stroke="#6b7a99" stroke-width="2"/>
  <!-- Stress concentration bands - outermost (low stress) to innermost (high stress) -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#2196f3" stroke-width="3" opacity="0.3"/>
  <circle cx="100" cy="100" r="36" fill="none" stroke="#4caf50" stroke-width="3" opacity="0.4"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#ffeb3b" stroke-width="3.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="24" fill="none" stroke="#ff9800" stroke-width="3.5" opacity="0.7"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#e040fb" stroke-width="3" opacity="0.9"/>
  <!-- Force arrows left -->
  <line x1="15" y1="100" x2="33" y2="100" stroke="#e040fb" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="33,94 33,106 40,100" fill="#e040fb"/>
  <!-- Force arrows right -->
  <line x1="185" y1="100" x2="167" y2="100" stroke="#e040fb" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="167,94 167,106 160,100" fill="#e040fb"/>
  <!-- Kt label -->
  <text x="100" y="170" text-anchor="middle" fill="#e040fb" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Kt</text>
</svg>
