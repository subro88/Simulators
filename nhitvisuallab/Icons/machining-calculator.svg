<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Workpiece (cylinder cross-section) -->
  <rect x="70" y="50" width="90" height="50" rx="4" fill="#2a3050" stroke="#76ff03" stroke-width="2"/>
  <rect x="70" y="55" width="90" height="40" fill="#2a3050"/>
  <!-- Rotation arrows -->
  <path d="M115 42 C128 32 140 36 142 46" fill="none" stroke="#76ff03" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="142,46 138,40 144,42" fill="#76ff03"/>
  <!-- Cutting tool -->
  <polygon points="55,85 70,75 70,95" fill="#76ff03" stroke="#76ff03" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="30" y="78" width="28" height="14" rx="2" fill="#76ff03" opacity="0.7"/>
  <!-- Chip curl -->
  <path d="M68 72 C62 60 50 55 45 62 C40 69 48 65 52 58" fill="none" stroke="#76ff03" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Feed direction arrow -->
  <line x1="40" y1="110" x2="70" y2="110" stroke="#76ff03" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="70,110 64,106 64,114" fill="#76ff03"/>
  <!-- Readout panel -->
  <rect x="30" y="125" width="140" height="50" rx="6" fill="#2a3050" stroke="#76ff03" stroke-width="1" opacity="0.8"/>
  <text x="45" y="143" font-family="monospace" font-size="10" fill="#76ff03">RPM  1200</text>
  <text x="45" y="157" font-family="monospace" font-size="10" fill="#76ff03">Feed 0.25</text>
  <text x="45" y="171" font-family="monospace" font-size="10" fill="#76ff03">MRR  48.5</text>
</svg>