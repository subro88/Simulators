<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Outer race -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#42a5f5" stroke-width="4"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#42a5f5" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner race -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#42a5f5" stroke-width="4"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#42a5f5" stroke-width="1.5" opacity="0.4"/>
  <!-- Shaft hole -->
  <circle cx="100" cy="100" r="18" fill="#0d1117" stroke="#2a3050" stroke-width="1.5"/>
  <!-- Rolling elements (8 balls) -->
  <circle cx="100" cy="50" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="135" cy="55" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="150" cy="85" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="150" cy="115" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="135" cy="145" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="100" cy="150" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="65" cy="145" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="50" cy="115" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="50" cy="85" r="10" fill="#42a5f5" opacity="0.7"/>
  <circle cx="65" cy="55" r="10" fill="#42a5f5" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="3" fill="#42a5f5"/>
</svg>