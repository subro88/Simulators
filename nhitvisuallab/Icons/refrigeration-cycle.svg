<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Cycle loop -->
  <!-- Compressor (bottom-left) -->
  <rect x="30" y="115" width="40" height="35" rx="5" fill="none" stroke="#0097a7" stroke-width="2"/>
  <text x="50" y="137" text-anchor="middle" fill="#0097a7" font-size="8" font-family="sans-serif">COMP</text>
  <!-- Condenser (top) -->
  <rect x="80" y="35" width="55" height="30" rx="5" fill="none" stroke="#ff5555" stroke-width="2"/>
  <text x="107" y="54" text-anchor="middle" fill="#ff5555" font-size="8" font-family="sans-serif">COND</text>
  <!-- Expansion valve (bottom-right) -->
  <polygon points="145,115 160,132 130,132" fill="none" stroke="#f5c842" stroke-width="2"/>
  <text x="145" y="145" text-anchor="middle" fill="#f5c842" font-size="7" font-family="sans-serif">EXP</text>
  <!-- Evaporator (bottom-center) -->
  <rect x="75" y="115" width="45" height="30" rx="5" fill="none" stroke="#4dd0e1" stroke-width="2"/>
  <text x="97" y="134" text-anchor="middle" fill="#4dd0e1" font-size="8" font-family="sans-serif">EVAP</text>
  <!-- Connecting pipes -->
  <!-- Comp to Condenser (high pressure, hot) -->
  <path d="M50 115 L50 50 L80 50" fill="none" stroke="#ff5555" stroke-width="2"/>
  <polygon points="77,46 84,50 77,54" fill="#ff5555"/>
  <!-- Condenser to Expansion -->
  <path d="M135 50 L160 50 L160 115" fill="none" stroke="#ff8a65" stroke-width="2"/>
  <polygon points="156,112 160,119 164,112" fill="#ff8a65"/>
  <!-- Expansion to Evaporator -->
  <path d="M130 132 L120 132" fill="none" stroke="#4dd0e1" stroke-width="2"/>
  <polygon points="123,128 116,132 123,136" fill="#4dd0e1"/>
  <!-- Evaporator to Compressor -->
  <path d="M75 132 L70 132" fill="none" stroke="#4dd0e1" stroke-width="2"/>
  <polygon points="73,128 66,132 73,136" fill="#4dd0e1"/>
  <!-- Heat arrows -->
  <text x="165" y="88" fill="#ff5555" font-size="7" font-family="sans-serif">Q&#7480;</text>
  <line x1="170" y1="58" x2="170" y2="78" stroke="#ff5555" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="35" y="88" fill="#4dd0e1" font-size="7" font-family="sans-serif">Q&#7480;</text>
  <line x1="30" y1="78" x2="30" y2="58" stroke="#4dd0e1" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- P-h diagram mini -->
  <rect x="45" y="155" width="110" height="35" rx="4" fill="#0d1117" stroke="#2a3050" stroke-width="1"/>
  <text x="52" y="165" fill="#6b7a99" font-size="6" font-family="sans-serif">P</text>
  <text x="148" y="187" fill="#6b7a99" font-size="6" font-family="sans-serif">h</text>
  <path d="M58 182 L58 162 L78 162 Q88 162 88 170 L88 178 Q88 182 78 182 Z" fill="none" stroke="#0097a7" stroke-width="1.5"/>
  <!-- Label -->
  <text x="100" y="16" text-anchor="middle" fill="#6b7a99" font-size="10" font-family="sans-serif">Refrigeration Cycle</text>
  <text x="100" y="28" text-anchor="middle" fill="#4dd0e1" font-size="8" font-family="sans-serif">COP &#8226; P-h &#8226; Vapor Compression</text>
</svg>
