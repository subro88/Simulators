<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Circuit wires (deep purple accent) -->
  <!-- Top horizontal wire -->
  <line x1="30" y1="55" x2="170" y2="55" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom horizontal wire -->
  <line x1="30" y1="145" x2="170" y2="145" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left vertical wire -->
  <line x1="30" y1="55" x2="30" y2="145" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right vertical wire -->
  <line x1="170" y1="55" x2="170" y2="145" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AC Source (left side) - sine wave in circle -->
  <circle cx="30" cy="100" r="14" fill="none" stroke="#b388ff" stroke-width="2.5"/>
  <path d="M22,100 C24,92 28,92 30,100 C32,108 36,108 38,100" fill="none" stroke="#b388ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Resistor (zigzag on top wire) -->
  <polyline points="55,55 60,43 68,67 76,43 84,67 90,55"
    fill="none" stroke="#ff5555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="38" fill="#ff5555" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">R</text>

  <!-- Inductor (coils on right side, top to middle) -->
  <path d="M170,65 C178,70 178,78 170,80 C178,82 178,90 170,92 C178,94 178,102 170,104 C178,106 178,114 170,116"
    fill="none" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <text x="186" y="93" fill="#42a5f5" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">L</text>

  <!-- Capacitor (on bottom wire) -->
  <line x1="95" y1="145" x2="95" y2="145" stroke="#7c4dff" stroke-width="2.5"/>
  <line x1="95" y1="132" x2="95" y2="158" stroke="#3ddc84" stroke-width="3" stroke-linecap="round"/>
  <line x1="107" y1="132" x2="107" y2="158" stroke="#3ddc84" stroke-width="3" stroke-linecap="round"/>
  <!-- Gap fill wires -->
  <line x1="55" y1="145" x2="95" y2="145" stroke="#7c4dff" stroke-width="0" stroke-linecap="round"/>
  <line x1="107" y1="145" x2="145" y2="145" stroke="#7c4dff" stroke-width="0" stroke-linecap="round"/>
  <text x="101" y="170" fill="#3ddc84" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">C</text>

  <!-- Formula label -->
  <text x="100" y="188" fill="#7c4dff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Z = R + j(X</text>
  <text x="155" y="188" fill="#7c4dff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">L</text>
  <text x="163" y="188" fill="#7c4dff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">-X</text>
  <text x="177" y="188" fill="#7c4dff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">C</text>
  <text x="182" y="188" fill="#7c4dff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">)</text>
</svg>