<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Ground hatching -->
  <line x1="38" y1="142" x2="32" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="44" y1="142" x2="38" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="50" y1="142" x2="44" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="140" y1="142" x2="134" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="146" y1="142" x2="140" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="152" y1="142" x2="146" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="156" y1="142" x2="150" y2="150" stroke="#6b7a99" stroke-width="1"/>

  <!-- Ground link (fixed) -->
  <line x1="45" y1="138" x2="150" y2="138" stroke="#8899aa" stroke-width="3" stroke-linecap="round"/>

  <!-- Crank (input link) from O2 going up-right -->
  <line x1="45" y1="138" x2="68" y2="72" stroke="#00897b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Coupler (connecting link) -->
  <line x1="68" y1="72" x2="140" y2="85" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>

  <!-- Follower (output link) from O4 going up-left -->
  <line x1="150" y1="138" x2="140" y2="85" stroke="#4db6ac" stroke-width="3" stroke-linecap="round"/>

  <!-- Coupler curve trace (dashed) -->
  <path d="M68,72 Q85,55 104,58 Q120,62 140,85" fill="none" stroke="rgba(245,200,66,0.4)" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Rotation arrow at O2 -->
  <path d="M30,125 A18,18 0 0,1 55,118" fill="none" stroke="#00897b" stroke-width="1.5"/>
  <polygon points="55,118 50,124 56,124" fill="#00897b"/>

  <!-- Joint pins -->
  <circle cx="45" cy="138" r="5" fill="#1f2535" stroke="#00897b" stroke-width="2"/>
  <circle cx="68" cy="72" r="4.5" fill="#1f2535" stroke="#00897b" stroke-width="2"/>
  <circle cx="140" cy="85" r="4.5" fill="#1f2535" stroke="#4db6ac" stroke-width="2"/>
  <circle cx="150" cy="138" r="5" fill="#1f2535" stroke="#4db6ac" stroke-width="2"/>

  <!-- Joint labels -->
  <text x="35" y="160" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#00897b">O2</text>
  <text x="68" y="64" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#f5c842">A</text>
  <text x="148" y="77" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#f5c842">B</text>
  <text x="160" y="160" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#4db6ac">O4</text>

  <!-- Title -->
  <text x="100" y="190" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#00897b">4-BAR LINKAGE</text>
</svg>