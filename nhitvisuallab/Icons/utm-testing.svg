<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Base plate -->
  <rect x="35" y="162" width="130" height="16" rx="4" fill="#37474f"/>
  <rect x="40" y="160" width="120" height="4" rx="2" fill="#607d8b"/>
  <!-- Left column -->
  <rect x="52" y="34" width="16" height="130" rx="3" fill="#455a64"/>
  <rect x="54" y="34" width="4" height="130" fill="#607d8b" opacity="0.5"/>
  <!-- Right column -->
  <rect x="132" y="34" width="16" height="130" rx="3" fill="#455a64"/>
  <rect x="134" y="34" width="4" height="130" fill="#607d8b" opacity="0.5"/>
  <!-- Top beam -->
  <rect x="48" y="30" width="104" height="12" rx="4" fill="#37474f"/>
  <rect x="48" y="30" width="104" height="3" rx="2" fill="#607d8b" opacity="0.6"/>
  <!-- Moving crosshead -->
  <rect x="48" y="62" width="104" height="10" rx="3" fill="#1e88e5" opacity="0.85"/>
  <!-- Load cell -->
  <rect x="88" y="72" width="24" height="10" rx="2" fill="#1e88e5" opacity="0.6"/>
  <!-- Upper grip -->
  <path d="M92 82 L96 90 L104 90 L108 82" fill="#546e7a" stroke="#607d8b" stroke-width="1"/>
  <!-- Specimen -->
  <rect x="96" y="90" width="8" height="48" rx="1" fill="#dde3f0" opacity="0.7"/>
  <!-- Neck indication -->
  <ellipse cx="100" cy="114" rx="2.5" ry="8" fill="#0d1117" opacity="0.3"/>
  <!-- Lower grip -->
  <path d="M92 146 L96 138 L104 138 L108 146" fill="#546e7a" stroke="#607d8b" stroke-width="1"/>
  <!-- Lower platform -->
  <rect x="48" y="146" width="104" height="10" rx="3" fill="#37474f"/>
  <!-- Force arrow up -->
  <path d="M100 24 L100 32 M96 28 L100 22 L104 28" stroke="#1e88e5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Force arrow down -->
  <path d="M100 176 L100 168 M96 172 L100 178 L104 172" stroke="#1e88e5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Digital display -->
  <rect x="140" y="86" width="28" height="18" rx="3" fill="#0d1117" stroke="#1e88e5" stroke-width="1" opacity="0.8"/>
  <text x="154" y="98" text-anchor="middle" font-size="7" font-family="monospace" fill="#1e88e5" font-weight="bold">kN</text>
  <!-- Status LED -->
  <circle cx="154" cy="112" r="3" fill="#3ddc84" opacity="0.9"/>
</svg>
