<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Engine block -->
  <rect x="28" y="64" width="92" height="80" rx="4" fill="#161b27" stroke="#00897b" stroke-width="2"/>
  <!-- Cylinders (4 inline) -->
  <rect x="36" y="56" width="14" height="20" fill="#1f2535" stroke="#00897b" stroke-width="1.5"/>
  <rect x="56" y="56" width="14" height="20" fill="#1f2535" stroke="#00897b" stroke-width="1.5"/>
  <rect x="76" y="56" width="14" height="20" fill="#1f2535" stroke="#ff5555" stroke-width="1.5"/>
  <rect x="96" y="56" width="14" height="20" fill="#1f2535" stroke="#00897b" stroke-width="1.5"/>
  <!-- Spark/flames -->
  <circle cx="43" cy="66" r="4" fill="#f5c842"/>
  <circle cx="63" cy="66" r="4" fill="#f5c842"/>
  <circle cx="83" cy="66" r="3" fill="#3a3540"/>
  <circle cx="103" cy="66" r="4" fill="#f5c842"/>
  <!-- "Cut" marker on Cyl 3 -->
  <line x1="78" y1="58" x2="88" y2="74" stroke="#ff5555" stroke-width="2"/>
  <line x1="88" y1="58" x2="78" y2="74" stroke="#ff5555" stroke-width="2"/>
  <!-- Crankshaft line -->
  <rect x="30" y="138" width="90" height="6" fill="#444a60"/>
  <circle cx="125" cy="141" r="6" fill="#00897b"/>
  <!-- Coupling to dynamometer -->
  <rect x="131" y="139" width="14" height="4" fill="#444a60"/>
  <!-- Brake drum -->
  <circle cx="158" cy="141" r="18" fill="#1f2535" stroke="#00897b" stroke-width="2"/>
  <circle cx="158" cy="141" r="3" fill="#00897b"/>
  <line x1="158" y1="141" x2="172" y2="141" stroke="#00897b" stroke-width="2"/>
  <!-- Brake arm -->
  <rect x="158" y="160" width="4" height="22" fill="#7c8aa6"/>
  <!-- Weight -->
  <rect x="150" y="182" width="20" height="10" fill="#f5c842" stroke="#2a3050"/>
  <!-- Title -->
  <text x="100" y="32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#00897b" text-anchor="middle">MORSE TEST</text>
  <text x="100" y="46" font-family="Segoe UI, sans-serif" font-size="9" fill="#6b7a99" text-anchor="middle">IC Engine — Cut Out Method</text>
</svg>
