<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Large gear (pinion) -->
  <g transform="translate(75,90)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffab00" stroke-width="2.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="9" fill="#ffab00" opacity="0.6"/>
    <circle cx="0" cy="0" r="4.5" fill="#1f2535"/>
    <g fill="#ffab00" opacity="0.85">
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(0)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(30)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(60)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(90)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(120)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(150)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(180)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(210)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(240)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(270)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(300)"/>
      <rect x="-4.5" y="-42" width="9" height="10" rx="1.5" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Small gear (meshing) -->
  <g transform="translate(135,68)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ffe082" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#ffe082" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#1f2535"/>
    <g fill="#ffe082" opacity="0.85">
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(0)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(45)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(90)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(135)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(180)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(225)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(270)"/>
      <rect x="-3.5" y="-28" width="7" height="8" rx="1.5" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Stress arrow (force) -->
  <line x1="55" y1="130" x2="55" y2="105" stroke="#ff5555" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="55,100 50,110 60,110" fill="#ff5555"/>

  <!-- Sigma label -->
  <text x="100" y="162" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#ffe082" letter-spacing="1">&#963; AGMA</text>
</svg>