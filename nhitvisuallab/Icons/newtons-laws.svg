<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="92" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Surface / ground -->
  <line x1="22" y1="142" x2="178" y2="142" stroke="#4a5578" stroke-width="2.5"/>
  <!-- Surface hash marks -->
  <line x1="32" y1="142" x2="26" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="52" y1="142" x2="46" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="72" y1="142" x2="66" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="92" y1="142" x2="86" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="112" y1="142" x2="106" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="132" y1="142" x2="126" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="152" y1="142" x2="146" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <line x1="172" y1="142" x2="166" y2="151" stroke="#4a5578" stroke-width="1.2"/>
  <!-- Block / mass -->
  <rect x="62" y="96" width="58" height="46" rx="4" fill="rgba(249,168,37,0.35)" stroke="#f9a825" stroke-width="2.5"/>
  <text x="91" y="124" text-anchor="middle" fill="#f9a825" font-family="Segoe UI,sans-serif" font-size="16" font-weight="700">m</text>
  <!-- Applied Force arrow (right, green) -->
  <line x1="120" y1="119" x2="168" y2="119" stroke="#3ddc84" stroke-width="3.5"/>
  <polygon points="174,119 165,113 165,125" fill="#3ddc84"/>
  <text x="152" y="109" text-anchor="middle" fill="#3ddc84" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700">F</text>
  <!-- Acceleration arrow (right, blue) -->
  <line x1="91" y1="78" x2="138" y2="78" stroke="#42a5f5" stroke-width="2.5"/>
  <polygon points="143,78 136,73 136,83" fill="#42a5f5"/>
  <text x="118" y="71" text-anchor="middle" fill="#42a5f5" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700">a</text>
  <!-- Weight arrow (down, red) -->
  <line x1="48" y1="119" x2="48" y2="146" stroke="#ff5555" stroke-width="2"/>
  <polygon points="48,152 43,144 53,144" fill="#ff5555"/>
  <text x="48" y="112" text-anchor="middle" fill="#ff5555" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700">W</text>
  <!-- F = ma equation -->
  <text x="100" y="173" text-anchor="middle" fill="#f9a825" font-family="Courier New,monospace" font-size="18" font-weight="700">F = ma</text>
</svg>
