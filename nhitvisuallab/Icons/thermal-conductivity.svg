<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Title -->
  <text x="100" y="30" text-anchor="middle" fill="#fb8c00" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">CONDUCTIVITY</text>

  <!-- Two rods stacked -->
  <defs>
    <linearGradient id="rodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc3c1e"/>
      <stop offset="0.5" stop-color="#ffc850"/>
      <stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
  </defs>

  <!-- Rod A (conductor) -->
  <rect x="40" y="60" width="120" height="22" fill="url(#rodGrad)" stroke="#d27a3a" stroke-width="2.5"/>
  <text x="50" y="74" fill="#fff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700">Cu  k=401</text>

  <!-- Flame on left of A -->
  <ellipse cx="30" cy="71" rx="9" ry="11" fill="#ff7043"/>
  <ellipse cx="30" cy="71" rx="5" ry="6" fill="#fff7c0"/>
  <!-- Cold fin on right of A -->
  <rect x="162" y="60" width="10" height="22" fill="#1a3050" stroke="#7fdbff" stroke-width="1.5"/>

  <!-- Rod B (insulator) -->
  <rect x="40" y="118" width="120" height="22" fill="url(#rodGrad)" opacity="0.55" stroke="#a06b3c" stroke-width="2.5"/>
  <text x="50" y="132" fill="#fff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700">Wood k=0.13</text>

  <!-- Flame on left of B -->
  <ellipse cx="30" cy="129" rx="9" ry="11" fill="#ff7043"/>
  <ellipse cx="30" cy="129" rx="5" ry="6" fill="#fff7c0"/>
  <!-- Cold fin on right of B -->
  <rect x="162" y="118" width="10" height="22" fill="#1a3050" stroke="#7fdbff" stroke-width="1.5"/>

  <!-- Heat-flow arrows: long for Cu, short for wood -->
  <line x1="50" y1="98" x2="150" y2="98" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="150,98 144,94 144,102" fill="#ffb74d"/>

  <line x1="50" y1="156" x2="68" y2="156" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="68,156 62,152 62,160" fill="#ffb74d"/>

  <!-- Footer formula -->
  <text x="100" y="184" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="9">Q/t = k·A·ΔT/L</text>
</svg>
