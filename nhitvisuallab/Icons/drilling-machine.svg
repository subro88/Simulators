<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Base -->
  <rect x="15" y="100" width="90" height="10" rx="3" fill="#43a047"/>
  <!-- Column -->
  <rect x="22" y="25" width="10" height="75" rx="2" fill="#388e3c"/>
  <!-- Head/Motor housing -->
  <rect x="30" y="20" width="45" height="22" rx="5" fill="#43a047"/>
  <rect x="32" y="22" width="41" height="18" rx="4" fill="#2e7d32"/>
  <!-- Pulley cover -->
  <ellipse cx="52" cy="18" rx="12" ry="5" fill="#388e3c" stroke="#43a047" stroke-width="1"/>
  <!-- Spindle -->
  <rect x="49" y="42" width="6" height="20" fill="#78909c"/>
  <!-- Chuck -->
  <path d="M46 62 L58 62 L56 68 L48 68 Z" fill="#607d8b"/>
  <rect x="50" y="66" width="4" height="3" fill="#546e7a"/>
  <!-- Drill bit -->
  <line x1="52" y1="69" x2="52" y2="85" stroke="#b0bec5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="52,90 50,85 54,85" fill="#b0bec5"/>
  <!-- Table -->
  <rect x="35" y="86" width="50" height="6" rx="2" fill="#43a047"/>
  <rect x="50" y="82" width="10" height="4" rx="1" fill="#388e3c"/>
  <!-- Feed handle -->
  <line x1="70" y1="45" x2="82" y2="38" stroke="#66bb6a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="82" cy="38" r="3" fill="#66bb6a"/>
  <!-- Workpiece -->
  <rect x="46" y="88" width="12" height="5" rx="1" fill="#ffb74d"/>
  <!-- Chips sparkle -->
  <circle cx="44" cy="86" r="1" fill="#fff59d" opacity="0.7"/>
  <circle cx="60" cy="84" r="0.8" fill="#fff59d" opacity="0.6"/>
  <circle cx="48" cy="83" r="0.6" fill="#fff59d" opacity="0.5"/>
  <!-- Rotation arrow -->
  <path d="M42 55 A8 8 0 0 1 62 55" fill="none" stroke="#a5d6a7" stroke-width="1.2" stroke-dasharray="2 1"/>
  <polygon points="62,55 60,51 64,53" fill="#a5d6a7"/>
  <!-- Speed label -->
  <text x="75" y="58" font-size="7" fill="#a5d6a7" font-family="monospace">RPM</text>
</svg>
