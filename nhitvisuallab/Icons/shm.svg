<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Fixed wall -->
  <rect x="80" y="22" width="40" height="6" rx="2" fill="#2a3050" stroke="#6b7a99" stroke-width="1"/>
  <line x1="85" y1="22" x2="81" y2="28" stroke="#6b7a99" stroke-width="0.8"/>
  <line x1="92" y1="22" x2="88" y2="28" stroke="#6b7a99" stroke-width="0.8"/>
  <line x1="99" y1="22" x2="95" y2="28" stroke="#6b7a99" stroke-width="0.8"/>
  <line x1="106" y1="22" x2="102" y2="28" stroke="#6b7a99" stroke-width="0.8"/>
  <line x1="113" y1="22" x2="109" y2="28" stroke="#6b7a99" stroke-width="0.8"/>

  <!-- Spring (zigzag) -->
  <polyline points="100,28 86,36 114,44 86,52 114,60 86,68 114,76 86,84 114,92 100,98"
            fill="none" stroke="#6b7a99" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mass block -->
  <rect x="78" y="98" width="44" height="32" rx="5" fill="#00bfa5" stroke="#004d40" stroke-width="1.5"/>
  <text x="100" y="118" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">m</text>

  <!-- Displacement arrow -->
  <line x1="134" y1="82" x2="134" y2="120" stroke="#ff5555" stroke-width="1.5"/>
  <polygon points="134,120 130,114 138,114" fill="#ff5555"/>
  <text x="144" y="104" fill="#ff5555" font-family="sans-serif" font-size="9">x</text>

  <!-- Sine wave at bottom -->
  <path d="M 20,160 Q 35,140 50,160 Q 65,180 80,160 Q 95,140 110,160 Q 125,180 140,160 Q 155,140 170,160 Q 177,168 180,160"
        fill="none" stroke="#00bfa5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Formula label -->
  <text x="100" y="190" text-anchor="middle" fill="#6b7a99" font-family="sans-serif" font-size="10">x = A cos(&#969;t)</text>
</svg>
