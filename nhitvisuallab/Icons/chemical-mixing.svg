<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Left beaker (acid - red tint) -->
  <rect x="28" y="65" width="50" height="70" rx="3" fill="none" stroke="rgba(180,210,240,0.35)" stroke-width="2.5"/>
  <rect x="30" y="95" width="46" height="38" rx="2" fill="#ff5722" opacity="0.35"/>
  <line x1="22" y1="65" x2="28" y2="72" stroke="rgba(180,210,240,0.35)" stroke-width="2"/>
  <line x1="78" y1="72" x2="84" y2="65" stroke="rgba(180,210,240,0.35)" stroke-width="2"/>
  <!-- Right beaker (base - blue tint) -->
  <rect x="122" y="65" width="50" height="70" rx="3" fill="none" stroke="rgba(180,210,240,0.35)" stroke-width="2.5"/>
  <rect x="124" y="95" width="46" height="38" rx="2" fill="#3f51b5" opacity="0.35"/>
  <line x1="116" y1="65" x2="122" y2="72" stroke="rgba(180,210,240,0.35)" stroke-width="2"/>
  <line x1="172" y1="72" x2="178" y2="65" stroke="rgba(180,210,240,0.35)" stroke-width="2"/>
  <!-- Pour streams -->
  <path d="M78,90 Q95,85 100,105" stroke="#ff5722" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M122,90 Q105,85 100,105" stroke="#3f51b5" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Central mixing beaker -->
  <path d="M75,100 L72,155 L128,155 L125,100" fill="none" stroke="rgba(180,210,240,0.5)" stroke-width="2.5"/>
  <!-- Mixed liquid (green/teal) -->
  <path d="M73,125 L72,155 L128,155 L127,125 Z" fill="#009688" opacity="0.45"/>
  <!-- Bubbles -->
  <circle cx="90" cy="135" r="3" fill="none" stroke="#009688" stroke-width="1" opacity="0.6"/>
  <circle cx="105" cy="130" r="2.5" fill="none" stroke="#009688" stroke-width="1" opacity="0.5"/>
  <circle cx="112" cy="140" r="2" fill="none" stroke="#009688" stroke-width="1" opacity="0.4"/>
  <!-- pH strip on right side -->
  <rect x="145" y="100" width="8" height="45" rx="1.5" fill="#4caf50" opacity="0.85"/>
  <rect x="146" y="100" width="6" height="8" rx="1" fill="#e0e0e0"/>
  <!-- pH color bar bottom -->
  <rect x="35" y="162" width="13" height="8" rx="2" fill="#ff1744"/>
  <rect x="50" y="162" width="13" height="8" rx="2" fill="#ff9800"/>
  <rect x="65" y="162" width="13" height="8" rx="2" fill="#cddc39"/>
  <rect x="80" y="162" width="13" height="8" rx="2" fill="#4caf50"/>
  <rect x="95" y="162" width="13" height="8" rx="2" fill="#00bcd4"/>
  <rect x="110" y="162" width="13" height="8" rx="2" fill="#3f51b5"/>
  <rect x="125" y="162" width="13" height="8" rx="2" fill="#9c27b0"/>
  <text x="96" y="157" font-family="Segoe UI, sans-serif" font-size="8" fill="#6b7a99" text-anchor="middle">pH 0-14</text>
  <!-- Title -->
  <text x="100" y="188" font-family="Segoe UI, sans-serif" font-size="11" fill="#dde3f0" text-anchor="middle" font-weight="600">Chemical Mixing Lab</text>
</svg>
