<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Compressor circle -->
  <circle cx="55" cy="150" r="16" fill="none" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- Compressor zigzag (air symbol) -->
  <polyline points="47,150 51,144 55,156 59,144 63,150" fill="none" stroke="#42a5f5" stroke-width="2" stroke-linejoin="round"/>
  <!-- Supply line up -->
  <line x1="55" y1="134" x2="55" y2="100" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- FRL unit -->
  <rect x="46" y="100" width="18" height="14" rx="3" fill="none" stroke="#80d8ff" stroke-width="2"/>
  <circle cx="55" cy="107" r="4" fill="none" stroke="#80d8ff" stroke-width="1.5"/>
  <!-- Supply from FRL up -->
  <line x1="55" y1="100" x2="55" y2="75" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- Horizontal to 5/2 DCV -->
  <line x1="55" y1="75" x2="95" y2="75" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- 5/2 DCV - two position boxes -->
  <rect x="83" y="62" width="24" height="26" rx="2" fill="none" stroke="#42a5f5" stroke-width="2.5"/>
  <rect x="107" y="62" width="24" height="26" rx="2" fill="none" stroke="#64b5f6" stroke-width="1.5" opacity="0.5"/>
  <!-- Port labels -->
  <text x="88" y="57" font-size="7" fill="#80d8ff" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="102" y="57" font-size="7" fill="#80d8ff" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="83" y="97" font-size="7" fill="#80d8ff" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="95" y="97" font-size="7" fill="#80d8ff" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="107" y="97" font-size="7" fill="#80d8ff" text-anchor="middle" font-family="sans-serif">5</text>
  <!-- DCV internal arrows -->
  <line x1="88" y1="83" x2="102" y2="67" stroke="#42a5f5" stroke-width="1.5"/>
  <line x1="102" y1="83" x2="88" y2="67" stroke="#42a5f5" stroke-width="1.5"/>
  <!-- Line from port 2 to cylinder cap -->
  <line x1="88" y1="62" x2="88" y2="42" stroke="#42a5f5" stroke-width="2.5"/>
  <line x1="88" y1="42" x2="130" y2="42" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- Line from port 4 to cylinder rod side -->
  <line x1="102" y1="62" x2="102" y2="34" stroke="#64b5f6" stroke-width="2"/>
  <line x1="102" y1="34" x2="130" y2="34" stroke="#64b5f6" stroke-width="2"/>
  <!-- Cylinder body -->
  <rect x="128" y="24" width="52" height="26" rx="2" fill="none" stroke="#42a5f5" stroke-width="2.5"/>
  <!-- Piston -->
  <line x1="155" y1="26" x2="155" y2="48" stroke="#64b5f6" stroke-width="2.5"/>
  <!-- Rod -->
  <line x1="155" y1="37" x2="188" y2="37" stroke="#42a5f5" stroke-width="3"/>
  <!-- Exhaust ports (triangles pointing down) -->
  <polygon points="83,92 79,100 87,100" fill="none" stroke="#64b5f6" stroke-width="1.5"/>
  <polygon points="107,92 103,100 111,100" fill="none" stroke="#64b5f6" stroke-width="1.5"/>
  <!-- Flow particles (blue for air) -->
  <circle cx="55" cy="118" r="2.5" fill="#42a5f5" opacity="0.9"/>
  <circle cx="75" cy="75" r="2.5" fill="#42a5f5" opacity="0.9"/>
  <circle cx="88" cy="52" r="2.5" fill="#42a5f5" opacity="0.9"/>
  <circle cx="145" cy="37" r="2.5" fill="#42a5f5" opacity="0.9"/>
  <circle cx="102" cy="48" r="2.5" fill="#64b5f6" opacity="0.7"/>
  <!-- Speed control (one-way flow restrictor) on right -->
  <rect x="150" y="55" width="16" height="12" rx="2" fill="none" stroke="#80d8ff" stroke-width="1.5"/>
  <line x1="158" y1="57" x2="158" y2="65" stroke="#80d8ff" stroke-width="1"/>
  <!-- Silencer at exhaust -->
  <rect x="75" y="102" width="16" height="8" rx="4" fill="none" stroke="#64b5f6" stroke-width="1" stroke-dasharray="2,1"/>
  <rect x="99" y="102" width="16" height="8" rx="4" fill="none" stroke="#64b5f6" stroke-width="1" stroke-dasharray="2,1"/>
</svg>