<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="92" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- PV diagram axes -->
  <line x1="40" y1="155" x2="40" y2="35" stroke="#4a5578" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="155" x2="170" y2="155" stroke="#4a5578" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Axis arrows -->
  <polygon points="40,35 36,43 44,43" fill="#4a5578"/>
  <polygon points="170,155 162,151 162,159" fill="#4a5578"/>

  <!-- Axis labels -->
  <text x="30" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#4a5578">P</text>
  <text x="168" y="173" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#4a5578">V</text>

  <!-- Grid lines (subtle) -->
  <line x1="40" y1="115" x2="165" y2="115" stroke="#2a3050" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="40" y1="75" x2="165" y2="75" stroke="#2a3050" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="80" y1="40" x2="80" y2="155" stroke="#2a3050" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="120" y1="40" x2="120" y2="155" stroke="#2a3050" stroke-width="0.5" stroke-dasharray="3 4"/>

  <!-- Shaded work area (enclosed by cycle) -->
  <path d="M60,55 Q85,52 110,68 Q130,82 140,110 Q120,118 95,130 Q70,115 60,55 Z"
        fill="rgba(236,64,122,0.35)"/>

  <!-- Cycle curve (closed loop - PV diagram) -->
  <path d="M60,55 Q85,52 110,68" fill="none" stroke="#ec407a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110,68 Q130,82 140,110" fill="none" stroke="#ec407a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140,110 Q120,118 95,130" fill="none" stroke="#ec407a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M95,130 Q70,115 60,55" fill="none" stroke="#ec407a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- State point dots -->
  <circle cx="60" cy="55" r="4" fill="#ec407a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="110" cy="68" r="4" fill="#ec407a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="140" cy="110" r="4" fill="#ec407a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="95" cy="130" r="4" fill="#ec407a" stroke="#fff" stroke-width="1.5"/>

  <!-- State labels -->
  <text x="55" y="48" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="700" fill="#dde3f0">1</text>
  <text x="116" y="62" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="700" fill="#dde3f0">2</text>
  <text x="150" y="112" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="700" fill="#dde3f0">3</text>
  <text x="88" y="140" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="700" fill="#dde3f0">4</text>

  <!-- Direction arrows on cycle -->
  <polygon points="85,57 90,53 88,60" fill="#ec407a"/>
  <polygon points="128,88 133,84 130,92" fill="#ec407a"/>
  <polygon points="115,123 110,127 113,120" fill="#ec407a"/>
  <polygon points="72,95 67,98 70,90" fill="#ec407a"/>

  <!-- Eta symbol -->
  <text x="100" y="103" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5c842">η</text>
</svg>
