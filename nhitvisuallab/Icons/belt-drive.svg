<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background card -->
  <rect width="200" height="200" rx="24" ry="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Belt lines connecting tangent points -->
  <!-- Upper tangent: left pulley top to right pulley top -->
  <line x1="68" y1="55" x2="152" y2="75" stroke="#795548" stroke-width="4" stroke-linecap="round"/>
  <!-- Lower tangent: left pulley bottom to right pulley bottom -->
  <line x1="68" y1="145" x2="152" y2="125" stroke="#795548" stroke-width="4" stroke-linecap="round"/>

  <!-- Left (driver) pulley - larger, r=45 -->
  <circle cx="68" cy="100" r="45" fill="#1f2535" stroke="#795548" stroke-width="3"/>
  <!-- Driver spokes -->
  <line x1="68" y1="62" x2="68" y2="138" stroke="#795548" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="100" x2="106" y2="100" stroke="#795548" stroke-width="2" opacity="0.7"/>
  <!-- Driver hub dot -->
  <circle cx="68" cy="100" r="7" fill="#795548"/>

  <!-- Right (driven) pulley - smaller, r=25 -->
  <circle cx="152" cy="100" r="25" fill="#1f2535" stroke="#795548" stroke-width="3"/>
  <!-- Driven spokes -->
  <line x1="152" y1="78" x2="152" y2="122" stroke="#795548" stroke-width="2" opacity="0.7"/>
  <line x1="130" y1="100" x2="174" y2="100" stroke="#795548" stroke-width="2" opacity="0.7"/>
  <!-- Driven hub dot -->
  <circle cx="152" cy="100" r="5" fill="#795548"/>

  <!-- Motion arrows on belt -->
  <polygon points="114,64  106,60  106,68" fill="#bcaaa4" opacity="0.9"/>
  <polygon points="106,136 114,132 114,140" fill="#bcaaa4" opacity="0.9"/>
</svg>
