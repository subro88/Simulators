<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Original bar (dashed outline) -->
  <rect x="35" y="82" width="90" height="36" rx="4" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Expanded bar with gradient -->
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="50%" stop-color="#ff6e40"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
  </defs>
  <rect x="30" y="82" width="130" height="36" rx="4" fill="url(#tg)" opacity="0.85"/>
  <rect x="30" y="82" width="130" height="36" rx="4" fill="none" stroke="#ff6e40" stroke-width="2"/>
  <!-- Right expansion arrows -->
  <line x1="130" y1="100" x2="155" y2="100" stroke="#ff6e40" stroke-width="2.5"/>
  <polygon points="155,100 148,95 148,105" fill="#ff6e40"/>
  <line x1="130" y1="100" x2="155" y2="100" stroke="none"/>
  <!-- Left expansion arrow (smaller) -->
  <line x1="35" y1="100" x2="20" y2="100" stroke="#ff6e40" stroke-width="2"/>
  <polygon points="20,100 27,95 27,105" fill="#ff6e40"/>
  <!-- Dimension lines -->
  <line x1="35" y1="130" x2="125" y2="130" stroke="#6b7a99" stroke-width="1"/>
  <line x1="35" y1="126" x2="35" y2="134" stroke="#6b7a99" stroke-width="1"/>
  <line x1="125" y1="126" x2="125" y2="134" stroke="#6b7a99" stroke-width="1"/>
  <text x="80" y="143" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7a99" text-anchor="middle">L0</text>
  <!-- Delta L label -->
  <text x="145" y="75" font-family="Segoe UI, sans-serif" font-size="12" fill="#ff6e40" font-weight="bold" text-anchor="middle">&#916;L</text>
  <!-- Thermometer -->
  <rect x="170" y="45" width="8" height="80" rx="4" fill="#2a3050" stroke="#4a5568" stroke-width="1"/>
  <rect x="172" y="75" width="4" height="50" rx="2" fill="#ff3d00" opacity="0.9"/>
  <circle cx="174" cy="135" r="8" fill="#ff3d00" stroke="#4a5568" stroke-width="1"/>
  <!-- Temperature markers -->
  <line x1="180" y1="55" x2="185" y2="55" stroke="#4a5568" stroke-width="1"/>
  <line x1="180" y1="75" x2="185" y2="75" stroke="#4a5568" stroke-width="1"/>
  <line x1="180" y1="95" x2="185" y2="95" stroke="#4a5568" stroke-width="1"/>
  <!-- Title -->
  <text x="100" y="172" font-family="Segoe UI, sans-serif" font-size="13" fill="#dde3f0" text-anchor="middle" font-weight="600">Thermal Expansion</text>
</svg>
