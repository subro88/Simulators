<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <text x="100" y="30" text-anchor="middle" fill="#039be5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">REYNOLDS</text>

  <!-- Top pipe: laminar -->
  <line x1="30" y1="62" x2="170" y2="62" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="30" y1="86" x2="170" y2="86" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="30" y="62" width="140" height="24" fill="#039be5" fill-opacity="0.18"/>
  <!-- Laminar streamlines -->
  <line x1="38" y1="68" x2="166" y2="68" stroke="#4fc3f7" stroke-width="1.2"/>
  <line x1="38" y1="74" x2="166" y2="74" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="38" y1="80" x2="166" y2="80" stroke="#4fc3f7" stroke-width="1.2"/>
  <text x="100" y="56" text-anchor="middle" fill="#3ddc84" font-family="Courier New, monospace" font-size="9" font-weight="700">LAMINAR  Re&lt;2300</text>

  <!-- Bottom pipe: turbulent -->
  <line x1="30" y1="120" x2="170" y2="120" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="30" y1="158" x2="170" y2="158" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="30" y="120" width="140" height="38" fill="#039be5" fill-opacity="0.18"/>
  <!-- Turbulent eddies (scattered dots) -->
  <circle cx="48" cy="130" r="2" fill="#ff5555"/>
  <circle cx="60" cy="148" r="2" fill="#ff5555"/>
  <circle cx="74" cy="135" r="2" fill="#ff5555"/>
  <circle cx="86" cy="150" r="2" fill="#ff5555"/>
  <circle cx="98" cy="132" r="2" fill="#ff5555"/>
  <circle cx="110" cy="146" r="2" fill="#ff5555"/>
  <circle cx="124" cy="138" r="2" fill="#ff5555"/>
  <circle cx="138" cy="152" r="2" fill="#ff5555"/>
  <circle cx="152" cy="134" r="2" fill="#ff5555"/>
  <!-- Eddy spirals -->
  <path d="M 60 140 Q 65 132 72 140 Q 68 148 60 144" fill="none" stroke="#ff5555" stroke-width="1.4"/>
  <path d="M 100 142 Q 108 134 116 142 Q 110 150 100 146" fill="none" stroke="#ff5555" stroke-width="1.4"/>
  <path d="M 130 140 Q 138 132 144 140 Q 138 148 130 144" fill="none" stroke="#ff5555" stroke-width="1.4"/>
  <text x="100" y="180" text-anchor="middle" fill="#ff5555" font-family="Courier New, monospace" font-size="9" font-weight="700">TURBULENT  Re&gt;4000</text>

  <text x="100" y="195" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="8">Re = ρvD/μ</text>
</svg>
