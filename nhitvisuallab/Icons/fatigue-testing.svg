<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Base plate -->
  <rect x="20" y="148" width="160" height="12" rx="3" fill="#37474f"/>
  <!-- Motor housing -->
  <rect x="24" y="90" width="36" height="44" rx="5" fill="#455a64"/>
  <!-- Motor cooling fins -->
  <line x1="28" y1="94" x2="28" y2="130" stroke="#546e7a" stroke-width="1"/>
  <line x1="33" y1="94" x2="33" y2="130" stroke="#546e7a" stroke-width="1"/>
  <line x1="38" y1="94" x2="38" y2="130" stroke="#546e7a" stroke-width="1"/>
  <line x1="43" y1="94" x2="43" y2="130" stroke="#546e7a" stroke-width="1"/>
  <line x1="48" y1="94" x2="48" y2="130" stroke="#546e7a" stroke-width="1"/>
  <line x1="53" y1="94" x2="53" y2="130" stroke="#546e7a" stroke-width="1"/>
  <!-- Motor shaft -->
  <rect x="60" y="108" width="14" height="8" rx="2" fill="#607d8b"/>
  <!-- Left bearing block -->
  <rect x="74" y="100" width="16" height="24" rx="3" fill="#546e7a" stroke="#607d8b" stroke-width="1"/>
  <rect x="78" y="96" width="8" height="4" rx="1" fill="#607d8b"/>
  <!-- Specimen (horizontal bar) -->
  <rect x="80" y="109" width="50" height="6" rx="1" fill="#b0bec5"/>
  <!-- Right bearing block -->
  <rect x="120" y="100" width="16" height="24" rx="3" fill="#546e7a" stroke="#607d8b" stroke-width="1"/>
  <rect x="124" y="96" width="8" height="4" rx="1" fill="#607d8b"/>
  <!-- Load arms -->
  <line x1="82" y1="124" x2="82" y2="144" stroke="#5e35b1" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="124" x2="128" y2="144" stroke="#5e35b1" stroke-width="2" stroke-linecap="round"/>
  <!-- Dead weights -->
  <rect x="74" y="138" width="16" height="10" rx="2" fill="#5e35b1"/>
  <rect x="120" y="138" width="16" height="10" rx="2" fill="#5e35b1"/>
  <!-- Counter display -->
  <rect x="142" y="100" width="34" height="18" rx="3" fill="#0d1117" stroke="#5e35b1" stroke-width="1"/>
  <text x="159" y="113" text-anchor="middle" font-size="7" font-family="monospace" fill="#5e35b1">N</text>
  <!-- Sinusoidal stress wave overlay -->
  <path d="M30 40 Q50 20 70 40 Q90 60 110 40 Q130 20 150 40 Q170 60 185 40" fill="none" stroke="#5e35b1" stroke-width="2" opacity="0.7"/>
  <!-- Zero line (dashed) -->
  <line x1="30" y1="40" x2="185" y2="40" stroke="#5e35b1" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.35"/>
  <!-- Amplitude markers -->
  <line x1="50" y1="20" x2="50" y2="40" stroke="#5e35b1" stroke-width="0.6" opacity="0.4"/>
  <line x1="90" y1="40" x2="90" y2="60" stroke="#5e35b1" stroke-width="0.6" opacity="0.4"/>
  <!-- S-N label -->
  <text x="160" y="75" text-anchor="middle" font-size="9" font-weight="bold" font-family="monospace" fill="#5e35b1" opacity="0.6">S-N</text>
</svg>
