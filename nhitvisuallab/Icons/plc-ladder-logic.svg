<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" fill="none">
  <!-- Background -->
  <rect width="130" height="130" rx="16" fill="#161b27"/>
  <!-- Left power rail -->
  <line x1="20" y1="15" x2="20" y2="115" stroke="#7cb342" stroke-width="3.5"/>
  <!-- Right power rail -->
  <line x1="110" y1="15" x2="110" y2="115" stroke="#7cb342" stroke-width="3.5"/>
  <!-- Rung 1: NO contact + coil -->
  <line x1="20" y1="35" x2="110" y2="35" stroke="#4a5578" stroke-width="1.5"/>
  <!-- NO Contact symbol -->
  <line x1="42" y1="25" x2="42" y2="45" stroke="#8899bb" stroke-width="2"/>
  <line x1="58" y1="25" x2="58" y2="45" stroke="#8899bb" stroke-width="2"/>
  <text x="50" y="22" font-family="monospace" font-size="7" fill="#6b7a99" text-anchor="middle">I0.0</text>
  <!-- Coil -->
  <circle cx="92" cy="35" r="8" fill="none" stroke="#7cb342" stroke-width="2"/>
  <text x="92" y="22" font-family="monospace" font-size="7" fill="#7cb342" text-anchor="middle">Q0.0</text>
  <!-- Rung 2: NC contact + SET coil -->
  <line x1="20" y1="65" x2="110" y2="65" stroke="#4a5578" stroke-width="1.5"/>
  <!-- NC Contact -->
  <line x1="42" y1="55" x2="42" y2="75" stroke="#8899bb" stroke-width="2"/>
  <line x1="58" y1="55" x2="58" y2="75" stroke="#8899bb" stroke-width="2"/>
  <line x1="40" y1="73" x2="60" y2="57" stroke="#ff5555" stroke-width="1.5"/>
  <text x="50" y="52" font-family="monospace" font-size="7" fill="#6b7a99" text-anchor="middle">I0.1</text>
  <!-- SET coil -->
  <circle cx="92" cy="65" r="8" fill="none" stroke="#f5c842" stroke-width="2"/>
  <text x="92" y="67" font-family="monospace" font-size="7" fill="#f5c842" text-anchor="middle">S</text>
  <!-- Rung 3: TON timer block -->
  <line x1="20" y1="95" x2="40" y2="95" stroke="#4a5578" stroke-width="1.5"/>
  <rect x="40" y="83" width="40" height="24" rx="3" fill="#1a2030" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="60" y="93" font-family="monospace" font-size="8" fill="#42a5f5" text-anchor="middle" font-weight="bold">TON</text>
  <text x="60" y="103" font-family="monospace" font-size="6" fill="#6b7a99" text-anchor="middle">T0</text>
  <line x1="80" y1="95" x2="110" y2="95" stroke="#4a5578" stroke-width="1.5"/>
  <!-- PLC label -->
  <text x="65" y="125" font-family="sans-serif" font-size="8" fill="#6b7a99" text-anchor="middle" font-weight="600">PLC LADDER</text>
</svg>
