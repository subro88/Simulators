<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Top plate (fixed end) -->
  <rect x="60" y="30" width="80" height="8" rx="2" fill="#3a4568"/>
  <!-- Hatching on fixed plate -->
  <line x1="68" y1="30" x2="64" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="78" y1="30" x2="74" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="88" y1="30" x2="84" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="98" y1="30" x2="94" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="108" y1="30" x2="104" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="118" y1="30" x2="114" y2="38" stroke="#4a5578" stroke-width="1"/>
  <line x1="128" y1="30" x2="124" y2="38" stroke="#4a5578" stroke-width="1"/>

  <!-- Helical compression spring (zigzag coils) -->
  <polyline
    points="100,38 124,48 76,58 124,68 76,78 124,88 76,98 124,108 76,118 124,128 100,138"
    fill="none" stroke="#00c853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wire cross-section circle (showing wire diameter d) -->
  <circle cx="124" cy="68" r="5" fill="none" stroke="#69f0ae" stroke-width="1.5"/>
  <line x1="119" y1="68" x2="129" y2="68" stroke="#69f0ae" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="135" y="64" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#69f0ae">d</text>

  <!-- Coil diameter D dimension arrows -->
  <line x1="76" y1="150" x2="124" y2="150" stroke="#6b7a99" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="76" y1="146" x2="76" y2="154" stroke="#6b7a99" stroke-width="1.2"/>
  <line x1="124" y1="146" x2="124" y2="154" stroke="#6b7a99" stroke-width="1.2"/>
  <polygon points="76,150 82,148 82,152" fill="#6b7a99"/>
  <polygon points="124,150 118,148 118,152" fill="#6b7a99"/>
  <text x="100" y="148" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#6b7a99">D</text>

  <!-- Bottom load plate -->
  <rect x="70" y="138" width="60" height="6" rx="2" fill="#3a4568"/>

  <!-- Force arrow pointing down -->
  <line x1="100" y1="144" x2="100" y2="166" stroke="#3ddc84" stroke-width="2"/>
  <polygon points="100,170 96,163 104,163" fill="#3ddc84"/>
  <text x="100" y="182" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#3ddc84">F</text>

  <!-- Label -->
  <text x="47" y="98" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#00c853" transform="rotate(-90,47,98)">SPRING</text>
</svg>