<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="92" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Fixed wall/ceiling at top -->
  <rect x="60" y="28" width="40" height="6" rx="1" fill="#4a5578"/>
  <line x1="62" y1="28" x2="58" y2="24" stroke="#4a5578" stroke-width="1.5"/>
  <line x1="70" y1="28" x2="66" y2="24" stroke="#4a5578" stroke-width="1.5"/>
  <line x1="78" y1="28" x2="74" y2="24" stroke="#4a5578" stroke-width="1.5"/>
  <line x1="86" y1="28" x2="82" y2="24" stroke="#4a5578" stroke-width="1.5"/>
  <line x1="94" y1="28" x2="90" y2="24" stroke="#4a5578" stroke-width="1.5"/>
  <line x1="98" y1="28" x2="94" y2="24" stroke="#4a5578" stroke-width="1.5"/>

  <!-- Zigzag spring (left side) -->
  <polyline points="72,34 72,40 64,46 80,52 64,58 80,64 64,70 80,76 64,82 72,88"
            fill="none" stroke="#0288d1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Damper (right side, parallel to spring) -->
  <!-- Damper cylinder -->
  <line x1="88" y1="34" x2="88" y2="50" stroke="#4fc3f7" stroke-width="2"/>
  <rect x="82" y="50" width="12" height="20" rx="1" fill="none" stroke="#4fc3f7" stroke-width="2"/>
  <!-- Damper piston rod -->
  <line x1="88" y1="70" x2="88" y2="88" stroke="#4fc3f7" stroke-width="2"/>
  <!-- Piston inside -->
  <line x1="84" y1="60" x2="92" y2="60" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>

  <!-- Mass block -->
  <rect x="62" y="88" width="36" height="22" rx="3" fill="#0288d1" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="80" y="103" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">m</text>

  <!-- Equilibrium dashed line -->
  <line x1="54" y1="99" x2="106" y2="99" stroke="#6b7a99" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- Displacement arrow -->
  <line x1="104" y1="99" x2="104" y2="118" stroke="#ff5555" stroke-width="1.5"/>
  <polygon points="104,120 101,114 107,114" fill="#ff5555"/>
  <text x="110" y="114" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#ff5555">x</text>

  <!-- Sinusoidal wave hint (right side - waveform) -->
  <path d="M125,50 Q132,30 139,50 Q146,70 153,50 Q160,30 167,50 Q174,70 181,50"
        fill="none" stroke="#0288d1" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Decay envelope (dashed) -->
  <path d="M125,50 Q153,25 181,45" fill="none" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <path d="M125,50 Q153,75 181,55" fill="none" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Axis labels for waveform -->
  <text x="153" y="82" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#6b7a99">t</text>
  <text x="120" y="40" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#6b7a99">x</text>

  <!-- Greek symbols -->
  <text x="48" y="145" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0288d1">ω</text>
  <text x="80" y="145" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#4fc3f7">ζ</text>

  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#0288d1">Spring-Mass-Damper</text>
</svg>
