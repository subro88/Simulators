<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Reference line -->
  <line x1="28" y1="88" x2="172" y2="88" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow -->
  <line x1="52" y1="88" x2="78" y2="158" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="78,158 69,148 79,146" fill="#4fc3f7"/>
  <!-- V-Groove weld symbol (below reference line = arrow side) -->
  <polyline points="88,88 113,140 138,88"
            stroke="#e91e63" stroke-width="3.5" fill="none"
            stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tail fork -->
  <line x1="172" y1="88" x2="184" y2="74" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="88" x2="184" y2="102" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  <!-- Size dimension -->
  <text x="76" y="122" font-size="14" fill="#3ddc84" font-family="sans-serif" font-weight="700">6</text>
  <!-- Fillet hint (small triangle above line on the right) -->
  <path d="M148,88 L148,66 L168,88" stroke="#e91e63" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
</svg>
