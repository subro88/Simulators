<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- planet -->
  <circle cx="70" cy="130" r="46" fill="#233a63"/>
  <circle cx="70" cy="130" r="46" fill="url(#pg)"/>
  <path d="M40 118 q14 -8 28 -2 q12 6 26 0" stroke="#3fa055" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M46 146 q18 6 40 -2" stroke="#3fa055" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- orbit ellipse -->
  <ellipse cx="70" cy="130" rx="70" ry="42" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.6" transform="rotate(-28 70 130)"/>
  <!-- escape trajectory -->
  <path d="M70 130 C 110 70, 150 48, 186 26" fill="none" stroke="#6c7bff" stroke-width="4" stroke-linecap="round"/>
  <!-- rocket -->
  <g transform="translate(150 44) rotate(-38)">
    <path d="M0 -9 L7 6 L-7 6 Z" fill="#eef1ff"/>
    <path d="M-7 6 L0 16 L7 6 Z" fill="#ffab40"/>
  </g>
  <!-- speed arrow -->
  <circle cx="70" cy="130" r="5" fill="#6c7bff"/>
  <defs>
    <radialGradient id="pg" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="65%" stop-color="#233a63"/>
      <stop offset="100%" stop-color="#0d1d38"/>
    </radialGradient>
  </defs>
</svg>
