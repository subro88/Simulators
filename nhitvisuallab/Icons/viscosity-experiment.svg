<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- bench -->
  <rect x="14" y="158" width="172" height="10" rx="3" fill="#3a2d20"/>
  <!-- stand -->
  <rect x="30" y="60" width="6" height="100" rx="2" fill="#4a5570"/>
  <!-- inclined glass plate -->
  <g>
    <polygon points="30,58 172,150 172,160 30,68" fill="#2d3c5a" stroke="#7fa8d0" stroke-width="2" opacity="0.9"/>
    <polygon points="30,58 172,150 168,152 30,62" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- fluid streaks: water (fast, long), oil (mid), honey (slow, short) -->
  <g stroke-linecap="round">
    <line x1="46" y1="72" x2="150" y2="139" stroke="#4fc3f7" stroke-width="9"/>
    <circle cx="150" cy="139" r="7" fill="#4fc3f7"/>
    <line x1="52" y1="66" x2="112" y2="105" stroke="#c8b458" stroke-width="10"/>
    <circle cx="112" cy="105" r="8" fill="#c8b458"/>
    <line x1="58" y1="60" x2="84" y2="77" stroke="#ffb300" stroke-width="12"/>
    <circle cx="84" cy="77" r="9" fill="#ffb300"/>
    <ellipse cx="80" cy="72" rx="4" ry="2.4" fill="#ffe082" opacity="0.85" transform="rotate(33 80 72)"/>
  </g>
  <!-- angle arc -->
  <path d="M 60 160 A 30 30 0 0 0 54 143" fill="none" stroke="#ffb300" stroke-width="3"/>
  <!-- stopwatch -->
  <g transform="translate(152,44)">
    <circle r="18" fill="#161b27" stroke="#ffb300" stroke-width="3"/>
    <rect x="-3" y="-25" width="6" height="6" rx="1.5" fill="#ffb300"/>
    <line x1="0" y1="0" x2="0" y2="-11" stroke="#dde3f0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#ff5555" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
