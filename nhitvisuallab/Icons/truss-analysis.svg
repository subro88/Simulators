<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Truss structure — Warren-type truss -->
  <!-- Bottom chord -->
  <line x1="30" y1="130" x2="170" y2="130" stroke="#e65100" stroke-width="3" stroke-linecap="round"/>
  <!-- Top chord -->
  <line x1="65" y1="65" x2="135" y2="65" stroke="#e65100" stroke-width="3" stroke-linecap="round"/>

  <!-- Diagonal members (tension — green) -->
  <line x1="30" y1="130" x2="65" y2="65" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="65" x2="170" y2="130" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner diagonal (compression — red) -->
  <line x1="100" y1="130" x2="65" y2="65" stroke="#ff5555" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="130" x2="135" y2="65" stroke="#ff5555" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertical member -->
  <line x1="100" y1="65" x2="100" y2="130" stroke="#6b7a99" stroke-width="2" stroke-linecap="round"/>

  <!-- Joints (circles) -->
  <circle cx="30" cy="130" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="100" cy="130" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="170" cy="130" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="65" cy="65" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="100" cy="65" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>
  <circle cx="135" cy="65" r="5" fill="#e65100" stroke="#0d1117" stroke-width="1.5"/>

  <!-- Left support (pin) -->
  <polygon points="30,130 20,150 40,150" fill="none" stroke="#ab47bc" stroke-width="2" stroke-linejoin="round"/>
  <line x1="16" y1="150" x2="44" y2="150" stroke="#ab47bc" stroke-width="1.5"/>

  <!-- Right support (roller) -->
  <polygon points="170,130 160,150 180,150" fill="none" stroke="#ab47bc" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="170" cy="153" r="3" fill="none" stroke="#ab47bc" stroke-width="1.5"/>
  <line x1="156" y1="157" x2="184" y2="157" stroke="#ab47bc" stroke-width="1.5"/>

  <!-- Applied load arrow (downward) -->
  <line x1="100" y1="30" x2="100" y2="60" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="100,62 96,54 104,54" fill="#ff5555"/>
  <text x="100" y="25" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#ff5555">P</text>

  <!-- Legend indicators -->
  <line x1="30" y1="172" x2="46" y2="172" stroke="#3ddc84" stroke-width="2"/>
  <text x="50" y="175" font-family="Courier New,monospace" font-size="7" fill="#3ddc84">T</text>
  <line x1="70" y1="172" x2="86" y2="172" stroke="#ff5555" stroke-width="2"/>
  <text x="90" y="175" font-family="Courier New,monospace" font-size="7" fill="#ff5555">C</text>
  <line x1="110" y1="172" x2="126" y2="172" stroke="#6b7a99" stroke-width="2"/>
  <text x="130" y="175" font-family="Courier New,monospace" font-size="7" fill="#6b7a99">0</text>

  <!-- Label -->
  <text x="100" y="194" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#e65100">TRUSS</text>
</svg>
