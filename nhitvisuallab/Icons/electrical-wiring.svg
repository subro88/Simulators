  <rect x="30" y="46" width="52" height="72" rx="8" fill="#e9edf3" stroke="#9aa0ab" stroke-width="2"/>
  <rect x="44" y="60" width="24" height="44" rx="5" fill="#c3c9d4"/>
  <rect x="46" y="62" width="20" height="20" rx="3" fill="#eef1f6"/>
