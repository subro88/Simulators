<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- outer shell -->
  <ellipse cx="100" cy="100" rx="74" ry="32" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7" transform="rotate(-25 100 100)"/>
  <ellipse cx="100" cy="100" rx="74" ry="32" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7" transform="rotate(25 100 100)"/>
  <ellipse cx="100" cy="100" rx="74" ry="32" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7" transform="rotate(90 100 100)"/>
  <!-- inner shell -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="2 2" opacity=".55"/>
  <!-- nucleus protons (orange) + neutrons (grey) -->
  <circle cx="92"  cy="96"  r="8" fill="#ff8c42"/>
  <circle cx="108" cy="94"  r="8" fill="#9aa3b8"/>
  <circle cx="96"  cy="108" r="8" fill="#9aa3b8"/>
  <circle cx="110" cy="110" r="8" fill="#ff8c42"/>
  <circle cx="100" cy="100" r="8" fill="#ff8c42"/>
  <!-- electrons -->
  <circle cx="26"  cy="100" r="5" fill="#22d3ee" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="174" cy="100" r="5" fill="#22d3ee" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="100" cy="42"  r="4" fill="#22d3ee" stroke="#a855f7" stroke-width="1"/>
  <circle cx="142" cy="58"  r="4" fill="#22d3ee" stroke="#a855f7" stroke-width="1"/>
</svg>
