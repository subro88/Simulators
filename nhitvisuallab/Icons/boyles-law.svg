<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cylinder body -->
  <rect x="50" y="40" width="100" height="130" rx="6" fill="#1a2332" stroke="#00acc1" stroke-width="3"/>
  <!-- Piston -->
  <rect x="55" y="70" width="90" height="14" rx="3" fill="#4dd0e1" opacity="0.9"/>
  <rect x="90" y="50" width="20" height="22" rx="2" fill="#4dd0e1" opacity="0.7"/>
  <!-- Gas particles -->
  <circle cx="75" cy="110" r="5" fill="#00acc1" opacity="0.8"/>
  <circle cx="105" cy="100" r="4" fill="#00bcd4" opacity="0.7"/>
  <circle cx="90" cy="130" r="5" fill="#00acc1" opacity="0.8"/>
  <circle cx="120" cy="120" r="4" fill="#4dd0e1" opacity="0.7"/>
  <circle cx="70" cy="145" r="4" fill="#00bcd4" opacity="0.6"/>
  <circle cx="130" cy="140" r="5" fill="#00acc1" opacity="0.7"/>
  <circle cx="95" cy="155" r="4" fill="#4dd0e1" opacity="0.6"/>
  <!-- Pressure arrows -->
  <line x1="100" y1="46" x2="100" y2="62" stroke="#ff7043" stroke-width="2" marker-end="url(#arrowDown)"/>
  <!-- PV label -->
  <text x="100" y="190" text-anchor="middle" fill="#4dd0e1" font-family="sans-serif" font-weight="bold" font-size="16">PV = const</text>
  <defs>
    <marker id="arrowDown" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6Z" fill="#ff7043"/>
    </marker>
  </defs>
</svg>