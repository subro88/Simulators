<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Top rail wire -->
  <line x1="30" y1="55" x2="170" y2="55" stroke="#29b6f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom rail wire -->
  <line x1="30" y1="145" x2="170" y2="145" stroke="#29b6f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Battery (left side) -->
  <line x1="30" y1="55" x2="30" y2="85" stroke="#29b6f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="115" x2="30" y2="145" stroke="#29b6f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Battery long plate -->
  <line x1="22" y1="85" x2="38" y2="85" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <!-- Battery short plate -->
  <line x1="25" y1="93" x2="35" y2="93" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Battery long plate 2 -->
  <line x1="22" y1="101" x2="38" y2="101" stroke="#ff5555" stroke-width="4" stroke-linecap="round"/>
  <!-- Battery short plate 2 -->
  <line x1="25" y1="109" x2="35" y2="109" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- + label -->
  <text x="14" y="90" fill="#ff5555" font-size="10" font-weight="bold" font-family="sans-serif">+</text>
  <!-- - label -->
  <text x="14" y="114" fill="#42a5f5" font-size="12" font-weight="bold" font-family="sans-serif">-</text>

  <!-- Capacitor 1 (parallel branch) -->
  <line x1="70" y1="55" x2="70" y2="85" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="85" x2="82" y2="85" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="58" y1="95" x2="82" y2="95" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="95" x2="70" y2="145" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="78" fill="#29b6f6" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">C1</text>

  <!-- Capacitor 2 (parallel branch) -->
  <line x1="110" y1="55" x2="110" y2="85" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="85" x2="122" y2="85" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="98" y1="95" x2="122" y2="95" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="110" y1="95" x2="110" y2="145" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <text x="110" y="78" fill="#29b6f6" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">C2</text>

  <!-- Capacitor 3 (parallel branch) -->
  <line x1="150" y1="55" x2="150" y2="85" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="85" x2="162" y2="85" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="138" y1="95" x2="162" y2="95" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="95" x2="150" y2="145" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="78" fill="#29b6f6" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">C3</text>

  <!-- Charge symbols -->
  <text x="64" y="92" fill="#ff5555" font-size="8" font-weight="bold" font-family="sans-serif">+</text>
  <text x="64" y="103" fill="#42a5f5" font-size="8" font-weight="bold" font-family="sans-serif">-</text>
  <text x="104" y="92" fill="#ff5555" font-size="8" font-weight="bold" font-family="sans-serif">+</text>
  <text x="104" y="103" fill="#42a5f5" font-size="8" font-weight="bold" font-family="sans-serif">-</text>
  <text x="144" y="92" fill="#ff5555" font-size="8" font-weight="bold" font-family="sans-serif">+</text>
  <text x="144" y="103" fill="#42a5f5" font-size="8" font-weight="bold" font-family="sans-serif">-</text>

  <!-- Animated dots (static representation) -->
  <circle cx="50" cy="55" r="3" fill="#3ddc84" opacity="0.8"/>
  <circle cx="90" cy="55" r="3" fill="#3ddc84" opacity="0.6"/>
  <circle cx="130" cy="55" r="3" fill="#3ddc84" opacity="0.4"/>

  <!-- Formula label -->
  <text x="100" y="172" fill="#29b6f6" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Ceq = C1+C2+C3</text>
  <text x="100" y="188" fill="#f5c842" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">E = &#189;CV&#xB2;</text>
</svg>
