<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- mount -->
  <rect x="64" y="40" width="72" height="10" rx="2" fill="#2a3050"/>
  <!-- vertical reference -->
  <line x1="100" y1="50" x2="100" y2="150" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- angle arc -->
  <path d="M100,104 A54,54 0 0,0 146,128" fill="none" stroke="#ff7597" stroke-width="3"/>
  <!-- rope -->
  <line x1="100" y1="50" x2="146" y2="138" stroke="#9aa6bf" stroke-width="3"/>
  <!-- pivot -->
  <circle cx="100" cy="50" r="4" fill="#dde3f0"/>
  <!-- bob -->
  <defs>
    <radialGradient id="bob" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffb3c6"/>
      <stop offset="1" stop-color="#ff5d86"/>
    </radialGradient>
  </defs>
  <circle cx="146" cy="138" r="16" fill="url(#bob)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
  <text x="100" y="186" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" font-weight="700" fill="#ff7597">T=2&#960;&#8730;(L/g)</text>
</svg>
