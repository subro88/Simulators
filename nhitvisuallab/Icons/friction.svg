<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1f2535" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Surface with roughness marks -->
  <line x1="25" y1="130" x2="175" y2="130" stroke="#8d6e63" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Roughness texture marks -->
  <line x1="35" y1="130" x2="30" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="130" x2="45" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="65" y1="130" x2="60" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="75" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="95" y1="130" x2="90" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="110" y1="130" x2="105" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="125" y1="130" x2="120" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="140" y1="130" x2="135" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="155" y1="130" x2="150" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>
  <line x1="170" y1="130" x2="165" y2="137" stroke="#bcaaa4" stroke-width="1" stroke-linecap="round"/>

  <!-- Block on surface -->
  <rect x="70" y="90" width="50" height="40" rx="4" fill="rgba(141,110,99,0.35)" stroke="#8d6e63" stroke-width="2"/>
  <!-- Mass label -->
  <text x="95" y="114" text-anchor="middle" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#8d6e63">m</text>

  <!-- Applied force arrow (pushing right) -->
  <line x1="30" y1="110" x2="65" y2="110" stroke="#3ddc84" stroke-width="2.5"/>
  <polygon points="68,110 60,105 60,115" fill="#3ddc84"/>
  <text x="38" y="100" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#3ddc84">F</text>

  <!-- Friction arrow (opposing, pointing left) -->
  <line x1="160" y1="110" x2="125" y2="110" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="122,110 130,105 130,115" fill="#ff5555"/>
  <text x="152" y="100" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#ff5555">f</text>

  <!-- Weight arrow (down) -->
  <line x1="95" y1="130" x2="95" y2="153" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="95,156 91,149 99,149" fill="#42a5f5"/>
  <text x="95" y="166" text-anchor="middle" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#42a5f5">W</text>

  <!-- Normal force arrow (up) -->
  <line x1="95" y1="90" x2="95" y2="67" stroke="#42a5f5" stroke-width="1.5"/>
  <polygon points="95,64 91,71 99,71" fill="#42a5f5"/>
  <text x="95" y="58" text-anchor="middle" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#42a5f5">N</text>

  <!-- Formula label -->
  <text x="100" y="186" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#bcaaa4">f = μN</text>
</svg>
