<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Pump circle -->
  <circle cx="60" cy="145" r="18" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <!-- Pump triangle -->
  <polygon points="60,131 51,153 69,153" fill="#00bcd4" opacity="0.8"/>
  <!-- Reservoir -->
  <rect x="42" y="165" width="36" height="14" rx="2" fill="none" stroke="#00bcd4" stroke-width="2"/>
  <!-- Pressure line from pump up -->
  <line x1="60" y1="127" x2="60" y2="80" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Horizontal to DCV -->
  <line x1="60" y1="80" x2="100" y2="80" stroke="#ff4444" stroke-width="2.5"/>
  <!-- DCV 4/3 box -->
  <rect x="88" y="65" width="24" height="30" rx="2" fill="none" stroke="#00bcd4" stroke-width="2"/>
  <rect x="112" y="65" width="24" height="30" rx="2" fill="none" stroke="#4dd0e1" stroke-width="1.5" opacity="0.5"/>
  <rect x="64" y="65" width="24" height="30" rx="2" fill="none" stroke="#4dd0e1" stroke-width="1.5" opacity="0.5"/>
  <!-- DCV labels -->
  <text x="100" y="84" font-size="10" fill="#00bcd4" text-anchor="middle" font-family="sans-serif">A B</text>
  <!-- Line from DCV to cylinder -->
  <line x1="94" y1="65" x2="94" y2="40" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="94" y1="40" x2="140" y2="40" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Cylinder body -->
  <rect x="130" y="28" width="50" height="24" rx="2" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <!-- Piston -->
  <line x1="155" y1="30" x2="155" y2="50" stroke="#4dd0e1" stroke-width="2.5"/>
  <!-- Rod -->
  <line x1="155" y1="40" x2="188" y2="40" stroke="#00bcd4" stroke-width="3"/>
  <!-- Return line -->
  <line x1="120" y1="65" x2="120" y2="40" stroke="#4488ff" stroke-width="2"/>
  <line x1="120" y1="40" x2="130" y2="40" stroke="#4488ff" stroke-width="2"/>
  <!-- Return to tank -->
  <line x1="120" y1="95" x2="120" y2="145" stroke="#4488ff" stroke-width="2"/>
  <line x1="120" y1="145" x2="78" y2="145" stroke="#4488ff" stroke-width="2"/>
  <!-- Relief valve -->
  <rect x="30" y="95" width="16" height="22" rx="2" fill="none" stroke="#ff6666" stroke-width="1.5"/>
  <line x1="38" y1="117" x2="38" y2="145" stroke="#4488ff" stroke-width="1.5"/>
  <line x1="38" y1="80" x2="38" y2="95" stroke="#ff4444" stroke-width="1.5"/>
  <line x1="38" y1="80" x2="60" y2="80" stroke="#ff4444" stroke-width="1.5"/>
  <!-- Flow particles -->
  <circle cx="60" cy="100" r="2.5" fill="#ff6666" opacity="0.9"/>
  <circle cx="80" cy="80" r="2.5" fill="#ff6666" opacity="0.9"/>
  <circle cx="94" cy="52" r="2.5" fill="#ff6666" opacity="0.9"/>
  <circle cx="120" cy="120" r="2.5" fill="#6699ff" opacity="0.9"/>
  <circle cx="148" cy="40" r="2.5" fill="#ff6666" opacity="0.9"/>
</svg>
