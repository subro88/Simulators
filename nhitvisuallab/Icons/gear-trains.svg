<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Large gear (driver) -->
  <g transform="translate(78,95)">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#c62828" stroke-width="2.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="10" fill="#c62828" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#1f2535"/>
    <!-- Teeth -->
    <g fill="#c62828" opacity="0.85">
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(0)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(30)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(60)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(90)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(120)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(150)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(180)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(210)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(240)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(270)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(300)"/>
      <rect x="-5" y="-46" width="10" height="10" rx="1.5" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Small gear (driven) -->
  <g transform="translate(138,72)">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ef5350" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="7" fill="#ef5350" opacity="0.6"/>
    <circle cx="0" cy="0" r="3.5" fill="#1f2535"/>
    <!-- Teeth -->
    <g fill="#ef5350" opacity="0.85">
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(0)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(45)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(90)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(135)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(180)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(225)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(270)"/>
      <rect x="-4" y="-31" width="8" height="9" rx="1.5" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Rotation arrow -->
  <path d="M 42 115 A 42 42 0 0 1 48 72" fill="none" stroke="#f5c842" stroke-width="2" stroke-linecap="round"/>
  <polygon points="48,68 44,76 52,76" fill="#f5c842"/>

  <!-- GR label -->
  <text x="100" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#ef9a9a" letter-spacing="2">GR</text>
</svg>