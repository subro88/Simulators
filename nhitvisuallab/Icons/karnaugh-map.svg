<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Variable labels -->
  <text x="32" y="28" text-anchor="middle" fill="rgba(221,227,240,0.55)" font-size="9" font-weight="600" font-family="sans-serif">A</text>
  <text x="18" y="50" text-anchor="middle" fill="rgba(221,227,240,0.55)" font-size="9" font-weight="600" font-family="sans-serif">B</text>
  <!-- Header row: 0 and 1 for A -->
  <text x="52" y="28" text-anchor="middle" fill="rgba(221,227,240,0.45)" font-size="8" font-family="sans-serif">0</text>
  <text x="80" y="28" text-anchor="middle" fill="rgba(221,227,240,0.45)" font-size="8" font-family="sans-serif">1</text>
  <!-- Header col: 0 and 1 for B -->
  <text x="26" y="52" text-anchor="middle" fill="rgba(221,227,240,0.45)" font-size="8" font-family="sans-serif">0</text>
  <text x="26" y="78" text-anchor="middle" fill="rgba(221,227,240,0.45)" font-size="8" font-family="sans-serif">1</text>
  <!-- 2x2 Grid -->
  <rect x="36" y="33" width="56" height="52" rx="3" fill="none" stroke="#64b5f6" stroke-width="1.5"/>
  <!-- Vertical divider -->
  <line x1="64" y1="33" x2="64" y2="85" stroke="#64b5f6" stroke-width="1" opacity="0.6"/>
  <!-- Horizontal divider -->
  <line x1="36" y1="59" x2="92" y2="59" stroke="#64b5f6" stroke-width="1" opacity="0.6"/>
  <!-- Group overlay: covers top-right and bottom-right cells (A=1 column) -->
  <rect x="66" y="35" width="24" height="48" rx="6" fill="#ce93d8" opacity="0.2" stroke="#ce93d8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Cell values -->
  <!-- Cell (0,0) = 0 -->
  <text x="50" y="51" text-anchor="middle" fill="rgba(221,227,240,0.7)" font-size="13" font-weight="600" font-family="sans-serif">0</text>
  <!-- Cell (0,1) = 1 (grouped) -->
  <text x="78" y="51" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="600" font-family="sans-serif">1</text>
  <!-- Cell (1,0) = 1 -->
  <text x="50" y="77" text-anchor="middle" fill="rgba(221,227,240,0.7)" font-size="13" font-weight="600" font-family="sans-serif">1</text>
  <!-- Cell (1,1) = 1 (grouped) -->
  <text x="78" y="77" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="600" font-family="sans-serif">1</text>
  <!-- Label -->
  <text x="60" y="105" text-anchor="middle" fill="rgba(221,227,240,0.7)" font-size="10" font-weight="600" font-family="sans-serif">K-MAP</text>
</svg>
