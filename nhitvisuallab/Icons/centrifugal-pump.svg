<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- delivery pipe (up & over) -->
  <path d="M118 78 L118 44 L150 44" fill="none" stroke="#3a4663" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 78 L118 44 L150 44" fill="none" stroke="#0277bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- suction pipe (from sump) -->
  <path d="M44 150 L44 116 L66 116" fill="none" stroke="#3a4663" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 150 L44 116 L66 116" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- volute casing -->
  <circle cx="92" cy="116" r="34" fill="#0d1117" stroke="#5a6478" stroke-width="3"/>
  <!-- impeller vanes (curved) -->
  <g stroke="#4fc3f7" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M92 116 Q108 110 116 122"/>
    <path d="M92 116 Q98 100 110 104" transform="rotate(120 92 116)"/>
    <path d="M92 116 Q98 100 110 104" transform="rotate(240 92 116)"/>
  </g>
  <circle cx="92" cy="116" r="6" fill="#0277bd"/>
  <!-- motor on top -->
  <rect x="74" y="58" width="36" height="22" rx="4" fill="#263238" stroke="#5a6478" stroke-width="2"/>
  <line x1="92" y1="80" x2="92" y2="86" stroke="#5a6478" stroke-width="5"/>
  <!-- pressure gauge -->
  <circle cx="138" cy="100" r="13" fill="#0d1117" stroke="#0277bd" stroke-width="2.5"/>
  <line x1="138" y1="100" x2="146" y2="93" stroke="#ff5555" stroke-width="2"/>
  <!-- sump water -->
  <rect x="22" y="150" width="44" height="22" rx="3" fill="#0d47a1" opacity="0.8"/>
</svg>
