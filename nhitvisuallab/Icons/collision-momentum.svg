<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- air-track rail -->
  <rect x="22" y="132" width="156" height="9" rx="2" fill="#4e5768"/>
  <rect x="22" y="132" width="156" height="3" rx="1.5" fill="#8d97ad"/>
  <rect x="22" y="141" width="156" height="7" rx="2" fill="#2b3140"/>

  <!-- impact burst at the point of contact -->
  <g stroke="#ffd76b" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="100" y1="72" x2="100" y2="56"/>
    <line x1="86" y1="78" x2="76" y2="66"/>
    <line x1="114" y1="78" x2="124" y2="66"/>
  </g>

  <!-- body 1 (accent) -->
  <circle cx="72" cy="106" r="24" fill="#c2185b"/>
  <circle cx="72" cy="106" r="24" fill="none" stroke="#ff4081" stroke-width="3"/>
  <circle cx="64" cy="98" r="8" fill="#ff94b8" opacity="0.75"/>

  <!-- body 2 (gold) -->
  <circle cx="132" cy="106" r="18" fill="#c9a01f"/>
  <circle cx="132" cy="106" r="18" fill="none" stroke="#f5c842" stroke-width="3"/>
  <circle cx="126" cy="100" r="6" fill="#ffe28a" opacity="0.75"/>

  <!-- momentum arrows: p in on the left, p out on the right -->
  <g stroke-linecap="round">
    <line x1="20" y1="106" x2="42" y2="106" stroke="#ff4081" stroke-width="6"/>
    <path d="M42 98 L54 106 L42 114 Z" fill="#ff4081"/>
    <line x1="156" y1="106" x2="172" y2="106" stroke="#f5c842" stroke-width="6"/>
    <path d="M172 98 L184 106 L172 114 Z" fill="#f5c842"/>
  </g>

  <!-- centre-of-mass marker -->
  <circle cx="100" cy="168" r="9" fill="#dde3f0"/>
  <path d="M100 168 L100 159 A9 9 0 0 1 109 168 Z" fill="#1f2535"/>
  <path d="M100 168 L100 177 A9 9 0 0 1 91 168 Z" fill="#1f2535"/>
  <circle cx="100" cy="168" r="9" fill="none" stroke="#dde3f0" stroke-width="1.5"/>
</svg>
