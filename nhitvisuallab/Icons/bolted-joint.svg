<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Top flange -->
  <rect x="30" y="62" width="140" height="24" rx="3" fill="#455a64" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Bottom flange -->
  <rect x="30" y="86" width="140" height="24" rx="3" fill="#37474f" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Bolt hole through flanges -->
  <rect x="92" y="52" width="16" height="70" rx="2" fill="#263238" stroke="#37474f" stroke-width="1"/>
  <!-- Bolt shank -->
  <rect x="94" y="54" width="12" height="66" rx="1" fill="#78909c" stroke="#90a4ae" stroke-width="1"/>
  <!-- Bolt head (hex top) -->
  <polygon points="100,42 110,46 110,56 100,60 90,56 90,46" fill="#37474f" stroke="#78909c" stroke-width="1.5"/>
  <polygon points="100,42 110,46 110,50 100,46 90,50 90,46" fill="#546e7a" stroke="none" opacity="0.6"/>
  <!-- Nut (hex bottom) -->
  <polygon points="100,120 111,124 111,134 100,138 89,134 89,124" fill="#37474f" stroke="#78909c" stroke-width="1.5"/>
  <polygon points="100,120 111,124 111,128 100,124 89,128 89,124" fill="#546e7a" stroke="none" opacity="0.6"/>
  <!-- Top washer -->
  <ellipse cx="100" cy="60" rx="14" ry="3" fill="#546e7a" stroke="#78909c" stroke-width="0.8"/>
  <!-- Bottom washer -->
  <ellipse cx="100" cy="120" rx="14" ry="3" fill="#546e7a" stroke="#78909c" stroke-width="0.8"/>
  <!-- Thread lines on shank -->
  <line x1="94" y1="100" x2="106" y2="100" stroke="#546e7a" stroke-width="0.6"/>
  <line x1="94" y1="104" x2="106" y2="104" stroke="#546e7a" stroke-width="0.6"/>
  <line x1="94" y1="108" x2="106" y2="108" stroke="#546e7a" stroke-width="0.6"/>
  <line x1="94" y1="112" x2="106" y2="112" stroke="#546e7a" stroke-width="0.6"/>
  <!-- Preload arrow (downward on bolt) -->
  <line x1="100" y1="148" x2="100" y2="164" stroke="#78909c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="100,168 94,158 106,158" fill="#78909c"/>
  <!-- Preload arrow (upward on bolt) -->
  <line x1="100" y1="36" x2="100" y2="20" stroke="#78909c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="100,16 94,26 106,26" fill="#78909c"/>
  <!-- Clamp force arrows (inward on flanges) -->
  <line x1="22" y1="74" x2="10" y2="74" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="26,74 18,70 18,78" fill="#3ddc84"/>
  <line x1="178" y1="74" x2="190" y2="74" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="174,74 182,70 182,78" fill="#3ddc84"/>
  <line x1="22" y1="98" x2="10" y2="98" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="26,98 18,94 18,102" fill="#3ddc84"/>
  <line x1="178" y1="98" x2="190" y2="98" stroke="#3ddc84" stroke-width="1.5"/>
  <polygon points="174,98 182,94 182,102" fill="#3ddc84"/>
  <!-- Label -->
  <text x="100" y="188" text-anchor="middle" fill="#78909c" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">BOLTED JOINT</text>
</svg>