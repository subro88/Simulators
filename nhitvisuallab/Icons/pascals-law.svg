<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#1f2535"/>
  <!-- U-tube body -->
  <path d="M40 50 L40 140 Q40 160 60 160 L140 160 Q160 160 160 140 L160 80" fill="none" stroke="#2a3050" stroke-width="8" stroke-linecap="round"/>
  <!-- Fluid fill -->
  <path d="M44 90 L44 140 Q44 156 60 156 L140 156 Q156 156 156 140 L156 110" fill="rgba(66,165,245,.38)" stroke="none"/>
  <!-- Left tube wall -->
  <rect x="28" y="40" width="24" height="55" rx="4" fill="#2a3050" stroke="#42a5f5" stroke-width="1.5"/>
  <!-- Right tube wall -->
  <rect x="136" y="40" width="48" height="45" rx="4" fill="#2a3050" stroke="#42a5f5" stroke-width="1.5"/>
  <!-- Left piston -->
  <rect x="30" y="48" width="20" height="10" rx="2" fill="#42a5f5" stroke="#90caf9" stroke-width="1"/>
  <!-- Right piston -->
  <rect x="140" y="60" width="40" height="10" rx="2" fill="#42a5f5" stroke="#90caf9" stroke-width="1"/>
  <!-- F1 arrow (small, down) -->
  <line x1="40" y1="22" x2="40" y2="44" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="40,48 35,40 45,40" fill="#3ddc84"/>
  <!-- F2 arrow (large, up) -->
  <line x1="160" y1="55" x2="160" y2="33" stroke="#ff5555" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="160,29 155,37 165,37" fill="#ff5555"/>
  <!-- Labels -->
  <text x="22" y="22" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#3ddc84">F₁</text>
  <text x="168" y="30" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#ff5555">F₂</text>
  <!-- P = F/A label -->
  <text x="100" y="130" font-family="Courier New,monospace" font-size="14" font-weight="700" fill="#42a5f5" text-anchor="middle">P = F/A</text>
  <!-- Fluid dots for visual effect -->
  <circle cx="70" cy="145" r="2" fill="rgba(66,165,245,.5)"/>
  <circle cx="90" cy="150" r="2" fill="rgba(66,165,245,.5)"/>
  <circle cx="110" cy="142" r="2" fill="rgba(66,165,245,.5)"/>
  <circle cx="130" cy="148" r="2" fill="rgba(66,165,245,.5)"/>
  <!-- Area indicators -->
  <text x="40" y="108" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#90caf9" text-anchor="middle">A₁</text>
  <text x="160" y="100" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#90caf9" text-anchor="middle">A₂</text>
</svg>
