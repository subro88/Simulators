<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- I-beam cross-section -->
  <path d="M60 45 h80 v18 H120 v74 h20 v18 H60 v-18 h20 V63 H60 Z"
        fill="rgba(255,109,0,.2)" stroke="#ff6d00" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Horizontal neutral axis (dashed) -->
  <line x1="35" y1="100" x2="165" y2="100" stroke="#ff6d00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- Vertical neutral axis (dashed) -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- Centroid crosshair -->
  <circle cx="100" cy="100" r="3" fill="#3ddc84" stroke="none"/>
  <!-- Axis labels -->
  <text x="168" y="97" fill="#ff6d00" font-size="13" font-weight="bold" font-family="sans-serif">x</text>
  <text x="103" y="28" fill="#4f8ef7" font-size="13" font-weight="bold" font-family="sans-serif">y</text>
</svg>
