<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- T-s axes -->
  <line x1="40" y1="150" x2="170" y2="150" stroke="#6b7a99" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="150" x2="40" y2="40" stroke="#6b7a99" stroke-width="3" stroke-linecap="round"/>
  <!-- saturation dome -->
  <path d="M58 150 C 60 96, 90 70, 104 68 C 118 70, 150 96, 152 150" fill="rgba(58,68,112,0.30)" stroke="#3a4470" stroke-width="2.5"/>
  <!-- Rankine cycle path -->
  <path d="M58 148 L58 142 L104 68 L132 130 L132 150 Z" fill="rgba(244,81,30,0.16)" stroke="#f4511e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- superheat tail -->
  <path d="M104 68 L132 130" stroke="#ff8a65" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- state dots -->
  <circle cx="58" cy="148" r="5.5" fill="#fff" stroke="#f4511e" stroke-width="2.5"/>
  <circle cx="58" cy="142" r="5.5" fill="#fff" stroke="#f4511e" stroke-width="2.5"/>
  <circle cx="104" cy="68" r="5.5" fill="#fff" stroke="#f4511e" stroke-width="2.5"/>
  <circle cx="132" cy="130" r="5.5" fill="#fff" stroke="#f4511e" stroke-width="2.5"/>
  <!-- axis labels -->
  <text x="166" y="168" fill="#6b7a99" font-family="monospace" font-size="14" font-weight="bold">s</text>
  <text x="24" y="48" fill="#6b7a99" font-family="monospace" font-size="14" font-weight="bold">T</text>
</svg>
