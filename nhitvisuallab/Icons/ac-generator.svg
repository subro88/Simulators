<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Magnets -->
  <rect x="30" y="55" width="22" height="70" rx="3" fill="#42a5f5" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="41" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="sans-serif">N</text>
  <rect x="108" y="55" width="22" height="70" rx="3" fill="#42a5f5" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="119" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="sans-serif">S</text>
  <!-- Rotating coil -->
  <rect x="62" y="62" width="36" height="56" rx="4" fill="none" stroke="#7b1fa2" stroke-width="3" transform="rotate(25 80 90)"/>
  <!-- Rotation arrow -->
  <path d="M80 45 A20 20 0 0 1 96 58" fill="none" stroke="#ce93d8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="96,54 96,62 100,58" fill="#ce93d8"/>
  <!-- Slip rings -->
  <ellipse cx="75" cy="135" rx="6" ry="3" fill="#7b1fa2" stroke="#6a1b9a" stroke-width="1"/>
  <ellipse cx="87" cy="135" rx="6" ry="3" fill="#7b1fa2" stroke="#6a1b9a" stroke-width="1"/>
  <line x1="75" y1="138" x2="75" y2="148" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="87" y1="138" x2="87" y2="148" stroke="#7b1fa2" stroke-width="2"/>
  <!-- Sine waveform -->
  <path d="M140 70 Q150 50 155 70 Q160 90 165 70 Q170 50 175 70 Q180 90 185 70" fill="none" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Axis lines -->
  <line x1="138" y1="70" x2="188" y2="70" stroke="#6b7a99" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Label -->
  <text x="100" y="172" text-anchor="middle" fill="#dde3f0" font-size="11" font-weight="600" font-family="sans-serif">AC Generator</text>
</svg>