<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- NPN transistor symbol -->
  <!-- Base line -->
  <line x1="40" y1="100" x2="80" y2="100" stroke="#ff6e40" stroke-width="3"/>
  <!-- Vertical bar -->
  <line x1="80" y1="60" x2="80" y2="140" stroke="#ff6e40" stroke-width="4"/>
  <!-- Collector -->
  <line x1="80" y1="75" x2="130" y2="45" stroke="#ff6e40" stroke-width="2.5"/>
  <line x1="130" y1="45" x2="130" y2="25" stroke="#ff6e40" stroke-width="2.5"/>
  <!-- Emitter with arrow -->
  <line x1="80" y1="125" x2="130" y2="155" stroke="#ff6e40" stroke-width="2.5"/>
  <line x1="130" y1="155" x2="130" y2="175" stroke="#ff6e40" stroke-width="2.5"/>
  <polygon points="120,148 130,155 122,140" fill="#ff6e40"/>
  <!-- Circle -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255,110,64,0.3)" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="28" y="105" fill="#ff6e40" font-size="14" font-weight="bold" font-family="sans-serif">B</text>
  <text x="138" y="30" fill="#ff6e40" font-size="14" font-weight="bold" font-family="sans-serif">C</text>
  <text x="138" y="178" fill="#ff6e40" font-size="14" font-weight="bold" font-family="sans-serif">E</text>
  <!-- Electron dots -->
  <circle cx="95" cy="85" r="3" fill="#4fc3f7"/>
  <circle cx="105" cy="92" r="3" fill="#4fc3f7"/>
  <circle cx="110" cy="78" r="3" fill="#4fc3f7"/>
  <!-- NPN label -->
  <text x="160" y="105" fill="rgba(255,255,255,0.5)" font-size="12" font-weight="600" font-family="sans-serif">NPN</text>
</svg>
