<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Base plate -->
  <rect x="35" y="160" width="130" height="14" rx="4" fill="#37474f"/>
  <!-- Left upright -->
  <rect x="50" y="32" width="12" height="130" rx="3" fill="#455a64"/>
  <!-- Right upright -->
  <rect x="138" y="32" width="12" height="130" rx="3" fill="#455a64"/>
  <!-- Top beam -->
  <rect x="46" y="26" width="108" height="12" rx="4" fill="#546e7a"/>
  <!-- Pivot -->
  <circle cx="100" cy="34" r="7" fill="#607d8b" stroke="#78909c" stroke-width="1.5"/>
  <!-- Pendulum arm (at release angle ~140deg) -->
  <line x1="100" y1="34" x2="52" y2="114" stroke="#ff3d00" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Hammer head -->
  <rect x="42" y="108" width="18" height="12" rx="2" fill="#ff3d00" transform="rotate(-30 51 114)"/>
  <!-- Specimen on anvil -->
  <rect x="82" y="144" width="36" height="6" rx="1" fill="#b0bec5"/>
  <!-- V-notch -->
  <path d="M100 144 L98 147.5 L102 147.5 Z" fill="#0d1117"/>
  <!-- Anvil left support -->
  <path d="M86 150 L82 160" stroke="#607d8b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Anvil right support -->
  <path d="M114 150 L118 160" stroke="#607d8b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dial gauge -->
  <circle cx="155" cy="68" r="18" fill="#0d1117" stroke="#ff3d00" stroke-width="1.5"/>
  <circle cx="155" cy="68" r="14" fill="none" stroke="#2a3050" stroke-width="0.5"/>
  <!-- Dial needle -->
  <line x1="155" y1="68" x2="145" y2="57" stroke="#ff3d00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dial center -->
  <circle cx="155" cy="68" r="2" fill="#ff3d00"/>
  <!-- Dial label -->
  <text x="155" y="80" text-anchor="middle" font-size="6" font-family="monospace" fill="#ff3d00">J</text>
  <!-- Dial ticks -->
  <path d="M155 52 L155 54 M143 60 L144.5 61.5 M167 60 L165.5 61.5 M141 68 L143 68 M169 68 L167 68" stroke="#6b7a99" stroke-width="0.7"/>
  <!-- Impact flash starburst -->
  <circle cx="100" cy="144" r="5" fill="#ff3d00" opacity="0.35"/>
  <circle cx="100" cy="144" r="8" fill="#ff3d00" opacity="0.15"/>
  <!-- Swing arc (dashed) -->
  <path d="M52 114 A 80 80 0 0 1 148 114" fill="none" stroke="#ff3d00" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
</svg>
