<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Container outline -->
  <rect x="18" y="50" width="90" height="100" rx="6" fill="#161b27" stroke="#2a3050" stroke-width="2"/>
  <!-- Piston (right wall) -->
  <rect x="101" y="50" width="7" height="100" rx="3" fill="#334166"/>
  <rect x="101" y="50" width="2" height="100" fill="#9c27b0" opacity="0.7"/>

  <!-- Gas particles -->
  <!-- Row 1 -->
  <circle cx="38" cy="72" r="5" fill="#ce93d8" opacity="0.9"/>
  <circle cx="60" cy="68" r="5" fill="#ab47bc" opacity="0.9"/>
  <circle cx="82" cy="74" r="5" fill="#ce93d8" opacity="0.9"/>
  <!-- Row 2 -->
  <circle cx="45" cy="100" r="5" fill="#ab47bc" opacity="0.9"/>
  <circle cx="70" cy="96" r="5" fill="#ce93d8" opacity="0.9"/>
  <circle cx="92" cy="103" r="5" fill="#9c27b0" opacity="0.9"/>
  <!-- Row 3 -->
  <circle cx="32" cy="128" r="5" fill="#ce93d8" opacity="0.9"/>
  <circle cx="57" cy="132" r="5" fill="#ab47bc" opacity="0.9"/>
  <circle cx="80" cy="126" r="5" fill="#ce93d8" opacity="0.9"/>

  <!-- Motion lines -->
  <line x1="48" y1="72" x2="57" y2="72" stroke="#9c27b0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="73" y1="100" x2="82" y2="95" stroke="#9c27b0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="37" y1="130" x2="44" y2="126" stroke="#9c27b0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- PV graph area -->
  <!-- Axes -->
  <line x1="122" y1="55" x2="122" y2="148" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="122" y1="148" x2="185" y2="148" stroke="#2a3050" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="120" y="52" font-family="sans-serif" font-size="9" fill="#6b7a99" text-anchor="middle">P</text>
  <text x="188" y="151" font-family="sans-serif" font-size="9" fill="#6b7a99">V</text>

  <!-- Isotherms -->
  <path d="M126,60 Q140,75 162,148" fill="none" stroke="#9c27b0" stroke-width="1" opacity="0.35"/>
  <path d="M126,75 Q145,95 175,148" fill="none" stroke="#9c27b0" stroke-width="2" opacity="0.75"/>
  <path d="M126,95 Q152,118 185,148" fill="none" stroke="#9c27b0" stroke-width="1" opacity="0.35"/>

  <!-- Current state dot -->
  <circle cx="152" cy="110" r="5" fill="#ce93d8" stroke="white" stroke-width="1.5"/>
  <circle cx="152" cy="110" r="9" fill="#9c27b0" opacity="0.2"/>

  <!-- Formula label -->
  <text x="100" y="175" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#9c27b0" text-anchor="middle">PV = nRT</text>
</svg>
