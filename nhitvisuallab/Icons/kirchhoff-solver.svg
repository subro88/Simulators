<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <!-- Two-loop circuit -->
  <!-- Loop 1 (left) -->
  <rect x="30" y="50" width="70" height="90" rx="4" fill="none" stroke="#66bb6a" stroke-width="3"/>
  <!-- Loop 2 (right) -->
  <rect x="100" y="50" width="70" height="90" rx="4" fill="none" stroke="#66bb6a" stroke-width="3"/>
  <!-- Shared branch (center) -->
  <line x1="100" y1="50" x2="100" y2="140" stroke="#a5d6a7" stroke-width="3.5"/>
  <!-- Nodes -->
  <circle cx="100" cy="50" r="5" fill="#66bb6a"/>
  <circle cx="100" cy="140" r="5" fill="#66bb6a"/>
  <circle cx="30" cy="50" r="4" fill="#fff"/>
  <circle cx="30" cy="140" r="4" fill="#fff"/>
  <circle cx="170" cy="50" r="4" fill="#fff"/>
  <circle cx="170" cy="140" r="4" fill="#fff"/>
  <!-- Current arrows Loop 1 -->
  <path d="M55,80 L65,90 L55,100" fill="none" stroke="#81c784" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="78" fill="#81c784" font-size="14" font-weight="700" text-anchor="middle" font-family="sans-serif">I1</text>
  <!-- Current arrows Loop 2 -->
  <path d="M125,80 L135,90 L125,100" fill="none" stroke="#81c784" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="78" fill="#81c784" font-size="14" font-weight="700" text-anchor="middle" font-family="sans-serif">I2</text>
  <!-- Resistor symbols (zigzag on top branches) -->
  <polyline points="45,50 48,42 54,58 60,42 66,58 72,42 75,50" fill="none" stroke="#dde3f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="115,50 118,42 124,58 130,42 136,58 142,42 145,50" fill="none" stroke="#dde3f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Resistor on shared branch -->
  <polyline points="100,80 92,83 108,89 92,95 108,101 92,107 100,110" fill="none" stroke="#dde3f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Voltage sources (circles with +/-) -->
  <circle cx="30" cy="95" r="10" fill="none" stroke="#f5c842" stroke-width="2"/>
  <text x="30" y="92" fill="#f5c842" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">+</text>
  <text x="30" y="103" fill="#f5c842" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">-</text>
  <circle cx="170" cy="95" r="10" fill="none" stroke="#f5c842" stroke-width="2"/>
  <text x="170" y="92" fill="#f5c842" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">+</text>
  <text x="170" y="103" fill="#f5c842" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">-</text>
  <!-- Labels -->
  <text x="100" y="168" fill="#66bb6a" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">KVL &amp; KCL</text>
  <text x="100" y="185" fill="#6b7a99" font-size="11" text-anchor="middle" font-family="sans-serif">Kirchhoff's Laws</text>
</svg>