<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- two overlapping plates -->
  <rect x="26" y="74" width="86" height="34" rx="3" fill="#7d8a9c" stroke="#cdd6e3" stroke-width="2"/>
  <rect x="88" y="92" width="86" height="34" rx="3" fill="#5a6678" stroke="#cdd6e3" stroke-width="2"/>
  <!-- overlap highlight -->
  <rect x="88" y="92" width="24" height="16" fill="#4d8fb0" opacity="0.28"/>
  <!-- rivet rows (zigzag) -->
  <g fill="#4d8fb0" stroke="#8fd0ec" stroke-width="2">
    <circle cx="98" cy="100" r="9"/>
    <circle cx="98" cy="100" r="3.5" fill="#1f2535" stroke="none"/>
  </g>
  <!-- load arrows -->
  <g stroke="#ff7043" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="40" y1="58" x2="18" y2="58"/>
    <line x1="160" y1="142" x2="182" y2="142"/>
  </g>
  <polygon points="18,58 28,53 28,63" fill="#ff7043"/>
  <polygon points="182,142 172,137 172,147" fill="#ff7043"/>
  <!-- pitch dimension -->
  <g stroke="#f5c842" stroke-width="2.5">
    <line x1="50" y1="150" x2="120" y2="150"/>
  </g>
  <polygon points="50,150 58,146 58,154" fill="#f5c842"/>
  <polygon points="120,150 112,146 112,154" fill="#f5c842"/>
  <text x="85" y="170" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f5c842" text-anchor="middle">p</text>
  <!-- efficiency tag -->
  <text x="100" y="44" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#4d8fb0" text-anchor="middle">&#951;</text>
</svg>
