<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Spindle (vertical axis) -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sleeve (small rectangle on spindle) -->
  <rect x="28" y="34" width="8" height="6" rx="1.5" fill="#6a1b9a" opacity="0.7"/>

  <!-- Upper pivot point -->
  <circle cx="32" cy="14" r="2" fill="#6a1b9a"/>

  <!-- Left arm (upper) -->
  <line x1="32" y1="14" x2="14" y2="30" stroke="#6a1b9a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm (lower to sleeve) -->
  <line x1="14" y1="30" x2="28" y2="37" stroke="#6a1b9a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2"/>

  <!-- Right arm (upper) -->
  <line x1="32" y1="14" x2="50" y2="30" stroke="#6a1b9a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm (lower to sleeve) -->
  <line x1="50" y1="30" x2="36" y2="37" stroke="#6a1b9a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2"/>

  <!-- Left ball mass -->
  <circle cx="14" cy="30" r="5" fill="#6a1b9a" opacity="0.85"/>
  <!-- Right ball mass -->
  <circle cx="50" cy="30" r="5" fill="#6a1b9a" opacity="0.85"/>

  <!-- Rotation arrows (curved) -->
  <path d="M22 8 A12 12 0 0 1 42 8" fill="none" stroke="#6a1b9a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <polygon points="42,8 39,5 40,10" fill="#6a1b9a" opacity="0.5"/>

  <!-- Base -->
  <line x1="22" y1="58" x2="42" y2="58" stroke="#6a1b9a" stroke-width="2" stroke-linecap="round"/>
</svg>
