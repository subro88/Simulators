<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Bottom fixed support (hatching) -->
  <line x1="60" y1="168" x2="140" y2="168" stroke="#2a3050" stroke-width="3"/>
  <line x1="68" y1="172" x2="60" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="78" y1="172" x2="70" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="88" y1="172" x2="80" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="98" y1="172" x2="90" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="108" y1="172" x2="100" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="118" y1="172" x2="110" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="128" y1="172" x2="120" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <line x1="138" y1="172" x2="130" y2="168" stroke="#2a3050" stroke-width="1.5"/>
  <!-- Top pinned support (triangle) -->
  <polygon points="100,32 88,22 112,22" fill="none" stroke="#2a3050" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Straight column (ghost) -->
  <rect x="93" y="32" width="14" height="136" rx="2" fill="none" stroke="#2a3050" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Buckled column (sinusoidal curve) -->
  <path d="M100,32 C120,60 80,100 110,140 C115,150 105,160 100,168" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Load arrow -->
  <line x1="100" y1="12" x2="100" y2="28" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="100,32 95,24 105,24" fill="#ff5555"/>
  <!-- Small P label -->
  <text x="110" y="18" fill="#ff5555" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">P</text>
  <!-- Deflection arrow -->
  <line x1="100" y1="100" x2="116" y2="100" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="118" y="104" fill="#00e5ff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">&#948;</text>
</svg>