<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <text x="100" y="30" text-anchor="middle" fill="#e64a19" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">RADIATION</text>

  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c0"/>
      <stop offset="0.4" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#e64a19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff7c0"/>
      <stop offset="0.6" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#bf360c"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="100" cy="110" r="78" fill="url(#glow)"/>

  <!-- Hot body -->
  <circle cx="100" cy="110" r="36" fill="url(#body)" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Radiation rays -->
  <g stroke="#ff8a65" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="64" x2="100" y2="50"/>
    <line x1="100" y1="170" x2="100" y2="156"/>
    <line x1="146" y1="110" x2="160" y2="110"/>
    <line x1="54" y1="110" x2="40" y2="110"/>
    <line x1="135" y1="75" x2="146" y2="64"/>
    <line x1="65" y1="75" x2="54" y2="64"/>
    <line x1="135" y1="145" x2="146" y2="156"/>
    <line x1="65" y1="145" x2="54" y2="156"/>
  </g>

  <!-- Label -->
  <text x="100" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">T⁴</text>

  <text x="100" y="195" text-anchor="middle" fill="#6b7a99" font-family="Courier New, monospace" font-size="9">P = εσAT⁴</text>
</svg>
