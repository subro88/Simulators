<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Top plate -->
  <rect x="20" y="60" width="160" height="28" rx="3" fill="#546e7a" stroke="#78909c" stroke-width="2"/>
  <!-- Bottom plate -->
  <rect x="20" y="92" width="160" height="28" rx="3" fill="#607d8b" stroke="#78909c" stroke-width="2"/>
  <!-- Rivet 1 - snap head top -->
  <ellipse cx="65" cy="60" rx="14" ry="8" fill="#ff7043"/>
  <rect x="57" y="60" width="16" height="60" fill="#4fc3f7" stroke="#0288d1" stroke-width="1.5"/>
  <!-- Rivet 1 - closing head bottom -->
  <ellipse cx="65" cy="120" rx="14" ry="8" fill="#ff7043"/>
  <!-- Rivet 2 - snap head top -->
  <ellipse cx="135" cy="60" rx="14" ry="8" fill="#ff7043"/>
  <rect x="127" y="60" width="16" height="60" fill="#4fc3f7" stroke="#0288d1" stroke-width="1.5"/>
  <!-- Rivet 2 - closing head bottom -->
  <ellipse cx="135" cy="120" rx="14" ry="8" fill="#ff7043"/>
  <!-- Dimension line -->
  <line x1="65" y1="145" x2="135" y2="145" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="160" text-anchor="middle" fill="#3ddc84" font-family="Courier New, monospace" font-size="14" font-weight="bold">p</text>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" fill="#ff7043" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">RIVETED JOINT</text>
</svg>