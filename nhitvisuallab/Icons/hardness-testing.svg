<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Machine frame (vertical pillars) -->
  <rect x="55" y="32" width="8" height="130" rx="2" fill="#37474f" opacity="0.7"/>
  <rect x="137" y="32" width="8" height="130" rx="2" fill="#37474f" opacity="0.7"/>
  <!-- Top crossbar -->
  <rect x="50" y="30" width="100" height="12" rx="3" fill="#455a64" opacity="0.8"/>
  <!-- Bottom base -->
  <rect x="45" y="140" width="110" height="14" rx="3" fill="#455a64" opacity="0.8"/>

  <!-- Specimen block on base -->
  <rect x="70" y="118" width="60" height="22" rx="2" fill="#78909c" stroke="#90a4ae" stroke-width="1"/>

  <!-- Indenter assembly (diamond cone shape) -->
  <g transform="translate(100,42)">
    <!-- Indenter holder -->
    <rect x="-10" y="0" width="20" height="24" rx="3" fill="#546e7a"/>
    <!-- Diamond indenter tip (inverted triangle) -->
    <polygon points="0,56 -8,24 8,24" fill="#e53935" opacity="0.9"/>
    <!-- Highlight line on indenter -->
    <line x1="0" y1="26" x2="0" y2="52" stroke="#ef9a9a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Indentation mark on specimen -->
  <ellipse cx="100" cy="119" rx="6" ry="2.5" fill="#263238" opacity="0.7"/>
  <ellipse cx="100" cy="119" rx="3.5" ry="1.5" fill="#1f2535" opacity="0.6"/>

  <!-- Load arrow (downward force) -->
  <line x1="100" y1="16" x2="100" y2="34" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="100,38 95,30 105,30" fill="#e53935"/>
  <text x="100" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#ef9a9a">F</text>

  <!-- Measurement lines (right side - diagonal of impression) -->
  <line x1="140" y1="105" x2="160" y2="85" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <line x1="140" y1="105" x2="143" y2="102" stroke="#f5c842" stroke-width="1.5" opacity="0.8"/>
  <line x1="160" y1="85" x2="157" y2="88" stroke="#f5c842" stroke-width="1.5" opacity="0.8"/>
  <text x="155" y="80" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" fill="#f5c842">d</text>

  <!-- Label -->
  <text x="100" y="175" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#ef9a9a" letter-spacing="1">HARDNESS</text>
</svg>