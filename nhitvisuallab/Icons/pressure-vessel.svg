<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Wall fill: annular ring (midpoint r=58.5, stroke-width=13 covers r=52 to r=65) -->
  <circle cx="100" cy="100" r="58.5" fill="none" stroke="#bf360c" stroke-width="13" opacity="0.7"/>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#bf360c" stroke-width="3"/>

  <!-- Inner circle -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#bf360c" stroke-width="1.5" opacity="0.5"/>

  <!-- Pressure arrows: 4 outward arrows at 0°, 90°, 180°, 270° -->
  <!-- Arrow at 0° (right): line from r=30 to r=48, arrowhead -->
  <line x1="130" y1="100" x2="148" y2="100" stroke="#ff8a65" stroke-width="2"/>
  <polygon points="148,100 142,96 142,104" fill="#ff8a65"/>

  <!-- Arrow at 90° (down): line from r=30 to r=48 -->
  <line x1="100" y1="130" x2="100" y2="148" stroke="#ff8a65" stroke-width="2"/>
  <polygon points="100,148 96,142 104,142" fill="#ff8a65"/>

  <!-- Arrow at 180° (left): line from r=30 to r=48 -->
  <line x1="70" y1="100" x2="52" y2="100" stroke="#ff8a65" stroke-width="2"/>
  <polygon points="52,100 58,96 58,104" fill="#ff8a65"/>

  <!-- Arrow at 270° (up): line from r=30 to r=48 -->
  <line x1="100" y1="70" x2="100" y2="52" stroke="#ff8a65" stroke-width="2"/>
  <polygon points="100,52 96,58 104,58" fill="#ff8a65"/>

  <!-- Center label "p" -->
  <text x="100" y="107" fill="#dde3f0" font-size="18" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">p</text>

  <!-- Sigma label on right side -->
  <text x="174" y="104" fill="#bf360c" font-size="14" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">σ</text>
</svg>
