<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>

  <!-- Protractor body - main disc -->
  <circle cx="100" cy="110" r="68" fill="none" stroke="#546e7a" stroke-width="6"/>
  <circle cx="100" cy="110" r="68" fill="none" stroke="#78909c" stroke-width="2"/>

  <!-- Inner disc fill -->
  <circle cx="100" cy="110" r="62" fill="#263238" opacity="0.5"/>

  <!-- Main scale degree markings - major every 30 deg -->
  <!-- 0 deg (right) -->
  <line x1="162" y1="110" x2="168" y2="110" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 30 deg -->
  <line x1="156.9" y1="76" x2="162.1" y2="73" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 60 deg -->
  <line x1="134" y1="51.1" x2="137" y2="45.9" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 90 deg (top) -->
  <line x1="100" y1="42" x2="100" y2="36" stroke="#ffd600" stroke-width="2"/>
  <!-- 120 deg -->
  <line x1="66" y1="51.1" x2="63" y2="45.9" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 150 deg -->
  <line x1="43.1" y1="76" x2="37.9" y2="73" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 180 deg (left) -->
  <line x1="32" y1="110" x2="38" y2="110" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 210 deg -->
  <line x1="43.1" y1="144" x2="37.9" y2="147" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 240 deg -->
  <line x1="66" y1="168.9" x2="63" y2="174.1" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 270 deg (bottom) -->
  <line x1="100" y1="178" x2="100" y2="184" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 300 deg -->
  <line x1="134" y1="168.9" x2="137" y2="174.1" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 330 deg -->
  <line x1="156.9" y1="144" x2="162.1" y2="147" stroke="#b0bec5" stroke-width="1.5"/>

  <!-- Minor tick marks every 10 degrees (selected) -->
  <line x1="159.8" y1="93.3" x2="164.5" y2="91.6" stroke="#78909c" stroke-width="0.8"/>
  <line x1="149.5" y1="62.4" x2="153.6" y2="59.5" stroke="#78909c" stroke-width="0.8"/>
  <line x1="118.6" y1="44.5" x2="120.3" y2="39.8" stroke="#78909c" stroke-width="0.8"/>
  <line x1="81.4" y1="44.5" x2="79.7" y2="39.8" stroke="#78909c" stroke-width="0.8"/>
  <line x1="50.5" y1="62.4" x2="46.4" y2="59.5" stroke="#78909c" stroke-width="0.8"/>
  <line x1="40.2" y1="93.3" x2="35.5" y2="91.6" stroke="#78909c" stroke-width="0.8"/>

  <!-- Degree labels -->
  <text x="172" y="113" font-family="Arial,sans-serif" font-size="8" fill="#90a4ae" text-anchor="middle">0</text>
  <text x="100" y="30" font-family="Arial,sans-serif" font-size="8" fill="#ffd600" text-anchor="middle" font-weight="bold">90</text>
  <text x="28" y="113" font-family="Arial,sans-serif" font-size="8" fill="#90a4ae" text-anchor="middle">180</text>
  <text x="100" y="193" font-family="Arial,sans-serif" font-size="8" fill="#90a4ae" text-anchor="middle">270</text>

  <!-- Vernier scale strip (arc near main scale) -->
  <path d="M 145 65 A 55 55 0 0 0 55 65" fill="none" stroke="#ffd600" stroke-width="3" opacity="0.7"/>
  <!-- Vernier division ticks -->
  <line x1="140" y1="69" x2="137" y2="74" stroke="#ffd600" stroke-width="1" opacity="0.8"/>
  <line x1="130" y1="59" x2="128" y2="64" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="120" y1="52" x2="118.5" y2="57" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="110" y1="48" x2="109" y2="53" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="100" y1="46.5" x2="100" y2="51.5" stroke="#ffd600" stroke-width="1.2" opacity="0.9"/>
  <line x1="90" y1="48" x2="91" y2="53" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="80" y1="52" x2="81.5" y2="57" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="70" y1="59" x2="72" y2="64" stroke="#ffd600" stroke-width="0.8" opacity="0.6"/>
  <line x1="60" y1="69" x2="63" y2="74" stroke="#ffd600" stroke-width="1" opacity="0.8"/>

  <!-- Blade extending from center at ~45 degrees -->
  <line x1="100" y1="110" x2="170" y2="40" stroke="#ffd600" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="170" y2="40" stroke="#fff176" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Center pivot -->
  <circle cx="100" cy="110" r="5" fill="#455a64"/>
  <circle cx="100" cy="110" r="3" fill="#ffd600"/>
  <circle cx="100" cy="110" r="1.5" fill="#fff176"/>

  <!-- Coincidence highlight mark -->
  <circle cx="130" cy="59" r="2.5" fill="#ffd600" opacity="0.9"/>
  <circle cx="130" cy="59" r="5" fill="none" stroke="#ffd600" stroke-width="0.8" opacity="0.4"/>

  <!-- Label -->
  <text x="100" y="16" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#90a4ae" font-weight="bold" letter-spacing="0.5">BEVEL PROTRACTOR</text>
</svg>
