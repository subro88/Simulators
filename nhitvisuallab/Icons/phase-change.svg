<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Container -->
  <rect x="55" y="60" width="60" height="90" rx="6" fill="none" stroke="#26c6da" stroke-width="2.5"/>
  <!-- Liquid fill -->
  <rect x="57" y="95" width="56" height="53" rx="3" fill="#26c6da" fill-opacity="0.35"/>
  <!-- Wavy surface -->
  <path d="M57,95 Q71,92 86,95 T114,95" stroke="#26c6da" stroke-width="2" fill="none"/>
  <!-- Ice cubes (solid) -->
  <rect x="63" y="108" width="12" height="12" rx="2" fill="#81d4fa" stroke="#4fc3f7" stroke-width="1"/>
  <rect x="92" y="122" width="10" height="10" rx="2" fill="#81d4fa" stroke="#4fc3f7" stroke-width="1"/>
  <!-- Steam wisps (gas) above container -->
  <circle cx="75" cy="52" r="5" fill="#b3e5fc" fill-opacity="0.55"/>
  <circle cx="90" cy="42" r="7" fill="#b3e5fc" fill-opacity="0.4"/>
  <circle cx="105" cy="50" r="5" fill="#b3e5fc" fill-opacity="0.5"/>
  <circle cx="95" cy="32" r="6" fill="#b3e5fc" fill-opacity="0.3"/>
  <!-- Bubbles in liquid -->
  <circle cx="70" cy="138" r="2" fill="#fff" fill-opacity="0.7"/>
  <circle cx="83" cy="132" r="1.5" fill="#fff" fill-opacity="0.6"/>
  <circle cx="100" cy="140" r="2.2" fill="#fff" fill-opacity="0.7"/>
  <!-- Flame under container -->
  <path d="M70,152 Q65,162 72,172 Q78,178 85,172 Q92,166 86,160 Q80,155 82,150 Q77,153 70,152 Z" fill="#ffb74d" stroke="#f57c00" stroke-width="1"/>
  <path d="M90,152 Q85,164 93,174 Q100,178 105,172 Q110,165 103,158 Q98,153 98,148 Q93,152 90,152 Z" fill="#ffb74d" stroke="#f57c00" stroke-width="1"/>
  <!-- Heating curve icon on right -->
  <polyline points="130,145 140,145 145,125 160,125 162,105 175,105 180,85" fill="none" stroke="#26c6da" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Axes -->
  <line x1="130" y1="75" x2="130" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <line x1="130" y1="150" x2="185" y2="150" stroke="#6b7a99" stroke-width="1"/>
  <!-- Plateau dots -->
  <circle cx="140" cy="145" r="2" fill="#26c6da"/>
  <circle cx="145" cy="125" r="2" fill="#26c6da"/>
  <circle cx="160" cy="125" r="2" fill="#26c6da"/>
  <circle cx="162" cy="105" r="2" fill="#26c6da"/>
  <circle cx="175" cy="105" r="2" fill="#26c6da"/>
  <!-- S/L/G labels -->
  <text x="85" y="185" fill="#80deea" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" text-anchor="middle">S ↔ L ↔ G</text>
</svg>
