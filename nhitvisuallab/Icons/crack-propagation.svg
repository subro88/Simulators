<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Plate -->
  <rect x="32" y="60" width="136" height="80" rx="3" fill="#2a3050" stroke="#4a5278" stroke-width="2"/>
  <!-- Stress field gradient near crack tip -->
  <defs>
    <radialGradient id="tipGlowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc832" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff6e40" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6e40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tipGlowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc832" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff6e40" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6e40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2535"/>
      <stop offset="0.5" stop-color="#ff6e40" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1f2535"/>
    </linearGradient>
  </defs>
  <!-- Stress field band around crack -->
  <rect x="36" y="85" width="128" height="30" fill="url(#fieldGrad)" opacity="0.55"/>
  <!-- Tip glows -->
  <circle cx="72" cy="100" r="18" fill="url(#tipGlowL)"/>
  <circle cx="128" cy="100" r="18" fill="url(#tipGlowR)"/>
  <!-- Crack (centre crack) -->
  <line x1="72" y1="100" x2="128" y2="100" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Plastic zones (dashed) -->
  <circle cx="72" cy="100" r="7" fill="none" stroke="#f5c842" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="128" cy="100" r="7" fill="none" stroke="#f5c842" stroke-width="1.2" stroke-dasharray="2,2"/>
  <!-- Stress arrows top -->
  <g stroke="#ff6e40" stroke-width="2" fill="#ff6e40">
    <line x1="60" y1="38" x2="60" y2="56"/>
    <polygon points="56,50 60,60 64,50"/>
    <line x1="100" y1="38" x2="100" y2="56"/>
    <polygon points="96,50 100,60 104,50"/>
    <line x1="140" y1="38" x2="140" y2="56"/>
    <polygon points="136,50 140,60 144,50"/>
  </g>
  <!-- Stress arrows bottom -->
  <g stroke="#ff6e40" stroke-width="2" fill="#ff6e40">
    <line x1="60" y1="162" x2="60" y2="144"/>
    <polygon points="56,150 60,140 64,150"/>
    <line x1="100" y1="162" x2="100" y2="144"/>
    <polygon points="96,150 100,140 104,150"/>
    <line x1="140" y1="162" x2="140" y2="144"/>
    <polygon points="136,150 140,140 144,150"/>
  </g>
  <!-- K_I label -->
  <text x="100" y="180" text-anchor="middle" fill="#dde3f0" font-family="Courier New, monospace" font-size="14" font-weight="700">K&#8321;</text>
</svg>
