  <line x1="120" y1="140" x2="170" y2="140" stroke="#ab47bc" stroke-width="2" stroke-dasharray="5,4" opacity="0.6"/>
  <!-- Axis lines -->
  <line x1="28" y1="155" x2="175" y2="155" stroke="#6b7a99" stroke-width="1.5"/>
  <line x1="28" y1="155" x2="28" y2="45" stroke="#6b7a99" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="100" y="172" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">N (cycles)</text>
  <text x="18" y="100" fill="#6b7a99" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90,18,100)">&#963;</text>
  <!-- Crack symbol -->
