<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background rounded rect -->
  <rect x="4" y="4" width="192" height="192" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>

  <!-- Circuit wires -->
  <!-- Input wire (left) -->
  <line x1="30" y1="100" x2="60" y2="100" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Output wire (right) -->
  <line x1="120" y1="100" x2="170" y2="100" stroke="#f44336" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Diode symbol (triangle + bar) -->
  <!-- Triangle (anode side) -->
  <polygon points="60,82 60,118 100,100" fill="rgba(244,67,54,0.25)" stroke="#f44336" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cathode bar -->
  <line x1="100" y1="82" x2="100" y2="118" stroke="#f44336" stroke-width="3" stroke-linecap="round"/>
  <!-- Wire through diode -->
  <line x1="100" y1="100" x2="120" y2="100" stroke="#f44336" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rectified waveform (bottom area) -->
  <!-- Input sine hint (dimmed, top) -->
  <path d="M 30,52 Q 50,30 70,52 Q 90,74 110,52 Q 130,30 150,52 Q 170,74 190,52"
    fill="none" stroke="rgba(66,165,245,0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Rectified output (bottom) -->
  <path d="M 30,160 Q 50,130 70,160 Q 70,160 70,160 L 70,160 Q 90,130 110,160 Q 110,160 110,160 L 110,160 Q 130,130 150,160 Q 150,160 150,160 L 150,160 Q 170,130 190,160"
    fill="none" stroke="#f44336" stroke-width="2" stroke-linecap="round"/>

  <!-- Simplified: just half-arches for rectified wave -->
  <path d="M 25,160 Q 45,128 65,160 M 65,160 L 105,160 M 105,160 Q 125,128 145,160 M 145,160 L 175,160"
    fill="none" stroke="#f44336" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Baseline for rectified wave -->
  <line x1="25" y1="160" x2="175" y2="160" stroke="rgba(107,122,153,0.4)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- DC average line -->
  <line x1="25" y1="150" x2="175" y2="150" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Current flow dots -->
  <circle cx="135" cy="100" r="3" fill="#3ddc84" opacity="0.9"/>
  <circle cx="155" cy="100" r="3" fill="#3ddc84" opacity="0.6"/>

  <!-- Label -->
  <text x="100" y="185" fill="#f44336" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">RECTIFIER</text>
</svg>
