<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1f2535" stroke="#2a3050" stroke-width="2"/>
  <!-- Beaker body -->
  <rect x="55" y="60" width="70" height="90" rx="3" fill="none" stroke="rgba(180,210,240,0.35)" stroke-width="3"/>
  <!-- Beaker lip -->
  <line x1="47" y1="60" x2="55" y2="67" stroke="rgba(180,210,240,0.35)" stroke-width="2.5"/>
  <line x1="125" y1="67" x2="133" y2="60" stroke="rgba(180,210,240,0.35)" stroke-width="2.5"/>
  <!-- Liquid in beaker (purple tinted) -->
  <rect x="57" y="90" width="66" height="58" rx="2" fill="#7c4dff" opacity="0.35"/>
  <!-- Measurement marks -->
  <line x1="62" y1="85" x2="72" y2="85" stroke="rgba(180,210,240,0.2)" stroke-width="1"/>
  <line x1="62" y1="105" x2="72" y2="105" stroke="rgba(180,210,240,0.2)" stroke-width="1"/>
  <line x1="62" y1="125" x2="72" y2="125" stroke="rgba(180,210,240,0.2)" stroke-width="1"/>
  <!-- Litmus strip dipping in -->
  <rect x="100" y="42" width="12" height="70" rx="2" fill="#7c4dff" opacity="0.9"/>
  <!-- Strip tab (white handle) -->
  <rect x="101" y="42" width="10" height="10" rx="1" fill="#e0e0e0"/>
  <!-- pH colour gradient strip on left -->
  <rect x="28" y="55" width="10" height="10" rx="1" fill="#ff1744"/>
  <rect x="28" y="65" width="10" height="10" rx="1" fill="#ff9800"/>
  <rect x="28" y="75" width="10" height="10" rx="1" fill="#ffeb3b"/>
  <rect x="28" y="85" width="10" height="10" rx="1" fill="#4caf50"/>
  <rect x="28" y="95" width="10" height="10" rx="1" fill="#00bcd4"/>
  <rect x="28" y="105" width="10" height="10" rx="1" fill="#3f51b5"/>
  <rect x="28" y="115" width="10" height="10" rx="1" fill="#9c27b0"/>
  <!-- pH label -->
  <text x="33" y="140" font-family="Segoe UI, sans-serif" font-size="9" fill="#6b7a99" text-anchor="middle">pH</text>
  <!-- Title -->
  <text x="100" y="172" font-family="Segoe UI, sans-serif" font-size="13" fill="#dde3f0" text-anchor="middle" font-weight="600">Litmus Paper Test</text>
</svg>
