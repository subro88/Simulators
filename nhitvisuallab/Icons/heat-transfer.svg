<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1f2535"/>
  <rect width="200" height="200" rx="24" fill="none" stroke="#2a3050" stroke-width="1.5"/>

  <!-- Hot wall (left) -->
  <rect x="30" y="45" width="18" height="110" rx="3" fill="#d32f2f" opacity="0.85"/>
  <text x="39" y="38" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#ff6659">T&#x2081;</text>

  <!-- Cold wall (right) -->
  <rect x="152" y="45" width="18" height="110" rx="3" fill="#42a5f5" opacity="0.85"/>
  <text x="161" y="38" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#42a5f5">T&#x2082;</text>

  <!-- Conduction arrows (straight, through material) -->
  <line x1="55" y1="70" x2="145" y2="70" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="145,70 137,66 137,74" fill="#ff8a65"/>

  <!-- Convection wavy arrow -->
  <path d="M55,100 C70,90 80,110 95,100 C110,90 120,110 145,100" fill="none" stroke="#f5c842" stroke-width="2"/>
  <polygon points="145,100 137,96 137,104" fill="#f5c842"/>

  <!-- Radiation wavy lines -->
  <path d="M55,130 C65,122 75,138 85,130 C95,122 105,138 115,130 C125,122 135,138 145,130" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <polygon points="145,130 137,126 137,134" fill="#d32f2f"/>

  <!-- Temperature gradient bar -->
  <defs>
    <linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>
  <rect x="40" y="170" width="120" height="8" rx="4" fill="url(#tgrad)"/>

  <!-- Labels -->
  <text x="100" y="192" text-anchor="middle" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#d32f2f">Heat Transfer</text>
</svg>
