<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1f2535" stroke="#2a3050" stroke-width="3"/>
  <!-- Ground line -->
  <line x1="35" y1="155" x2="170" y2="155" stroke="#6b7a99" stroke-width="2" stroke-linecap="round"/>
  <!-- Ground hatch marks -->
  <line x1="45" y1="155" x2="40" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="60" y1="155" x2="55" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="75" y1="155" x2="70" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="90" y1="155" x2="85" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="105" y1="155" x2="100" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="120" y1="155" x2="115" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="135" y1="155" x2="130" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="150" y1="155" x2="145" y2="162" stroke="#3a4568" stroke-width="1"/>
  <line x1="165" y1="155" x2="160" y2="162" stroke="#3a4568" stroke-width="1"/>
  <!-- Launch angle arc -->
  <path d="M50,155 A20,20 0 0,0 63,140" fill="none" stroke="#aed581" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62" y="150" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#aed581">θ</text>
  <!-- Parabolic trajectory path -->
  <path d="M42,155 Q65,60 115,70 Q140,76 160,155" fill="none" stroke="#7cb342" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Filled trajectory glow -->
  <path d="M42,155 Q65,60 115,70 Q140,76 160,155" fill="none" stroke="rgba(124,179,66,0.25)" stroke-width="8" stroke-linecap="round"/>
  <!-- Ball at peak -->
  <circle cx="100" cy="65" r="8" fill="#4caf50" stroke="#7cb342" stroke-width="2"/>
  <circle cx="97" cy="62" r="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Launch point indicator -->
  <circle cx="42" cy="155" r="4" fill="#7cb342"/>
  <!-- Landing point indicator -->
  <circle cx="160" cy="155" r="4" fill="#7cb342" opacity="0.6"/>
  <!-- Velocity arrow at launch -->
  <line x1="42" y1="155" x2="58" y2="130" stroke="#aed581" stroke-width="2" stroke-linecap="round"/>
  <polygon points="60,127 54,131 56,136" fill="#aed581"/>
  <!-- Max height dashed line -->
  <line x1="100" y1="65" x2="100" y2="155" stroke="#6b7a99" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="106" y="115" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#6b7a99">H</text>
  <!-- Range indicator -->
  <line x1="42" y1="165" x2="160" y2="165" stroke="#7cb342" stroke-width="1.2" stroke-opacity="0.6"/>
  <polygon points="42,165 47,163 47,167" fill="#7cb342" opacity="0.6"/>
  <polygon points="160,165 155,163 155,167" fill="#7cb342" opacity="0.6"/>
  <text x="96" y="176" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#7cb342">R</text>
</svg>
