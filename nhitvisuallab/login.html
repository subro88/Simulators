<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NHIT Visual Lab Simulators</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <img src="/nhit-logo.png-updated.png" onerror="this.onerror=null; this.src='/brand/logo.png';" alt="NHIT Visual Lab" style="max-height: 48px; object-fit: contain; margin-bottom: 8px;" />
      <h1>NHIT Visual Lab</h1>
      <p>Interactive Engineering & Science Simulators</p>
    </div>

    <div id="errorBanner" class="error-banner" style="display: none;">
      ⚠️ Invalid username or password. Please check your credentials.
    </div>

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. nhit" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit">Sign In to Simulators</button>
    </form>

    <div class="credentials-hint">
      🔑 Preview access: Username: <strong>nhit</strong> &bull; Password: <strong>nhit</strong>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('errorBanner').style.display = 'block';
    }
  </script>
</body>
</html>
