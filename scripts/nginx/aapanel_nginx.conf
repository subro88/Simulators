# ==============================================================================
# aaPanel Production HTTPS & Reverse Proxy Nginx Configuration
# Target File: /www/server/panel/vhost/nginx/vlab.nhit.in.conf
# ==============================================================================

upstream vlab_aapanel_backend {
    # Blue-Green Zero-Downtime Slots
    server 127.0.0.1:8081 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:8083 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:8080 backup;
    keepalive 32;
}

# ── 1. HTTP -> HTTPS Automatic 301 Redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vlab.nhit.in;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/vlab.nhit.in;
    }

    # Force HTTPS redirect for all incoming traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS Production Server Block ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vlab.nhit.in;
    index index.html index.htm;
    root /www/wwwroot/vlab.nhit.in;

    # SSL Certificates (aaPanel managed / Let's Encrypt standard)
    ssl_certificate        /www/server/panel/vhost/cert/vlab.nhit.in/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/vlab.nhit.in/privkey.pem;
    
    # Modern TLS Security & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Include aaPanel auxiliary proxy settings if present
    include /www/server/panel/vhost/nginx/proxy/vlab.nhit.in/*.conf;

    # Gzip Compression for 3D Models & Simulation Assets
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript image/svg+xml model/gltf-binary model/gltf+json;
    gzip_vary on;

    client_max_body_size 100M;

    # Static 3D Model & Media Caching (.glb, .gltf, images, fonts)
    location ~* \.(glb|gltf|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        proxy_pass http://vlab_aapanel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Real-Time WebSocket Proxying for 3D Simulators (/ws/*)
    location /ws/ {
        proxy_pass http://vlab_aapanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Reverse Proxy Pass (FastAPI REST APIs, /login, /admin, & HTML Pages)
    location / {
        proxy_pass http://vlab_aapanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Automatic Zero-Downtime Failover between Blue/Green containers
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # aaPanel logs
    access_log  /www/wwwlogs/vlab.nhit.in.log;
    error_log  /www/wwwlogs/vlab.nhit.in.error.log;
}
