# ==============================================================================
# aaPanel Optimized Nginx Configuration for vlab.nhit.in
# Place in: /www/server/panel/vhost/nginx/vlab.nhit.in.conf
# ==============================================================================

upstream vlab_aapanel_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name vlab.nhit.in;
    index index.html index.htm;
    root /www/wwwroot/vlab.nhit.in;

    # SSL Certificate Configuration (aaPanel managed)
    # ssl_certificate    /www/server/panel/vhost/cert/vlab.nhit.in/fullchain.pem;
    # ssl_certificate_key    /www/server/panel/vhost/cert/vlab.nhit.in/privkey.pem;
    # ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # add_header Strict-Transport-Security "max-age=31536000";
    # error_page 497  https://$host$request_uri;

    # Include aaPanel standard SSL if already configured
    include /www/server/panel/vhost/nginx/proxy/vlab.nhit.in/*.conf;

    # Gzip Compression for 3D Models & Simulation WebGL Assets
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript image/svg+xml model/gltf-binary model/gltf+json;
    gzip_vary on;

    client_max_body_size 50M;

    # Root redirect to main portal
    location = / {
        return 301 /nhitvisuallab/index.html;
    }

    # Static 3D Model & Media Caching (.glb, .gltf, images, fonts)
    location ~* \.(glb|gltf|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        proxy_pass http://vlab_aapanel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Real-Time WebSocket Proxying for 3D Simulators (/ws/*)
    location /ws/ {
        proxy_pass http://vlab_aapanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Reverse Proxy Pass (REST APIs & HTML Pages)
    location / {
        proxy_pass http://vlab_aapanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # aaPanel logs
    access_log  /www/wwwlogs/vlab.nhit.in.log;
    error_log  /www/wwwlogs/vlab.nhit.in.error.log;
}
