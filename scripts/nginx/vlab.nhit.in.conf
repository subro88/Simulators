# Nginx Virtual Host Configuration for vlab.nhit.in
# Place in: /etc/nginx/sites-available/vlab.nhit.in.conf
# Symlink to: /etc/nginx/sites-enabled/vlab.nhit.in.conf

upstream vlab_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vlab.nhit.in;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vlab.nhit.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/vlab.nhit.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlab.nhit.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml model/gltf-binary model/gltf+json;

    client_max_body_size 50M;

    # Root redirect to main visual lab portal
    location = / {
        return 301 /nhitvisuallab/index.html;
    }

    # Static Assets Caching (GLB models, Icons, JS, CSS)
    location ~* \.(glb|gltf|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        proxy_pass http://vlab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # WebSocket Endpoints (/ws/*)
    location /ws/ {
        proxy_pass http://vlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Reverse Proxy Pass (REST APIs & HTML Pages)
    location / {
        proxy_pass http://vlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
