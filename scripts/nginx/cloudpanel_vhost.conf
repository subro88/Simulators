# ==============================================================================
# CloudPanel Nginx Virtual Host Configuration for vlab.nhit.in
# Paste this into CloudPanel -> Sites -> vlab.nhit.in -> Vhost tab
# ==============================================================================

upstream vlab_backend {
  server 127.0.0.1:8080 fail_timeout=0;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name vlab.nhit.in;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Gzip compression for simulations and assets
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml model/gltf-binary model/gltf+json;

  client_max_body_size 100M;

  # Root redirect to main portal
  location = / {
    return 301 /nhitvisuallab/index.html;
  }

  # Static 3D Models & Media Caching (.glb, .gltf, images, fonts)
  location ~* \.(glb|gltf|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
    proxy_pass http://vlab_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Real-Time WebSocket Connections (/ws/*)
  location /ws/ {
    proxy_pass http://vlab_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Standard Reverse Proxy Route
  location / {
    proxy_pass http://vlab_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /(robots.txt|favicon.ico) {
    proxy_pass http://vlab_backend;
    expires 30d;
  }
}
