services:
  nhitvisuallab:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nhitvisuallab:latest
    container_name: nhitvisuallab
    ports:
      - "8080:8080"
    volumes:
      # Live editing: mount the source over the baked copy so changes appear
      # immediately in the browser without rebuilding the image.
      - ./nhitvisuallab:/usr/share/nginx/html:ro
    restart: unless-stopped
