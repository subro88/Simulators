services:
  simulators:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: simulators-platform:latest
    container_name: simulators-platform
    ports:
      - "8080:8080"
    volumes:
      # Live editing: mount source directories for instant hot-reload
      - ./app:/workspace/app
      - ./static:/workspace/static
      - ./blender:/workspace/blender
      - ./nhitvisuallab:/workspace/nhitvisuallab:ro
      - ./frontend:/workspace/frontend:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
