server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;
    # Redirect root path to login page
    location = / {
        return 302 /login;
    }
    index index.html;

    # Serve directory requests via their index.html (e.g. /power-plant/)
    location / {
        try_files $uri $uri/ =404;
    }

    # No caching for HTML so live edits appear immediately (assets are still cached)
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Compress text assets for faster loads
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
